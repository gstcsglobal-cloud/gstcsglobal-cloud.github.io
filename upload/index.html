<style>

<h1>📤 CSV 업로드</h1>
<div class="sub">구글시트 대신 여기서 데이터를 올립니다. 파일을 고르면 <b>검사 → 표 비우기 → 적재 → 행수 대조</b>가 한 번에 진행됩니다.<br>
실적 3종(수선·자재·설치)은 시트와 같은 머리글의 CSV를 그대로, 나머지는 처음 이관 때와 같은 형식의 CSV를 올리면 됩니다.</div>

<div class="card">
  <h3>1. 어느 표에 올리나</h3>
  <select id="tsel"></select>
  <!-- 넣는 방식 셋. 10만행 제한으로 기간을 나눠 뽑을 때 앞 파일을 지우지 않으려면 «구간 교체»,
       기존 것을 하나도 건드리지 않고 뒤에 붙이려면 «이어붙이기».
       ⚠ 이어붙이기는 겹치는 구간을 «지우지 않으므로» 겹친 만큼 이중 계산된다
         (실측: 새 추출본의 대만분 6,534행 중 6,266건이 기존 표에도 있는 실적코드였다). -->
  <div id="modeBox" style="margin-top:12px">
    <label style="display:block;font-size:13px;margin-bottom:5px"><b>넣는 방식</b></label>
    <select id="modeSel" onchange="onMode()">
      <option value="full">통째 교체 — 표를 비우고 이 파일로 바꿉니다 (기존 전량 삭제)</option>
      <option value="win">겹치는 구간만 교체 — 이 파일이 덮는 사업부 × 기간만 갈아끼웁니다</option>
      <option value="add">겹치는 구간도 그대로 — 아무것도 지우지 않고 뒤에 이어붙입니다</option>
    </select>
    <div class="sub" id="modeHint" style="margin-top:6px"></div>
  </div>
</div>

<div class="card">
  <h3>2. CSV 파일</h3>
  <input type="file" id="fsel" accept=".csv,text/csv">
  <div id="chk" style="margin-top:10px"></div>
  <button class="btn" id="goBtn" disabled onclick="doUpload()">업로드 (기존 데이터를 이 파일로 교체)</button>
</div>
<div class="card"><h3>진행</h3><div id="log">—</div></div>

<script>
/* 관리자 1인용 도구라 단일 언어(한국어)다. 공개 페이지로 승격하면 T 규약(4개 언어)으로 옮길 것. */

/* 표 목록.
   mirror  — 컬럼이 snake_case 인 미러 표. 시트 머리글 CSV 를 GST.SM.SPEC 으로 해석해
             sheet-sync 의 toRows 와 «똑같은 규칙»으로 변환한다(t-mirror 가 지키는 그 규칙).
   import  — 컬럼이 시트 머리글 그대로인 표. CSV 헤더가 표 컬럼과 (정규화 후) 일치해야 한다. */
/* win — 구간 교체를 지원하는 표와 그 날짜 필드(SPEC 키). 설치현황은 «그 시점의 전체 명부»라
   구간이라는 개념이 없다 → 통째 교체만. SQL 쪽 _csv_datecol 과 짝이다. */
const TABLES = [
  { key:'wk',   label:'수선실적 (시트 머리글 CSV)',  table:'sheet_wk',   kind:'mirror', win:'dStart' },
  { key:'mat',  label:'자재실적 (시트 머리글 CSV)',  table:'sheet_mat',  kind:'mirror', win:'workDate' },
  { key:'inst', label:'설치현황 (시트 머리글 CSV)',  table:'sheet_inst', kind:'mirror' },
  { label:'교육현황 (edu.csv 형식)',      table:'sheet_edu',     kind:'import' },
  { label:'인원현황 (roster.csv 형식)',   table:'sheet_roster',  kind:'import' },
  { label:'휴가현황 (leave.csv 형식)',    table:'sheet_leave',   kind:'import' },
  { label:'CIP F11 (cip_f11.csv 형식)',  table:'sheet_cip_f11', kind:'import' },
  { label:'CIP F16 (cip_f16.csv 형식)',  table:'sheet_cip_f16', kind:'import' },
  { label:'All By-Pass (abp.csv 세로형)', table:'sheet_abp',     kind:'import' },
];
const $=id=>document.getElementById(id);
TABLES.forEach((t,i)=>{ $('tsel').insertAdjacentHTML('beforeend','<option value="'+i+'">'+t.label+'</option>'); });

let PREP=null;   // {t, rows(객체배열), fileRows, oldCount, warns[]}

function logLine(cls,msg){ const el=$('log'); if(el.textContent==='—')el.textContent='';
  el.insertAdjacentHTML('beforeend','<div class="'+(cls||'')+'">'+msg+'</div>'); }
function chkShow(html){ $('chk').innerHTML=html; }

/* 표의 실제 컬럼 목록. 한 행을 받아 키를 보는 방법은 «표가 비어 있으면» 통하지 않는다 —
   그리고 비어 있는 순간이 바로 이 검사가 가장 필요한 때다(적재 실패로 비워진 직후).
   그래서 information_schema 를 읽는 RPC 를 쓴다. RPC 가 아직 없으면(구 SQL) null 을
   돌려주고 검사를 건너뛴다 — 검사가 없다고 업로드를 막을 이유는 없다. */
async function tableCols(c,t){
  try{
    const r=await c.rpc('csv_table_cols',{p_tbl:t});
    if(r.error||!r.data||!r.data.length)return null;
    return r.data.map(x=>typeof x==='string'?x:(x.column_name||x.col));
  }catch(e){ return null; }
}
async function tableCount(c,t){
  const r=await c.from(t).select('*',{count:'exact',head:true});
  if(r.error)throw new Error(r.error.message);
  return r.count||0;
}

/* 파일 읽기 — 인코딩을 스스로 정한다.
   엑셀(한국어 Windows)의 «다른 이름으로 저장 → CSV(쉼표로 분리)»는 UTF-8 이 아니라
   **CP949** 로 쓴다. 그걸 UTF-8 로 읽으면 한글이 전부 U+FFFD 가 되고, 헤더 이름이
   하나도 안 맞아 «헤더 행 자체를 찾지 못함»이 된다 — 화면에는 원인이 안 드러나고
   «열 이름이 틀렸나»만 의심하게 되는 실패다. 그래서 깨지면 CP949 로 되읽는다. */
async function readText(f){
  const buf=await f.arrayBuffer();
  const utf=new TextDecoder('utf-8').decode(buf);
  if(utf.indexOf('�')<0)return {txt:utf, enc:'UTF-8'};
  for(const enc of ['euc-kr','shift_jis','big5','windows-1252']){
    try{ const s=new TextDecoder(enc).decode(buf);
      if(s.indexOf('�')<0)return {txt:s, enc:enc==='euc-kr'?'CP949(euc-kr)':enc}; }catch(e){}
  }
  return {txt:utf, enc:'UTF-8(깨짐)'};
}
/* 헤더를 못 찾았을 때 파일이 «실제로 어떻게 읽혔는지» 보여준다.
   숫자만 보여주는 실패("인식 0/38")는 인코딩 문제인지 이름 문제인지 못 가른다. */
function peek(rows,rd){
  const esc=s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const lines=(rows||[]).slice(0,3).map((r,i)=>'  '+i+'행: '
    +(r||[]).slice(0,12).map(x=>esc(String(x==null?'':x).replace(/\n/g,'⏎')).slice(0,18)).join(' | ')
    +((r||[]).length>12?'  … (총 '+r.length+'칸)':''));
  return '\n\n── 파일이 이렇게 읽혔습니다 ('+rd.enc+') ──\n'+lines.join('\n')
    +'\n\n한글이 깨져 보이면 인코딩, 이름이 멀쩡한데 안 맞으면 머리글 이름 문제입니다.';
}

/* ---------- 검사 — 업로드 전에 파일이 표에 맞는지 그 자리에서 판정 ---------- */
$('fsel').onchange=async function(){
  PREP=null; $('goBtn').disabled=true; $('log').textContent='—';
  const t=TABLES[+$('tsel').value], f=this.files[0];
  if(!f)return;
  chkShow('⏳ 파일 해석 중…');
  const rd=await readText(f);
  const rows=Papa.parse(rd.txt.replace(/^﻿/,''),{skipEmptyLines:false}).data;
  try{
    const c=await GST.db(); if(!c)throw new Error('로그인이 필요합니다');
    const oldCount=await tableCount(c,t.table);
    let out, msgs=[], missing=[];
    if(rd.enc!=='UTF-8')msgs.push('<span class="warn">ℹ '+rd.enc+' 로 읽었습니다 (엑셀에서 저장한 CSV)</span>');

    if(t.kind==='mirror'){
      /* sheet-sync 와 같은 해석 — SPEC 으로 열을 «이름으로» 찾는다. 못 찾으면 막는다. */
      const S=GST.SM.SPEC[t.key];
      const m=GST.SM.map(rows,S);
      if(!m.ok)throw new Error('열을 못 찾았습니다: '+m.miss.join(', ')
        +'\n(시트 머리글이 그대로 있는 CSV 인지 확인하세요)'+peek(rows,rd));
      const keys=Object.keys(S.fields), C=m.C;
      const header=(rows[m.hi]||[]).map(x=>String(x==null?'':x));
      const mapped=new Set(keys.map(k=>C[k]).filter(i=>i>=0));
      const extraCols=header.map((h,i)=>({i,h:h.trim()})).filter(x=>!mapped.has(x.i)&&x.h!=='');
      const data=rows.slice(m.hi+1).filter(r=>r.some(cell=>String(cell==null?'':cell).trim()!==''));
      out=data.map((r,i)=>{
        const o={src_row:m.hi+1+i};                       // sheet-sync toRows 와 동일: off + 필터후 순번
        keys.forEach(k=>{ const v=String((C[k]>=0?r[C[k]]:'')==null?'':r[C[k]]??'');
          o[GST._snake(k)]=v===''?null:v; });
        const ex={};
        extraCols.forEach(x=>{ const v=String(r[x.i]==null?'':r[x.i]).trim(); if(v!=='')ex[x.h]=v; });
        o.extra=Object.keys(ex).length?ex:null;
        return o;
      });
      msgs.push('<span class="ok">✅ 열 인식 '+keys.length+'개 · 추가로 담는 열(extra) '+extraCols.length+'개</span>');
    }else{
      /* Import 표 — CSV 헤더가 표의 실제 컬럼과 정규화 후 정확일치해야 한다.
         모르는 헤더가 있으면 막는다(조용히 버리면 그 열은 «올린 줄 알았는데 없는» 상태가 된다). */
      /* 컬럼 목록은 information_schema 에서 받는다. 예전에는 «한 행 받아 키 보기» 였는데,
         그 방법은 표가 비어 있으면 못 쓴다 — 그리고 하필 그때가 이 검사가 가장 필요한 순간이다.
         실제로 겪었다: 적재가 실패해 표가 빈 뒤, 같은 파일로 복구하려는데 «표가 비어 있어
         컬럼을 알 수 없습니다» 로 막혀 되돌릴 방법이 없었다. (미러 표는 이미 RPC 를 쓰고 있었다.) */
      let cols0=await tableCols(c,t.table);
      if(!cols0){                                   // 구 SQL 이라 RPC 가 없으면 옛 방법으로 폴백
        const probe=await c.from(t.table).select('*').limit(1);
        if(probe.error)throw new Error(probe.error.message);
        if(!probe.data||!probe.data.length)throw new Error(t.table+' 이 비어 있고 csv_table_cols RPC 도 없습니다 — setup-8-csv-upload.sql 을 Run 하세요');
        cols0=Object.keys(probe.data[0]);
      }
      const colOf={}; cols0.forEach(k=>{ if(!GST._CSV_SKIP[k])colOf[GST.SM.norm(k)]=k; });
      const header=(rows[0]||[]).map(x=>String(x==null?'':x).trim());
      const unknown=header.filter(h=>h&&!colOf[GST.SM.norm(h)]);
      if(unknown.length)throw new Error('표에 없는 헤더: '+unknown.join(', ')
        +'\n(처음 이관 때 쓴 CSV 와 같은 형식인지 확인하세요)'+peek(rows,rd));
      /* 표에는 있는데 CSV 에 없는 컬럼. 통째 교체면 표를 비우고 넣으므로 그 컬럼이
         **전 행 NULL** 이 된다 — 「올린 줄 알았는데 값이 사라진」 형태의 손실이다.
         작은 노란 글씨로는 지나친다. 붉게 띄우고 확인창에도 다시 적는다. */
      missing=Object.values(colOf).filter(col=>!header.some(h=>GST.SM.norm(h)===GST.SM.norm(col)));
      if(missing.length)msgs.push('<span class="bad big">⚠ CSV 에 없는 컬럼 '+missing.length+'개: '+missing.join(', ')
        +'<br>이 컬럼은 <b>전 행이 빈 값</b>이 됩니다 — 표에 지금 값이 있어도 사라집니다.'
        +' 열을 빠뜨린 게 아닌지 확인하세요.</span>');
      const data=rows.slice(1).filter(r=>r.some(cell=>String(cell==null?'':cell).trim()!==''));
      out=data.map(r=>{
        const o={};
        header.forEach((h,i)=>{ if(!h)return; const v=String(r[i]==null?'':r[i]);
          o[colOf[GST.SM.norm(h)]]=v===''?null:v; });
        return o;
      });
      msgs.push('<span class="ok">✅ 헤더 '+header.filter(Boolean).length+'개 전부 컬럼과 일치</span>');
    }

    if(!out.length)throw new Error('데이터 행이 없습니다');

    /* 표에 «실제로 있는 열»과 대조한다 — 비우기 전에.
       예전에는 이 검사 없이 비우고 적재해서, 표에서 열 하나가 지워져 있으면
       (실제로 extra 를 콘솔에서 지운 일이 있었다) 비운 직후 적재가 실패해
       **표가 빈 채로 남았다.** 순서가 곧 안전장치다. */
    const cols=await tableCols(c,t.table);
    if(cols){
      const have=new Set(cols);
      const need=Object.keys(out[0]).filter(k=>!have.has(k));
      // src_row 처럼 없으면 안 되는 열이 빠졌으면 아예 진행하지 않는다
      const vital=need.filter(k=>k!=='extra');
      if(vital.length)throw new Error('표 '+t.table+' 에 없는 컬럼: '+vital.join(', ')
        +'\n(setup-4-tables.sql 로 표를 다시 만들거나 컬럼을 추가하세요 — 지금 진행하면 표만 비워집니다)');
      if(need.length){        // extra 만 없는 경우: 담을 곳이 없다고 밝히고 빼고 진행
        out.forEach(o=>{ need.forEach(k=>{ delete o[k]; }); });
        msgs.push('<span class="warn">⚠ 표에 '+need.join(', ')+' 컬럼이 없어 그 값은 넣지 않습니다'
          +' (되살리려면: alter table public.'+t.table+' add column if not exists extra jsonb;)</span>');
      }
    }
    /* 구간 교체 — 파일이 덮는 «날짜 범위 × 운영단위 집합»을 계산한다.
       이 두 값이 곧 삭제 조건이라, 파일에서 뽑아야 화면 표시와 실제 삭제가 어긋나지 않는다. */
    let win=null;
    if(t.win && merging()){
      const dc=GST._snake(t.win);
      const ds=out.map(o=>String(o[dc]||'').slice(0,10)).filter(v=>/^\d{4}-\d{2}-\d{2}$/.test(v));
      if(!ds.length)throw new Error('날짜('+t.win+') 값을 못 읽어 구간을 정할 수 없습니다 — 통째 교체로 올리세요');
      /* 일부만 날짜 형식이 다른 경우가 가장 위험하다. 그 행들은 구간 계산에서 빠지므로
         «생각보다 좁은 창»이 잡히는데, 넣기는 다 넣는다 → 창 밖에 든 파일 행이 기존 행과
         겹쳐 이중 계산된다. 조용히 넘기지 말고 세어서 막는다(엑셀 저장 때 실제로 잘 바뀐다). */
      const bad=out.length-ds.length;
      if(bad)throw new Error('날짜('+t.win+')가 YYYY-MM-DD 가 아닌 행이 '+bad.toLocaleString()+'건 있습니다'
        +' (예: "'+String((out.find(o=>!/^\d{4}-\d{2}-\d{2}$/.test(String(o[dc]||'').slice(0,10)))||{})[dc]||'(빈칸)')+'")'
        +'\n그 행은 구간 계산에서 빠져 «창 밖»이 되고, 넣기는 다 넣으므로 이중 계산됩니다.'
        +'\n날짜 서식을 YYYY-MM-DD 로 맞춰 다시 저장하세요.');
      const ops=[...new Set(out.map(o=>String(o.op==null?'':o.op)))];
      win={from:ds.reduce((a,b)=>a<b?a:b), to:ds.reduce((a,b)=>a>b?a:b), ops:ops};
      const pv=await c.rpc('csv_window',{p_tbl:t.table,p_from:win.from,p_to:win.to,p_ops:win.ops,p_dry:true});
      if(pv.error)throw new Error('구간 확인 실패: '+pv.error.message
        +(/function|does not exist/i.test(pv.error.message)?' — setup-9-merge-upload.sql 을 Run 했는지 확인':''));
      win.hit=pv.data.hit; win.keep=pv.data.rows-pv.data.hit;
      msgs.push('<span class="ok">🔁 구간 교체: '+win.from+' ~ '+win.to+' · 사업부 '+ops.length+'개</span>');
      msgs.push('기존 <b>'+win.hit.toLocaleString()+'행</b>을 지우고 <b>'+win.keep.toLocaleString()+'행</b>은 그대로 둡니다'
        +' → 적재 후 <b>'+(win.keep+out.length).toLocaleString()+'행</b>');
    }
    /* 이어붙이기 — 아무것도 지우지 않는다. 대신 «겹칠 수 있는 기존 행»을 미리 세어 보여준다.
       같은 조건식(csv_window dry)을 쓰므로, 구간 교체로 마음을 바꿨을 때 숫자가 달라지지 않는다. */
    const add=appending();
    if(add){
      msgs.push('<span class="bad">➕ 이어붙이기 — 기존 '+oldCount.toLocaleString()+'행을 하나도 지우지 않습니다</span>');
      if(t.win){
        const dc=GST._snake(t.win);
        const ds=out.map(o=>String(o[dc]||'').slice(0,10)).filter(v=>/^\d{4}-\d{2}-\d{2}$/.test(v));
        const ops=[...new Set(out.map(o=>String(o.op==null?'':o.op)))];
        if(ds.length){
          const pv=await c.rpc('csv_window',{p_tbl:t.table,p_from:ds.reduce((a,b)=>a<b?a:b),
            p_to:ds.reduce((a,b)=>a>b?a:b),p_ops:ops,p_dry:true});
          if(!pv.error&&pv.data&&pv.data.hit>0)
            msgs.push('<span class="bad big">⚠ 이 파일이 덮는 기간·사업부에 기존 행이 <b>'
              +Number(pv.data.hit).toLocaleString()+'행</b> 있습니다 — 그만큼 이중 계산됩니다.'
              +' 갈아끼우려면 «겹치는 구간만 교체»를 고르세요.</span>');
        }
      }
    }
    msgs.push('파일 <b>'+out.length.toLocaleString()+'행</b> ↔ 표의 현재 <b>'+oldCount.toLocaleString()+'행</b>'
      +(add?' → 적재 후 <b>'+(oldCount+out.length).toLocaleString()+'행</b>':''));
    const shrink=!win&&!add&&oldCount>100&&out.length<oldCount/2;
    if(shrink)msgs.push('<span class="bad big">⚠ 파일이 기존의 절반도 안 됩니다 — 잘린 파일이 아닌지 확인하세요. 그래도 진행하면 기존 데이터가 이 파일로 줄어듭니다.</span>');
    chkShow(msgs.join('<br>'));
    PREP={t,rows:out,oldCount,shrink,win,add,missing};
    $('goBtn').disabled=false;
    $('goBtn').className='btn'+(shrink?' danger':'');
  }catch(e){ chkShow('<span class="bad">❌ '+String(e.message||e).replace(/\n/g,'<br>')+'</span>'); }
};
document.getElementById('tsel').onchange=function(){ $('fsel').value=''; $('chk').innerHTML=''; $('goBtn').disabled=true; PREP=null; syncMode(); };
function mode(){ const el=$('modeSel'); return el?el.value:'full'; }
function merging(){ return mode()==='win'; }
function appending(){ return mode()==='add'; }
/* 구간 교체는 날짜 컬럼이 있는 표에서만 뜻이 있다 — 설치현황엔 «구간»이라는 개념이 없다
   (그 시점의 전체 명부다). 고를 수 없는 선택지는 지우지 말고 «왜 안 되는지»와 함께 잠근다:
   목록에서 조용히 사라지면 «내가 잘못 봤나»가 되고, 그때 사람은 통째 교체를 누른다. */
function syncMode(){
  const t=TABLES[+$('tsel').value], sel=$('modeSel'), hint=$('modeHint');
  if(!t||!sel)return;
  const winOpt=sel.querySelector('option[value="win"]');
  if(winOpt){ winOpt.disabled=!t.win;
    winOpt.textContent=t.win?'겹치는 구간만 교체 — 이 파일이 덮는 사업부 × 기간만 갈아끼웁니다'
                            :'겹치는 구간만 교체 — (이 표는 날짜 구간이 없어 불가)'; }
  if(!t.win&&sel.value==='win')sel.value='full';
  const H={ full:'표를 통째로 비우고 이 파일로 바꿉니다. «파일이 곧 전체 상태»입니다.',
            win:'파일의 날짜 범위 × 파일에 든 사업부에 해당하는 기존 행만 지우고 파일을 넣습니다. 중복이 생기지 않습니다.',
            add:'⚠ 아무것도 지우지 않습니다. 기존 표에 이미 있는 실적이 파일에도 있으면 <b>그만큼 이중 계산</b>됩니다.' };
  if(hint)hint.innerHTML=(mode()==='add'?'<span class="bad">':'<span>')+H[mode()]+'</span>';
  const btn=$('goBtn');
  if(btn)btn.textContent=mode()==='add'?'업로드 (지우지 않고 이어붙이기)'
        :mode()==='win'?'업로드 (겹치는 구간만 교체)':'업로드 (기존 데이터를 이 파일로 교체)';
}
window.onMode=function(){ $('fsel').value=''; $('chk').innerHTML=''; $('goBtn').disabled=true; PREP=null; syncMode(); };
syncMode();

/* 이어붙일 때 시작 src_row. 미러 표의 PK 라 남은 행과 겹치면 적재가 통째로 실패한다.
   RPC 를 새로 만들지 않고 표에서 최댓값을 직접 읽는다 — 새 SQL 을 안 돌려도 되는 편이
   «업로드가 안 된다»는 상황을 하나 줄인다. */
async function nextSrc(c,tbl){
  const r=await c.from(tbl).select('src_row').order('src_row',{ascending:false}).limit(1);
  if(r.error)throw new Error('src_row 조회 실패: '+r.error.message);
  const v=(r.data&&r.data.length)?r.data[0].src_row:null;
  return (v==null)?0:(Number(v)+1);
}

/* ---------- 업로드 — 비우기 → 배치 적재 → 행수 대조 ---------- */
window.doUpload=async function(){
  if(!PREP)return;
  const W=PREP.win, ADD=PREP.add;
  /* 표에는 있는데 CSV 에 없는 컬럼 — 통째 교체면 그 컬럼이 전 행 NULL 이 된다.
     검사 화면에 이미 붉게 띄웠지만, 스크롤해서 안 볼 수 있으므로 확인창에서 한 번 더 묻는다. */
  if(PREP.missing&&PREP.missing.length&&!ADD&&!confirm(
      'CSV 에 없는 컬럼이 '+PREP.missing.length+'개 있습니다:\n  '+PREP.missing.join(', ')+'\n\n'
      +'이대로 올리면 이 컬럼은 표에서 전 행이 빈 값이 됩니다.\n'
      +'열을 빠뜨린 게 아니라면 계속 진행하세요.'))return;
  if(PREP.shrink&&!confirm('파일('+PREP.rows.length+'행)이 기존('+PREP.oldCount+'행)보다 훨씬 작습니다.\n정말 이 파일로 교체합니까?'))return;
  if(!confirm(ADD
      ? ('아무것도 지우지 않고 '+PREP.rows.length.toLocaleString()+'행을 이어붙입니다.\n'
         +PREP.t.table+' : '+PREP.oldCount.toLocaleString()+'행 → '
         +(PREP.oldCount+PREP.rows.length).toLocaleString()+'행\n\n'
         +'⚠ 기존 표에 이미 있는 실적이 파일에도 있으면 그만큼 이중 계산됩니다. 진행할까요?')
      : W
      ? (W.from+' ~ '+W.to+' 구간의 기존 '+W.hit.toLocaleString()+'행을 지우고\n'
         +'이 파일의 '+PREP.rows.length.toLocaleString()+'행을 넣습니다.\n'
         +'구간 밖 '+W.keep.toLocaleString()+'행은 그대로 둡니다. 진행할까요?')
      : (PREP.t.table+' 의 기존 '+PREP.oldCount.toLocaleString()+'행을 지우고\n이 파일의 '
         +PREP.rows.length.toLocaleString()+'행으로 교체합니다. 진행할까요?')))return;
  $('goBtn').disabled=true; $('log').textContent='';
  const c=await GST.db();
  try{
    let off=0;
    if(ADD){
      // 지우는 단계가 아예 없다 — PK 만 남은 행 뒤로 이어 매긴다
      if(PREP.rows[0]&&PREP.rows[0].src_row!==undefined){
        off=await nextSrc(c,PREP.t.table);
        PREP.rows.forEach((o,i)=>{ o.src_row=off+i; });
        logLine('','① 지우지 않음 · src_row '+off+' 부터 이어붙입니다');
      }else{
        logLine('','① 지우지 않음 · 이어붙입니다');
      }
    }else if(W){
      logLine('','① 구간 '+W.from+' ~ '+W.to+' 비우는 중…');
      const d=await c.rpc('csv_window',{p_tbl:PREP.t.table,p_from:W.from,p_to:W.to,p_ops:W.ops,p_dry:false});
      if(d.error)throw new Error('구간 삭제 실패: '+d.error.message);
      off=d.data.next_src;          // 남은 행과 PK(src_row)가 겹치지 않게 이어서 매긴다
      logLine('ok','   '+Number(d.data.hit).toLocaleString()+'행 삭제 · '+Number(d.data.rows).toLocaleString()+'행 보존');
      PREP.rows.forEach((o,i)=>{ o.src_row=off+i; });
    }else{
      logLine('','① 표 비우는 중…');
      const b=await c.rpc('csv_upload_begin',{p_tbl:PREP.t.table});
      if(b.error)throw new Error('비우기 실패: '+b.error.message+(/(function|does not exist)/i.test(b.error.message)?' — setup-8-csv-upload.sql 을 Run 했는지 확인':''));
      logLine('ok','   비움 완료');
    }

    const BATCH=500, N=PREP.rows.length;
    for(let i=0;i<N;i+=BATCH){
      const part=PREP.rows.slice(i,i+BATCH);
      const r=await c.from(PREP.t.table).insert(part);
      if(r.error)throw new Error('적재 실패('+(i+1)+'행째): '+r.error.message);
      logLine('','② 적재 '+Math.min(i+BATCH,N).toLocaleString()+' / '+N.toLocaleString());
    }

    const fin=await c.rpc('csv_upload_finish',{p_tbl:PREP.t.table});
    if(fin.error)throw new Error('마무리 실패: '+fin.error.message);

    const now=await tableCount(c,PREP.t.table);
    const want=ADD?(PREP.oldCount+N):(W?(W.keep+N):N);
    if(now!==want)throw new Error('행수 불일치: 표 '+now+' ≠ 기대 '+want+' — 다시 업로드하세요');
    logLine('ok big','③ 완료 ✅ '+PREP.t.table+' = '+now.toLocaleString()+'행'
      +(ADD?' (기존 '+PREP.oldCount.toLocaleString()+' + 추가 '+N.toLocaleString()+')'
        :W?' (보존 '+W.keep.toLocaleString()+' + 신규 '+N.toLocaleString()+')':' (파일과 일치)'));
    logLine('','대시보드를 새로고침하면 새 데이터가 보입니다.');
  }catch(e){
    logLine('bad big','❌ '+String(e.message||e));
    logLine('bad', ADD ? '일부만 들어갔을 수 있습니다 — 표 행수를 확인하고, 남은 분만 다시 올리거나 통째 교체로 되돌리세요.'
                 : W ? '구간이 지워진 상태일 수 있습니다 — 같은 파일로 다시 업로드하면 복구됩니다.'
                     : '표가 비워진 상태일 수 있습니다 — 같은 파일로 다시 업로드하면 복구됩니다.');
    $('goBtn').disabled=false;
  }
};

/* 로그인 게이트 — 다른 페이지와 동일. 쓰기 권한(can_write)은 RLS 가 최종 판정한다. */
GST.authGate().then(async()=>{
  try{ const p=await GST.sheetWrite('perm','1213453343');
       if(!p.can_write){ chkShow('<span class="bad">이 계정은 읽기 전용입니다 — 업로드 권한(can_write)이 없습니다.</span>'); $('fsel').disabled=true; } }
  catch(e){}
});
</script>
