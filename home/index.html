let LANG='ko';

const fmt=(s,o)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m);

const nf=n=>Number(n||0).toLocaleString('en-US');
const DAY=864e5, KR=GST.ORG.REGION_KR, OS=GST.ORG.REGION_OS;

/* 법인 이름 꼬리의 담당구분(SCRUBBER)만 뗀다 — 이름을 지어내지 않는다(v98 · 관제와 같은 규칙) */
const short=op=>String(op||'—').replace(/\s+(SCRUBBER|CHILLER)$/i,'').trim()||'—';
const scKey=sc=>sc.kind==='all'?'all':(sc.kind==='region'?'r:'+sc.v:'o:'+sc.v);
const scOf=k=>!k||k==='all'?{kind:'all',v:''}:(k.slice(0,2)==='r:'?{kind:'region',v:k.slice(2)}:{kind:'op',v:k.slice(2)});
/* 목표 고르기의 범위 — 운영단위면 그 운영단위의 구분까지 같이 넘겨 «운영단위 > 구분 > 전사»로 거슬러 올라가게 */
const tgtSc=sc=>sc.kind==='op'?{op:sc.v, region:GST.ORG.region(sc.v)||regionOfOp(sc.v)}:(sc.kind==='region'?{region:sc.v}:{});
function regionOfOp(op){ if(!RAW) return ''; const x=RAW.INST.find(i=>i.op===op)||RAW.WK.find(i=>i.op===op); return x?x.region:''; }

/* ===== 읽기 — 파싱·조인·판정은 core GST.ops 한 벌(관제·사이트 상세와 같은 캐시 열쇠) ===== */
async function load(){
  status(t('loading')); skel(true);
  const [L]=await Promise.all([GST.ops.load(), GST.targets.load(), GST.params.load(), loadActs()]);
  RAW=L;
  try{ if(GST.loadMe) await GST.loadMe(); }catch(e){}
  await initPrefs();
  skel(false); fillScope(); render();
  window._briefP=briefSave();
  status((L.fails.length?t('fail')+' ('+L.fails.join(', ')+') · ':'')+'✅ '+new Date().toLocaleString(), !!L.fails.length);
}
async function loadActs(){
  ACT_FAIL=false;
  try{ const C=await GST._dbAuthed(); if(!C){ ACTS=null; return; }
    const r=await C.from('action_items').select('id,kind,ref,sev,status,title,detail,op,page,assignee,due,updated_at').not('status','in','(done,dismissed)').order('updated_at',{ascending:false}).limit(2000);
    if(r.error){ ACTS=null; ACT_FAIL=true; console.warn('[home] 처리함 읽기 실패', r.error); return; }
    ACTS=r.data||[];
  }catch(e){ ACTS=null; ACT_FAIL=true; console.warn('[home] 처리함 읽기 실패', e); }
}
/* 처음 뜰 화면 — 주소(?view=&op=) > 저장된 설정(서버 → 이 PC) > 등급 */
async function initPrefs(){
  const q=new URLSearchParams(location.search);
  const p=await GST.prefs.load();
  const qv=q.get('view'); S.viewFixed=!!qv;
  S.view=(qv&&/^(exec|lead|field)$/.test(qv)&&qv)||(p&&p.view)||GST.prefs.defView();
  const qop=q.get('op'), qr=q.get('region');
  if(qop) S.sc={kind:'op', v:qop};
  else if(qr) S.sc={kind:'region', v:qr==='kr'?KR:qr==='os'?OS:qr};
  else if(p&&p.op) S.sc=p.op.slice(0,2)==='r:'?{kind:'region',v:p.op.slice(2)}:{kind:'op',v:p.op};
}
function opsList(){
  const asOf=GST.ops.asOf(RAW), M={};
  RAW.INST.forEach(x=>{ if(!x.op||!GST.ops.isIn(x,asOf)) return; M[x.op]=(M[x.op]||0)+1; });
  RAW.WK.forEach(x=>{ if(x.op&&M[x.op]==null) M[x.op]=0; });
  return Object.keys(M).sort((a,b)=>M[b]-M[a]||a.localeCompare(b));
}
function fillScope(){
  const sel=document.getElementById('scope'), ops=opsList();
  /* 저장된 운영단위가 지금 자료에 없으면 전사로 — 조용히 빈 화면을 그리지 않는다 */
  if(S.sc.kind==='op'&&ops.indexOf(S.sc.v)<0) S.sc={kind:'all',v:''};
  sel.innerHTML='<option value="all">'+esc(t('sc_all'))+'</option><option value="r:'+esc(KR)+'">'+esc(t('sc_kr'))+'</option><option value="r:'+esc(OS)+'">'+esc(t('sc_os'))+'</option>'
    +'<optgroup label="'+esc(t('sc_ops'))+'">'+ops.map(o=>'<option value="o:'+esc(o)+'">'+esc(short(o))+'</option>').join('')+'</optgroup>';
  sel.value=scKey(S.sc);
}

/* ===== 계산 ===== */
function compute(sc){
  sc=sc||S.sc;
  const R=RAW, asOf=GST.ops.asOf(R), ok=GST.metrics.okOf(sc);
  const one=GST.metrics.one(R, asOf, ok, {actions:ACTS||undefined});
  /* 운영단위별 표 — 범위가 구분이면 그 구분 안의 운영단위만, 운영단위면 그 하나만 강조 */
  const okOps=sc.kind==='region'?ok:null;
  const by=GST.metrics.by(R, asOf, x=>x.op||'—', okOps, {actions:ACTS||undefined});
  const W=by.W;
  const rows=Object.values(by.G).filter(g=>g.inN||g.bm4||g.pm4).map(g=>{
    const sc={op:g.k, region:GST.ORG.region(g.k)||regionOfOp(g.k)};
    const J={}; let worst=null; const rk={bad:0,warn:1,ok:2};
    ['run_rate','bm_per100','pm_ratio','repeat14'].forEach(mt=>{ const tg=GST.targets.pick(mt, sc), st=GST.targets.judge(mt, g.m[mt].v, tg);
      J[mt]={t:tg, st:st}; if(st&&(worst==null||rk[st]<rk[worst])) worst=st; });
    return {g, sc, J, st:worst};
  });
  const rk={bad:0,warn:1,ok:2,null:3};
  rows.sort((a,b)=>rk[a.st]-rk[b.st]||(b.g.m.bm_per100.v||0)-(a.g.m.bm_per100.v||0)||b.g.inN-a.g.inN);
  const notRun=R.INST.filter(x=>(!ok||ok(x))&&GST.ops.isIn(x,asOf)&&!GST.ops.isRun(x,asOf));
  return {sc, asOf, W, one, rows, notRun, KR_ON:R.KRA.length>0};
}

/* ===== 그리기 ===== */
function render(){
  if(!RAW) return;
  D=compute();
  document.querySelectorAll('#segView button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===S.view)));
  document.getElementById('scope').value=scKey(S.sc);
  document.getElementById('goTargets').hidden=!(GST.isAdmin&&GST.isAdmin());
  /* 머리에는 날짜만(v172) — 「(자료 최종일) · 최근 4주 W38~W41」 같은 설명은 두지 않는다.
     숫자의 뜻이 바뀌는 사실(국내 원장이 비어 수선실적으로 집계)은 띠가 아니라 ⚠ 하나로 · 누르면 내용 */
  const krIn=S.sc.kind==='all'||(S.sc.kind==='region'&&S.sc.v===KR)||(S.sc.kind==='op'&&(GST.ORG.region(S.sc.v)||regionOfOp(S.sc.v))===KR);
  const _asof=document.getElementById('asof');
  _asof.innerHTML=esc(fmt(t('asof'),{d:GST.fmtD(D.asOf)}))+(!D.KR_ON&&krIn?' <button type="button" class="gst-warn" id="krWarn" title="'+esc(t('krFall'))+'">⚠</button>':'');
  const _kw=document.getElementById('krWarn'); if(_kw) _kw.onclick=()=>GST.rowsModal('⚠', [t('l_desc')], [[t('krFall')]]);
  drawBanners(); drawKpis();
  const B=document.getElementById('body');
  if(S.view==='exec') B.innerHTML='<div class="ds-grid ds-g2"><div class="ds-card" id="cOps"></div><div class="ds-card" id="cDec"></div></div><div class="ds-card" id="cTrend"></div>';
  else if(S.view==='lead') B.innerHTML='<div class="ds-grid ds-g2e"><div class="ds-card" id="cAct"></div><div class="ds-card" id="cRisk"></div></div><div class="ds-card" id="cOps"></div>';
  else B.innerHTML=S.sc.kind!=='op'?'<div class="ds-card" id="cPick"></div>'
    :'<div class="ds-grid ds-g3"><div class="ds-card" id="cBm"></div><div class="ds-card" id="cRisk"></div><div class="ds-card" id="cWarr"></div></div><div class="ds-grid ds-g2e"><div class="ds-card" id="cAct"></div><div class="ds-card" id="cTrend"></div></div>';
  const has=id=>document.getElementById(id);
  if(has('cOps')) drawOps(); if(has('cDec')) drawDec(); if(has('cTrend')) drawTrend(); if(has('cAct')) drawAct();
  if(has('cRisk')) drawRisk(); if(has('cBm')) drawBm(); if(has('cWarr')) drawWarr(); if(has('cPick')) drawPick();
}
function drawBanners(){
  const box=document.getElementById('banners'), adm=GST.isAdmin&&GST.isAdmin(), out=[];
  /* 국내 원장 경고는 머리의 ⚠ 로 옮겼다(v172). 목표 표 사정은 관리자에게만 — 설정할 사람만 알면 된다(설명 표시를 켰을 때) */
  if(GST.targets.why==='no_table'&&adm) out.push('<div class="ds-banner x"><span>'+esc(t('noTbl'))+'</span></div>');
  else if(!GST.targets.rows.length&&GST.targets.why!=='no_table'&&adm) out.push('<div class="ds-banner x"><span>'+esc(t('noTgt'))+' '+esc(t('noTgtAdm'))+'</span></div>');
  box.innerHTML=out.join('');
}

function bmRows(list){ return list.slice().sort((a,b)=>b.d-a.d).map(x=>[GST.fmtD(x.d), short(x.op), x.campus||'', x.code||'', x.sn||'', x.src==='kr'?t('src_kr'):t('src_wk'), x.desc||'']); }
const BM_COLS=()=>[t('l_date'),t('l_op'),t('l_campus'),t('l_eq'),t('l_sn'),t('l_src'),t('l_desc')];
/* 카드가 «센 그 배열»이 그대로 목록이 된다(v133 규약) */
function kpiOpen(mt){
  const o=D.one, ttl=v2t('m_'+mt);
  if(mt==='bm_per100') return GST.rowsModal(ttl+' · '+v2t('w4'), BM_COLS(), bmRows(o.rows.bm4), v2t('d_bm_per100')+' — '+o.bm4+' ÷ '+nf(o.inN)+' × 100');
  if(mt==='pm_ratio') return GST.rowsModal(ttl+' · '+v2t('w4'), [t('l_kind')].concat(BM_COLS()),
    o.rows.pm4.map(x=>[t('k_pm')].concat(bmRows([x])[0])).concat(o.rows.bm4.map(x=>[t('k_bm')].concat(bmRows([x])[0]))), v2t('d_pm_ratio')+' — '+o.pm4+' ÷ ('+o.pm4+' + '+o.bm4+')');
  if(mt==='repeat14') return GST.rowsModal(ttl, [t('l_eq'),t('l_op'),t('l_score'),t('l_why')], o.risk.filter(r=>r.rep>0).map(r=>[r.label, short(r.site), String(r.score), GST.riskWhy(r)]));
  if(mt==='run_rate') return GST.rowsModal(t('notRun'), [t('l_op'),t('l_campus'),t('l_eq'),t('l_sn'),t('l_state')],
    D.notRun.map(x=>[short(x.op), x.campus, x.code, x.sn, x.stateRaw]), v2t('d_run_rate')+' — '+nf(o.runN)+' ÷ '+nf(o.inN));
  if(mt==='act_overdue') return GST.rowsModal(ttl, [t('l_title'),t('l_op'),t('l_due'),t('l_who')], overdue().map(a=>[a.title, short(a.op), a.due||'', a.assignee||'']));
}
function overdue(sc){
  if(!ACTS) return [];
  const ok=GST.metrics.okOf(sc||S.sc), now=new Date(), today=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate());
  return ACTS.filter(a=>{ const x={op:a.op||'', region:GST.ORG.region(a.op||'')}; if(ok&&!ok(x)) return false; const d=a.due&&GST.toDate(a.due); return d&&d.getTime()<today; });
}
function meter(mt, v, tg, st, max){
  if(v==null) return '<span class="ds-note">—</span>';
  const pv=Math.max(0,Math.min(100,v/max*100));
  return '<div style="display:flex;align-items:center;gap:8px"><div class="ds-meter" style="flex:1"><i class="'+(st||'')+'" style="width:'+pv.toFixed(1)+'%"></i>'
    +(tg?'<b style="left:'+Math.max(0,Math.min(100,tg.target/max*100)).toFixed(1)+'%"></b>':'')+'</div><span style="min-width:44px;text-align:right">'+esc(GST.v2fmt(mt,v))+'</span></div>';
}
function cell(mt, r){ const m=r.g.m[mt], j=r.J[mt]; return '<span class="'+(j.st?'ds-kpi-t '+j.st:'')+'">'+esc(GST.v2fmt(mt,m.v))+esc(m.v==null?'':GST.v2unit(mt))+'</span>'; }
function drawOps(){
  const box=document.getElementById('cOps');

  let h='<h2>'+esc(t('opsT'))+'<span class="s">'+esc(t('opsS'))+'</span></h2>';
  if(!rows.length){ box.innerHTML=h+'<div class="ds-empty">'+esc(t('none'))+'</div>'; return; }
  h+='<div class="ds-tbl-wrap"><table class="ds-tbl"><thead><tr><th>'+esc(t('c_op'))+'</th><th>'+esc(t('c_st'))+'</th><th class="n">'+esc(t('c_in'))+'</th><th class="n">'+esc(t('c_run'))+'</th><th style="min-width:160px">'+esc(t('c_bm'))+'</th><th class="n">'+esc(t('c_pm'))+'</th><th class="n">'+esc(t('c_rep'))+'</th></tr></thead><tbody>';
  rows.forEach(r=>{ const on=S.sc.kind==='op'&&S.sc.v===r.g.k;
    h+='<tr class="click'+(on?' on':'')+'" data-op="'+esc(r.g.k)+'" tabindex="0"><td><b>'+esc(short(r.g.k))+'</b></td>'
      +'<td><span class="ds-pill '+(r.st||'')+'">'+esc(v2t('st_'+(r.st||'none')))+'</span></td>'
      +'<td class="n">'+nf(r.g.inN)+'</td><td class="n">'+cell('run_rate',r)+'</td>'
      +'<td>'+meter('bm_per100', r.g.m.bm_per100.v, r.J.bm_per100.t, r.J.bm_per100.st, maxBm)+'</td>'
      +'<td class="n">'+cell('pm_ratio',r)+'</td><td class="n">'+cell('repeat14',r)+'</td></tr>'; });
  box.innerHTML=h+'</tbody></table></div>';
  box.querySelectorAll('tr[data-op]').forEach(tr=>{ const go=()=>{ S.sc={kind:'op', v:tr.dataset.op}; render(); };
    tr.onclick=go; tr.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } }; });
}
/* 이번 주 확인 사항 — 새로 판정하지 않는다: 목표 판정(GST.targets.judge) · 재고장(riskRank) · 처리함 기한을 «할 일» 한 줄씩으로.
   D0·L 을 받는 이유 — 챗봇 브리핑(briefSave)이 «전사»와 한국어로 같은 목록을 만든다. 두 벌로 짜면 화면과 카톡이 다른 일을 말한다. */
function decisions(D0, L){
  D0=D0||D; L=L||LANG;
  const tr=k=>(T[L]&&T[L][k]!=null)?T[L][k]:T.ko[k], vt=(k,o)=>GST.v2t(k,o,L);
  const out=[], rk={bad:0,warn:1};
  D0.rows.filter(r=>r.st==='bad'||r.st==='warn').forEach(r=>{
    ['bm_per100','run_rate','pm_ratio','repeat14'].forEach(mt=>{ const j=r.J[mt]; if(j.st!=='bad'&&j.st!=='warn') return;
      const v=r.g.m[mt].v;
      out.push({sev:j.st, tag:tr('tag_tgt'), go:mt==='bm_per100'||mt==='repeat14'?'fault':'hub',
        title:fmt(tr('d_tgt'),{op:short(r.g.k), m:vt('m_'+mt), v:GST.v2fmt(mt,v)+GST.v2unit(mt,L), t:GST.v2gap(mt,v,j.t,L)}),
        sub:vt('tgt',{v:GST.v2fmt(mt,j.t.target)+GST.v2unit(mt,L)+' '+vt(j.t.dir==='ge'?'tgt_ge':'tgt_le')}), op:r.g.k}); }); });
  out.sort((a,b)=>rk[a.sev]-rk[b.sev]);
  D0.one.risk.filter(r=>r.rep>0).slice(0,3).forEach(r=>out.push({sev:'warn', tag:tr('tag_rep'), go:'fault',
    title:fmt(tr('d_rep'),{eq:r.label, op:short(r.site), n:r.rep, d:GST.RISK_W.repDays}), sub:GST.riskWhy(r)}));
  const od=overdue(D0.sc); if(od.length) out.push({sev:'bad', tag:tr('tag_act'), go:'action', title:fmt(tr('d_over'),{n:od.length}), sub:od.slice(0,2).map(a=>a.title).join(' · ')});
  return out;
}
function drawDec(){
  const box=document.getElementById('cDec'), L=decisions(), adm=GST.isAdmin&&GST.isAdmin();
  let h='<h2>'+esc(t('decT'))+'<span class="s">'+esc(t('decS'))+'</span></h2>';
  const rows=L.slice(0,6);
  if(!GST.targets.rows.length&&adm) rows.unshift({sev:'', tag:t('tag_tgt'), go:'targets', title:t('d_set'), sub:t('noTgt')});
  if(!rows.length){ box.innerHTML=h+'<div class="ds-empty">'+esc(t('d_none'))+'</div>'; return; }
  h+='<ul class="ds-list">'+rows.map((q,i)=>'<li><button type="button" class="ds-row" data-q="'+i+'"><span class="ds-tag '+esc(q.sev)+'">'+esc(q.tag)+'</span>'
    +'<span class="t"><b>'+esc(q.title)+'</b><span>'+esc(q.sub||'')+'</span></span></button></li>').join('')+'</ul>'
    +(L.length>6?'<div class="ds-note">'+esc(fmt(t('more'),{n:L.length-6}))+'</div>':'');
  box.innerHTML=h;
  box.querySelectorAll('.ds-row').forEach(b=>{ const q=rows[+b.dataset.q]; b.onclick=()=>{
    if(q.go==='targets') return goTargets();
    if(q.op){ S.sc={kind:'op', v:q.op}; return render(); }
    GST.goTab&&GST.goTab(q.go); }; });
}
function drawTrend(){
  const box=document.getElementById('cTrend'), o=D.one, W=D.W, tg=GST.targets.pick('bm_per100', tgtSc(S.sc));
  /* 목표(100대당 4주 고장)를 «주» 단위 건수로 환산한 점선 — 반입 설비가 없으면 그리지 않는다 */
  const tl=tg&&o.inN?tg.target*o.inN/100/4:null;
  const mx=Math.max(1, ...o.bmW, tl||0)*1.15, Wd=600, Ht=110, pad=0, bw=(Wd-pad)/12;
  let svg='<svg class="ds-wkbars" viewBox="0 0 '+Wd+' '+Ht+'" preserveAspectRatio="none" role="img" aria-label="'+esc(t('trendT'))+'">';
  o.bmW.forEach((v,i)=>{ const h=(v/mx)*(Ht-4), x=pad+i*bw+bw*0.18, cls=i===11?'b cur':(tl!=null&&v>tl?'b hot':'b');
    svg+='<rect class="'+cls+'" x="'+x.toFixed(1)+'" y="'+(Ht-pad-h).toFixed(1)+'" width="'+(bw*0.64).toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" rx="2"><title>'+esc(W[i].label+' · '+v)+'</title></rect>';
  });
  if(tl!=null){ const y=Ht-(tl/mx)*(Ht-4); svg+='<line class="tl" x1="'+pad+'" x2="'+Wd+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" vector-effect="non-scaling-stroke"/>'; }
  svg+='</svg>';
  /* 주 이름은 SVG 밖(HTML)에 — 막대 SVG 는 폭에 맞춰 늘어나므로(preserveAspectRatio none) 안에 쓴 글자가 찌그러진다 */
  const lab='<div class="ds-wklab" style="padding-left:'+(pad/Wd*100).toFixed(2)+'%">'+W.map((w,i)=>'<span>'+(i%2===1||i===11?esc(w.label):'')+'</span>').join('')+'</div>';
  box.innerHTML='<h2>'+esc(t('trendT'))+(tl!=null?'<span class="s x">'+esc(t('trendS'))+'</span>':'')+'</h2>'+svg+lab;
}
function drawAct(){
  const box=document.getElementById('cAct');
  let h='<h2>'+esc(t('actT'))+'<span class="s">'+esc(t('actS'))+'</span><button type="button" class="ds-btn sm ghost r" id="goAct">'+esc(t('go_action'))+' →</button></h2>';
  if(ACTS==null){ box.innerHTML=h+'<div class="ds-empty">'+esc(ACT_FAIL?t('a_fail'):t('none'))+'</div>'; bindGo(box); return; }
  const ok=GST.metrics.okOf(S.sc), now=new Date(), today=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate());
  const L=ACTS.filter(a=>!ok||ok({op:a.op||'', region:GST.ORG.region(a.op||'')})).map(a=>{ const d=a.due&&GST.toDate(a.due); return Object.assign({late:!!(d&&d.getTime()<today), dd:d}, a); })
    .sort((a,b)=>(b.late-a.late)||((a.sev==='bad'?0:1)-(b.sev==='bad'?0:1))||((a.dd?a.dd.getTime():9e15)-(b.dd?b.dd.getTime():9e15)));
  if(!L.length){ box.innerHTML=h+'<div class="ds-empty">'+esc(t('a_none'))+'</div>'; bindGo(box); return; }
  h+='<ul class="ds-list">'+L.slice(0,8).map(a=>'<li><button type="button" class="ds-row act"><span class="ds-tag '+(a.late?'bad':(a.sev==='bad'?'bad':'warn'))+'">'+esc(t('st_'+a.status)||a.status)+'</span>'
    +'<span class="t"><b>'+esc(a.title)+'</b><span>'+esc([short(a.op), a.assignee?fmt(t('a_who'),{w:a.assignee}):t('a_nowho')].filter(Boolean).join(' · '))+'</span></span>'
    +'<span class="r" style="'+(a.late?'color:var(--bad);font-weight:600':'')+'">'+esc(a.due?fmt(t('a_due'),{d:a.due}):t('a_nodue'))+'</span></button></li>').join('')+'</ul>'
    +(L.length>8?'<div class="ds-note">'+esc(fmt(t('more'),{n:L.length-8}))+'</div>':'');
  box.innerHTML=h; bindGo(box);
  box.querySelectorAll('.ds-row.act').forEach(b=>b.onclick=()=>GST.goTab&&GST.goTab('action'));

      +'<span class="t"><b>'+esc(x.code||x.sn)+'</b><span>'+esc([x.campus, x.model].filter(Boolean).join(' · '))+'</span></span></button></li>').join('')+'</ul>'
      +(L.length>8?'<button type="button" class="ds-btn sm ghost" id="wAll">'+esc(fmt(t('more'),{n:L.length-8}))+'</button>':'')
    :'<div class="ds-empty">'+esc(t('none'))+'</div>';

  if(b) b.onclick=()=>GST.rowsModal(t('warrT'), [t('l_wd'),t('l_campus'),t('l_eq'),t('l_sn'),t('l_state')], L.map(x=>[GST.fmtD(x.wd),x.campus,x.code,x.sn,x.stateRaw]));
}

/* ===== 챗봇 브리핑 스냅샷 (setup-27 7절 · kakao-bot/brief.js 가 읽는다) =====
   챗봇은 판정을 «안 한다» — 여기서 계산한 문장과 숫자를 범위별 한 줄로 남기고, 챗봇은 글로 옮기기만 한다(판정 사본 금지 · v109).
   남기는 조건 넷 — 하나라도 어기면 조용히 «틀린» 브리핑이 카톡으로 나간다:
   ① 처리함을 쓸 수 있는 사람(GST.actCan · 서버 brief_put 과 같은 규칙) ② 읽기 실패가 없다
   ③ 기간 기본창의 «부분본»이 아니다(GST._bfOn 이 비어 있다 — 백필이 끝나면 _softReload 가 loadData 를 다시 부른다)
   ④ 같은 범위·같은 자료일을 30분 안에 다시 남기지 않는다(브라우저 여럿이 열려 있어도 쓰기가 몰리지 않게) */
const BRIEF_EVERY=30*60*1000;
function briefPayload(sc){
  const D0=compute(sc), o=D0.one, tsc=tgtSc(sc);
  const kp=['run_rate','bm_per100','pm_ratio','repeat14','act_overdue'].filter(mt=>mt!=='act_overdue'||ACTS).map(mt=>{
    const X=GST.kpiText({metric:mt, m:o.m[mt], t:GST.targets.pick(mt, tsc)}, 'ko');
    return {k:mt, name:X.name, win:(mt==='bm_per100'||mt==='pm_ratio')?GST.v2t('w4',null,'ko'):'', val:X.val, unit:X.unit, st:X.st, tgt:X.tline, dv:X.dv, dvs:X.dv?X.dvs:''}; });
  const dec=decisions(D0, 'ko').slice(0,5).map(q=>({sev:q.sev, tag:q.tag, title:q.title}));
  const krIn=sc.kind==='all'||(sc.kind==='region'&&sc.v===KR)||(sc.kind==='op'&&(GST.ORG.region(sc.v)||regionOfOp(sc.v))===KR);
  return {v:1, scope:scKey(sc), name:sc.kind==='all'?T.ko.sc_all:(sc.kind==='region'?(sc.v===KR?T.ko.sc_kr:sc.v===OS?T.ko.sc_os:sc.v):short(sc.v)),
    as_of:GST.fmtD(D0.asOf), w4:D0.W[8].label+'~'+D0.W[11].label, kpis:kp, dec:dec, kr_fall:!D0.KR_ON&&krIn, tgt_n:GST.targets.rows.length, core:GST.VER||null};
}
async function briefSave(){
  try{
    if(!RAW||RAW.fails.length) return 'fail';
    if(!(GST.actCan&&GST.actCan())) return 'who';
    if(GST._bfOn&&Object.keys(GST._bfOn).length) return 'partial';
    const C=await GST._dbAuthed(); if(!C) return 'no_db';
    const scs=[{kind:'all',v:''}]; if(S.sc.kind!=='all') scs.push(S.sc);
    let n=0;
    for(const sc of scs){
      const pl=briefPayload(sc), mk='gst_brief_at:'+pl.scope;
      let last=null; try{ last=JSON.parse(localStorage.getItem(mk)||'null'); }catch(e){}
      if(last&&last.as_of===pl.as_of&&Date.now()-last.t<BRIEF_EVERY) continue;
      const r=await C.rpc('brief_put',{p_scope:pl.scope, p_as_of:pl.as_of, p_payload:pl, p_ver:GST.VER||null});
      if(r.error||!r.data||!r.data.ok){ console.warn('[home] 브리핑 저장 안 됨', r.error||r.data); continue; }
      try{ localStorage.setItem(mk, JSON.stringify({as_of:pl.as_of, t:Date.now()})); }catch(e){}
      n++;
    }
    return n?'ok':'skip';
  }catch(e){ console.warn('[home] 브리핑 저장 실패', e); return 'fail'; }
}

/* ===== 틀 ===== */
function status(s, err){ const e=document.getElementById('status'); e.textContent=s; e.classList.toggle('err',!!err); }
function skel(on){ document.querySelectorAll('#kpis,#body').forEach(e=>e.classList.toggle('ds-sk',!!on)); }
function applyLang(){
  document.documentElement.lang=LANG;
  try{ GST.applyI18n && GST.applyI18n(t, LANG); }catch(e){ document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent=t(el.dataset.i); }); }
  try{ sessionStorage.setItem('gst_lang', LANG); }catch(e){}
  if(RAW){ fillScope(); render(); }
}
window.setLang=function(l){ if(T[l]){ LANG=l; applyLang(); } };
document.getElementById('segView').addEventListener('click',e=>{ const b=e.target.closest('button[data-v]'); if(!b) return; S.view=b.dataset.v; render(); });
document.getElementById('scope').addEventListener('change',e=>{ S.sc=scOf(e.target.value); render(); });
document.getElementById('goTargets').onclick=goTargets;
document.getElementById('saveDef').onclick=async ()=>{
  const b=document.getElementById('saveDef'); b.disabled=true;
  const op=S.sc.kind==='op'?S.sc.v:(S.sc.kind==='region'?'r:'+S.sc.v:'');

  b.disabled=false;
  GST.capToast ? GST.capToast(r.where==='server'?t('saved_srv'):t('saved_pc')) : status(r.where==='server'?t('saved_srv'):t('saved_pc'));
};
window.addEventListener('message',e=>{ const d=e.data||{}; if(d.type==='gst-lang'&&T[d.lang]){ LANG=d.lang; applyLang(); } });
/* 등급이 «나중에» 온다 — 그때 관리자 단추·기본 화면을 다시 정한다(저장된 설정·주소가 있으면 그것이 이긴다) */
window.addEventListener('gst-role',()=>{ if(!RAW) return; if(!S.viewFixed&&!(GST.prefs.v&&GST.prefs.v.view)) S.view=GST.prefs.defView(); render(); });
try{ new MutationObserver(()=>D&&drawKpis()).observe(document.body,{attributes:true,attributeFilter:['class']}); }catch(e){}
applyLang();
window.loadData=async ()=>{ await Promise.all([loadActs(), GST.targets.load(), GST.params.load()]); const L=await GST.ops.load(); RAW=L; fillScope(); render(); window._briefP=briefSave(); };
load().catch(e=>{ console.error('[home] 읽기 실패', e); skel(false); status((GST.failNote?GST.failNote(e):String(e&&e.message||e)), true); });
GST.startAutoRefresh && GST.startAutoRefresh(30);
</script>
