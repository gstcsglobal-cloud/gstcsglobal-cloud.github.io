<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232dd4bf'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpolygon points='50,4 92,27 92,73 50,96 8,73 8,27' fill='url(%23g)'/%3E%3Ctext x='50' y='66' font-size='46' font-weight='900' text-anchor='middle' fill='%230a1420' font-family='Segoe UI,sans-serif'%3EG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://gstcsglobal-cloud.github.io/assets/core.js"></script>
<title>CS Global Team</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#14142f;--bg2:#1e1d4d;--line:#3b3a6b;--txt:#e2e8f0;--mut:#94a3b8;
  --accent:#38bdf8;--glass:rgba(255,255,255,0.06);--glassb:rgba(255,255,255,0.13);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Pretendard Variable',Pretendard,'Segoe UI','Malgun Gothic',sans-serif;color:var(--txt);
  background:linear-gradient(135deg,#14142f,#1e1d4d);display:flex;flex-direction:column}
body.theme-burgundy{background:linear-gradient(135deg,#1a0813,#2d0b1e)}
body.theme-burgundy .topbar,body.theme-burgundy .tabbar{background:rgba(26,8,19,.85)}
body.theme-burgundy .gbarrow{background:rgba(26,8,19,.7)}
body.theme-light{background:linear-gradient(135deg,#f1f5f9,#e2e8f0);color:#0f172a}
body.theme-light .topbar,body.theme-light .tabbar{background:rgba(241,245,249,.9);border-color:rgba(15,23,42,.1)}
body.theme-light .gbarrow{background:rgba(241,245,249,.75);border-color:rgba(15,23,42,.08)}
body.theme-light .gb-b{background:rgba(15,23,42,.05);border-color:rgba(15,23,42,.12);color:#334155}
body.theme-light .gb-inp{background:rgba(255,255,255,.9);border-color:rgba(15,23,42,.12);color:#0f172a;color-scheme:light}
body.theme-light .gb-b.on{background:#2563eb;color:#fff;border-color:#2563eb}
body.theme-light .tab{color:#64748b}
body.theme-light .tab:hover{color:#0f172a}
body.theme-light .tab.active{color:#2563eb;border-bottom-color:#2563eb}
body.theme-light .tb-btn{background:rgba(15,23,42,.05);border-color:rgba(15,23,42,.12);color:#0f172a}
body.theme-light .brand .tag{color:#64748b}
body.theme-light .frame-wrap{background:#f1f5f9}
body.theme-light .frame-wrap iframe{background:#f1f5f9}

/* Slate — 새 기본 테마: 단일 표면 + 단일 액센트 */
body.theme-slate{background:#0B0F14;color:#E6EDF3}
body.theme-slate .topbar,body.theme-slate .tabbar{background:#0E141C;border-color:rgba(151,170,196,.10)}
body.theme-slate .gbarrow{background:#0C1219;border-color:rgba(151,170,196,.08)}
body.theme-slate .gb-b,body.theme-slate .gb-inp{background:transparent;border-color:rgba(151,170,196,.16);color:#8B98A9}
body.theme-slate .gb-b:hover{background:#16202C;color:#E6EDF3}
body.theme-slate .gb-b.on{background:#2DD4BF;color:#04211C;border-color:#2DD4BF}
body.theme-slate .brand .logo{background:linear-gradient(90deg,#2DD4BF,#E6EDF3);
  -webkit-background-clip:text;background-clip:text}
body.theme-slate .brand .tag{color:#5E6D80}
body.theme-slate .tab{color:#8B98A9}
body.theme-slate .tab:hover{color:#E6EDF3}
body.theme-slate .tab.active{color:#2DD4BF;border-bottom-color:#2DD4BF}
body.theme-slate .tb-btn{background:transparent;border-color:rgba(151,170,196,.16);color:#8B98A9;border-radius:8px}
body.theme-slate .tb-btn:hover{background:#16202C;color:#E6EDF3}
body.theme-slate .tb-btn.logout:hover{border-color:#e66767;color:#e66767}
body.theme-slate .frame-wrap{background:#0B0F14}
body.theme-slate .frame-wrap iframe{background:#0B0F14}
body.theme-slate .spinner{border-color:rgba(151,170,196,.16);border-top-color:#2DD4BF}

/* 상단 바 */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;
  background:rgba(20,20,47,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{font-size:22px;font-weight:900;background:linear-gradient(90deg,#00cec9,#6c5ce7,#fd79a8);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px}
.brand .tag{font-size:12px;color:var(--mut)}
.topbar-right{display:flex;align-items:center;gap:10px}
.tb-btn{display:inline-flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glassb);color:var(--txt);
  padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;text-decoration:none}
.tb-btn:hover{background:rgba(255,255,255,.12)}
.tb-btn.logout:hover{border-color:#fb7185;color:#fda4af}

/* 탭 바 — 자기 줄 전체를 쓴다 (툴바가 탭을 가리지 않도록 분리) */
.tabbar{display:flex;gap:2px;padding:0 24px;background:rgba(20,20,47,.6);
  border-bottom:2px solid var(--line);flex-shrink:0;overflow-x:auto}
.tabbar::-webkit-scrollbar{height:0}

/* 공통 컨트롤 바 — 탭 줄 바로 아래 전용 줄. 전 페이지 동일 세트(미지원은 비활성) */
/* 챗봇까지 한 덩어리로 오른쪽 정렬 — 기존 컨트롤 위치는 그대로 유지된다 */
.gbarrow{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:0 24px;
  background:rgba(20,20,47,.45);border-bottom:1px solid var(--line);flex-shrink:0;overflow:visible;position:relative;flex-wrap:wrap}
.gbarrow::-webkit-scrollbar{height:0}
/* 챗봇 입력줄 */
.askwrap{display:flex;align-items:center;gap:6px;height:27px;padding:0 8px;flex:0 1 340px;min-width:150px;
  background:var(--glass);border:1px solid var(--glassb);border-radius:8px;transition:border-color .2s,box-shadow .2s}
.askwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px rgba(45,212,191,.16)}
.askwrap .ask-ic{color:var(--accent);flex:none}
.ask-inp{font-family:inherit;flex:1;min-width:0;background:transparent;border:none;outline:none;
  color:var(--txt);font-size:11.5px;font-weight:600}
.ask-inp::placeholder{color:var(--mut);font-weight:600}
.ask-go{font-family:inherit;background:transparent;border:none;color:var(--mut);cursor:pointer;font-size:12px;
  font-weight:800;padding:0 2px;flex:none}
.ask-go:hover{color:var(--accent)}
.askpanel{display:none;position:absolute;z-index:60;right:24px;top:calc(100% - 2px);width:min(520px,calc(100vw - 32px));
  max-height:min(60vh,520px);flex-direction:column;background:var(--card,#111827);border:1px solid var(--glassb);
  border-radius:0 0 12px 12px;box-shadow:0 18px 44px rgba(0,0,0,.5);overflow:hidden}
.askpanel.open{display:flex}
.ask-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--txt)}
.ask-mode{font-size:10px;font-weight:700;color:var(--mut)}
.ask-x{margin-left:auto;background:none;border:none;color:var(--mut);cursor:pointer;font-size:12px}
.ask-log{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.ask-msg{font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ask-msg.q{align-self:flex-end;max-width:85%;background:var(--accent);color:#04211d;font-weight:700;
  padding:6px 10px;border-radius:10px 10px 2px 10px}
.ask-msg.a{align-self:flex-start;max-width:95%;color:var(--txt);background:var(--glass);
  border:1px solid var(--glassb);padding:8px 10px;border-radius:10px 10px 10px 2px}
.ask-msg.a b{color:var(--accent)}
.ask-msg .ct-src{font-size:9.5px;color:var(--mut);margin-left:4px}
.ask-tips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;border-top:1px solid var(--line)}
.ask-tip{font-family:inherit;background:var(--glass);border:1px solid var(--glassb);border-radius:20px;
  padding:4px 9px;font-size:10.5px;color:var(--mut);cursor:pointer;white-space:nowrap}
.ask-tip:hover{color:var(--accent);border-color:var(--accent)}

#gbar{display:flex;align-items:center;gap:7px;padding:5px 0}
#gbar:empty{display:none}
.gb-seg{display:inline-flex;border:1px solid var(--glassb);border-radius:8px;overflow:hidden;flex:none}
.gb-b{font-family:inherit;background:var(--glass);border:1px solid var(--glassb);border-radius:8px;
  padding:0 12px;height:27px;color:var(--mut);font-size:11.5px;font-weight:700;cursor:pointer;
  white-space:nowrap;transition:all .2s;flex:none}
.gb-b:hover{background:rgba(255,255,255,.12);color:var(--txt)}
.gb-seg .gb-b{border:none;border-radius:0}
.gb-b.on{background:var(--accent);color:#04211d}
.gb-inp{font-family:inherit;background:var(--glass);border:1px solid var(--glassb);border-radius:8px;
  padding:0 7px;height:27px;color:var(--txt);font-size:11px;outline:none;color-scheme:dark;flex:none}
.gb-inp[type=month]{width:118px}
select.gb-inp{width:104px}
.gb-note{font-size:11px;color:var(--mut);font-weight:700;white-space:nowrap;flex:none}
.gb-cut{margin-left:8px}
/* 이 페이지가 지원하지 않는 컨트롤 — 자리는 유지(폭 통일), 동작만 막는다 */
#gbar .off,#gstLocalBar .off{opacity:.32}
.gb-badge{display:inline-block;margin-left:5px;min-width:15px;padding:0 4px;border-radius:8px;
  background:var(--bad,#fb7185);color:#1a0508;font-size:9.5px;font-weight:800;line-height:15px;text-align:center}
.tab{padding:13px 22px;font-size:14px;font-weight:700;color:var(--mut);cursor:pointer;
  border:none;background:transparent;border-bottom:3px solid transparent;transition:color .2s,border-color .25s cubic-bezier(.4,0,.2,1);white-space:nowrap;position:relative;top:2px}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .ic{margin-right:7px;display:inline-flex;vertical-align:-2px}

/* iframe 영역 */
.frame-wrap{flex:1;position:relative;background:#16163a}
.frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;background:#16163a}
.frame-wrap iframe.active{display:block;animation:frameIn .3s ease}
@keyframes frameIn{from{opacity:.3}to{opacity:1}}
.frame-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;pointer-events:none}
.spinner{width:36px;height:36px;border:3px solid var(--glassb);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 자동순회(키오스크) — 단지 × 페이지를 돌며 보여준다 =====
   화면에 «지금 무엇을 보고 있는지»를 반드시 띄운다. 벽에 걸어 두면 지나가는 사람은
   맥락 없이 숫자만 본다 — 어느 단지인지 안 적히면 그 숫자를 자기 단지로 읽는다. */
.kiosk-bar{position:fixed;left:0;right:0;bottom:0;z-index:9000;display:none;
  background:linear-gradient(0deg,rgba(4,10,18,.96),rgba(4,10,18,.80));
  border-top:1px solid var(--glassb);padding:10px 18px 12px;
  font:600 14px/1.3 system-ui,sans-serif;color:#E6EDF3;align-items:center;gap:16px}
body.kiosk-on .kiosk-bar{display:flex}
.kiosk-bar .kk-now{font-size:19px;font-weight:800;letter-spacing:-.01em}
.kiosk-bar .kk-camp{color:var(--accent,#2DD4BF)}
.kiosk-bar .kk-next{color:#8B98A9;font-weight:500;font-size:12px}
.kiosk-bar .kk-pos{margin-left:auto;color:#8B98A9;font-weight:500;font-size:12px}
.kiosk-bar .kk-hint{color:#5E6D80;font-weight:500;font-size:11px}
.kiosk-prog{position:absolute;left:0;top:0;height:2px;background:var(--accent,#2DD4BF);width:0}
/* 전환은 «같은 탭에서 단지만 바뀔 때»도 걸려야 한다 — .active 애니메이션은 탭이 바뀔 때만 돈다 */
.frame-wrap.kk-fade iframe.active{opacity:.15;transition:opacity .18s ease}
/* 하단바는 덮는 게 아니라 «자리를 차지»해야 한다 — 겹치면 표 마지막 줄·범례가 가려진다 */
body.kiosk-on .frame-wrap{margin-bottom:46px}
/* 화면보호기처럼 «모니터를 꽉» 쓰려면 셸 머리를 감춰야 한다. 사이드바는 원래 접혀 있어
   따로 손댈 것이 없다. 페이지 자신의 머리(기준일·필터 칩)는 남긴다 — 벽에 걸린 화면에서
   «언제 기준인지»가 없으면 지나가는 사람이 오늘 숫자로 읽는다. */
body.kiosk-full .topbar,body.kiosk-full .tabbar,body.kiosk-full .gbarrow{display:none}
body.kiosk-full .kiosk-panel{display:none}

.kiosk-panel{position:absolute;right:12px;top:52px;z-index:9500;display:none;width:330px;
  background:var(--card,#0E141C);border:1px solid var(--glassb);border-radius:12px;
  padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.5);font:13px system-ui,sans-serif;color:var(--txt)}
.kiosk-panel.open{display:block}
.kiosk-panel h4{margin:0 0 4px;font-size:14px}
.kiosk-panel .kp-sub{color:#8B98A9;font-size:11px;margin-bottom:12px;line-height:1.5}
.kiosk-panel .kp-lbl{font-size:11px;color:#8B98A9;margin:12px 0 6px;font-weight:700;letter-spacing:.04em}
.kiosk-panel .kp-lbl .kp-all{float:right;font-weight:600;letter-spacing:0;color:var(--accent,#2DD4BF);cursor:pointer;font-size:11px}
.kiosk-panel .kp-est{margin-top:12px;font-size:11px;color:#8B98A9;text-align:center}
.kiosk-panel .kp-row{display:flex;flex-wrap:wrap;gap:6px}
.kiosk-panel .kp-chip{padding:5px 10px;border:1px solid var(--glassb);border-radius:7px;
  background:transparent;color:var(--txt);cursor:pointer;font-size:12px}
.kiosk-panel .kp-chip.on{background:var(--accent,#2DD4BF);color:#04211C;border-color:var(--accent,#2DD4BF);font-weight:700}
.kiosk-panel .kp-box{max-height:132px;overflow:auto;border:1px solid var(--glassb);border-radius:8px;padding:8px}
.kiosk-panel .kp-box label{display:flex;align-items:center;gap:7px;padding:3px 2px;cursor:pointer;font-size:12px}
.kiosk-panel .kp-box input{width:auto;margin:0}
.kiosk-panel .kp-go{margin-top:14px;width:100%;padding:9px;border:none;border-radius:8px;
  background:var(--accent,#2DD4BF);color:#04211C;font-weight:800;font-size:13px;cursor:pointer}
.kiosk-panel .kp-go:disabled{opacity:.45;cursor:default}
.kiosk-panel .kp-warn{margin-top:10px;color:#fbbf24;font-size:11px;line-height:1.5}

@media(max-width:768px){
  .brand .tag{display:none}
  .brand .logo{font-size:17px}
  .tab{padding:11px 12px;font-size:12px}
  .tab .ic{margin-right:4px}
  .topbar{padding:8px 12px;gap:6px}
  .tabbar{padding:0 8px}
  .gbarrow{padding:0 8px}
  .gb-note:not(.gb-cut){display:none}
  .tb-btn{padding:7px 10px;font-size:11px}
  .tb-btn span{display:none}
  .tb-btn.logout span{display:inline}
}
</style>
</head>
<body>

<div id="loginOverlay" style="position:fixed;inset:0;z-index:99999;background:#070b10;display:flex;align-items:center;justify-content:center"></div>
<!-- 상단 바 -->
<div class="topbar">
  <div class="brand">
    <span class="logo" data-lock>Service Operation Dashboard</span>
    <span class="tag" id="brandTag" data-lock>By CS Global Team</span>
  </div>
  <div class="topbar-right">
    <button class="tb-btn" onclick="refreshActive()" id="refreshBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg> <span id="refreshLabel">새로고침</span></button>
    <!-- 업로드는 탭이 아니다 — 매일 보는 탭 줄에 관리용 화면을 섞지 않는다(diag 와 같은 규율).
         대신 여기 툴바에 두어 «데이터를 넣는 곳»을 한 번에 찾을 수 있게 한다.
         새 창으로 여는 이유: 탭 iframe 에 띄우면 탭 줄에서 아무 탭도 활성이 아니게 되고,
         업로드 도중에 탭을 누르면 진행 중이던 적재 화면이 그대로 날아간다. -->
    <button class="tb-btn" onclick="openUpload()" id="uploadBtn" title="데이터 업로드 (새 창)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg> <span id="uploadLabel">업로드</span></button>
    <button class="tb-btn" onclick="kioskBtn()" id="kioskBtn" title="자동순회 — 단지별로 화면이 바뀌며 돌아갑니다"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="m10 8 4 2.5-4 2.5z" fill="currentColor"/></svg> <span id="kioskLabel">자동순회</span></button>
    <button class="tb-btn" onclick="shareLink()" id="shareBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg> <span id="shareLabel">공유</span></button>
    <button class="tb-btn" onclick="cycleTheme()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9c0-.5-.4-1-1-1h-2a3 3 0 0 1-3-3V6c0-.6-.4-1-1-1z"/><circle cx="7.5" cy="10.5" r="1"/><circle cx="10.5" cy="6.5" r="1"/><circle cx="15" cy="15.5" r="1"/></svg> <span id="themeLabel">Dark</span></button>
    <button class="tb-btn" onclick="cycleLang()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> <span id="langLabel">KO</span></button>
    <button class="tb-btn logout" onclick="doLogout()" id="logoutBtn">로그아웃</button>
  </div>
</div>

<!-- 자동순회 설정 패널 -->
<div class="kiosk-panel" id="kioskPanel">
  <h4 id="kkTitle">자동순회</h4>
  <div class="kp-sub" id="kkSub">고른 단지마다 고른 페이지를 차례로 보여줍니다. Esc 로 멈춥니다.</div>
  <div class="kp-lbl" id="kkLblAx">순회 기준</div>
  <div class="kp-row" id="kkAx"></div>
  <div class="kp-lbl" id="kkLblSec">전환 간격</div>
  <div class="kp-row" id="kkSec"></div>
  <div class="kp-lbl" id="kkLblPage">페이지<span class="kp-all" onclick="kioskAll('kkPages')">전체 / 해제</span></div>
  <div class="kp-box" id="kkPages"></div>
  <div class="kp-lbl" id="kkLblCamp"><span id="kkAxName">단지</span><span class="kp-all" onclick="kioskAll('kkCamps')">전체 / 해제</span></div>
  <div class="kp-box" id="kkCamps"></div>
  <label style="display:flex;align-items:center;gap:7px;margin-top:12px;font-size:12px;cursor:pointer"><input type="checkbox" id="kkFull" checked style="width:auto;margin:0"> 전체화면으로 (모니터를 꽉 채웁니다)</label>
  <div class="kp-est" id="kkEst"></div>
  <div class="kp-warn" id="kkWarn" style="display:none"></div>
  <button class="kp-go" id="kkGo" onclick="kioskStart()">▶ 시작</button>
</div>
<!-- 순회 중 하단 표시 -->
<div class="kiosk-bar" id="kioskBar">
  <div class="kiosk-prog" id="kkProg"></div>
  <div class="kk-now"><span class="kk-camp" id="kkCamp">—</span> <span id="kkPage"></span></div>
  <div class="kk-next" id="kkNext"></div>
  <div class="kk-pos" id="kkPos"></div>
  <div class="kk-hint" id="kkHint">Esc 종료</div>
</div>

<!-- 탭 바 -->
<div class="tabbar" id="tabbar"></div>
<!-- 공통 컨트롤 바 (전용 줄 — 탭을 가리지 않는다) -->
<div class="gbarrow">
  <!-- 챗봇 — 컨트롤 바로 왼쪽에 붙여 함께 오른쪽으로 정렬한다 -->
  <div class="askwrap" id="askWrap">
    <svg class="ask-ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 21l1.9-4.1A8.4 8.4 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.5 8.5 0 0 1 21 11.5z"/></svg>
    <input id="askInp" class="ask-inp" type="text" autocomplete="off" placeholder="대시보드 챗봇">
    <button class="ask-go" id="askGo" title="질문">↵</button>
  </div>
  <!-- 패널은 .gbarrow(position:relative) 안에 둔다 — 밖에 두면 기준이 body가 돼 화면 아래로 내려간다 -->
  <div class="askpanel" id="askPanel">
    <div class="ask-head"><b>대시보드 챗봇</b><span id="askMode" class="ask-mode"></span><button class="ask-x" onclick="askClose()">✕</button></div>
    <div class="ask-log" id="askLog"></div>
    <div class="ask-tips" id="askTips"></div>
  </div>
  <div id="gbar"></div>
</div>

<!-- iframe 영역 -->
<div class="frame-wrap" id="frameWrap">
  <div class="frame-loading" id="frameLoading"><div class="spinner"></div></div>
</div>

<script>
const BASE='https://gstcsglobal-cloud.github.io';

// 탭 정의 (순서대로)
const SVG={
  report:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="7"/><rect x="12" y="7" width="3" height="11"/><rect x="17" y="4" width="3" height="14"/></svg>',
  hr:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  scrubber:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  pm:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  fault:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  material:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/></svg>',
  tco:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>',
  cip:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>'
};
const TABS=[
  {id:'report',  path:'/report/',   ko:'주간 현황', en:'Weekly',       zh:'周现况', ja:'週間現況'},
  {id:'hr',      path:'/hr/',       ko:'인원 현황', en:'Workforce',    zh:'人员',   ja:'人員'},
  {id:'scrubber',path:'/scrubber/', ko:'설치 현황', en:'Installation', zh:'安装',   ja:'設置'},
  {id:'pm',      path:'/pm/',       ko:'PM 점검',   en:'PM Schedule',  zh:'PM点检', ja:'PM点検'},
  {id:'fault',   path:'/fault/',    ko:'고장 분석', en:'Fault',        zh:'故障',   ja:'故障'},
  {id:'material',path:'/material/', ko:'자재 실적', en:'Material',     zh:'材料',   ja:'資材'},
  {id:'cip',     path:'/cip/',      ko:'CIP 현황',  en:'CIP',          zh:'CIP',    ja:'CIP'},
  {id:'tco',     path:'/tco/',      ko:'TCO',       en:'TCO',          zh:'TCO',    ja:'TCO'}
];

const L={
  ko:{tag:'By CS Global Team',kiosk:'자동순회',kioskStop:'■ 정지',upload:'업로드',logout:'로그아웃',refresh:'새로고침',exp:'내보내기',share:'공유',copied:'복사됨!'},
  en:{tag:'By CS Global Team',kiosk:'Auto Tour',kioskStop:'■ Stop',upload:'Upload',logout:'Logout',refresh:'Refresh',exp:'Export',share:'Share',copied:'Copied!'},
  zh:{tag:'By CS Global Team',kiosk:'自动轮播',kioskStop:'■ 停止',upload:'上传',logout:'登出',refresh:'刷新',exp:'导出',share:'分享',copied:'已复制!'},
  ja:{tag:'By CS Global Team',kiosk:'自動巡回',kioskStop:'■ 停止',upload:'アップロード',logout:'ログアウト',refresh:'更新',exp:'エクスポート',share:'共有',copied:'コピー済み!'}
};
let LANG='ko';
try{ const sl=sessionStorage.getItem('gst_lang'); if(sl&&L[sl])LANG=sl; else if(window.name && L[window.name]) LANG=window.name; }catch(e){}

const frames={}; // id -> iframe element
let activeTab=null;

function lt(k){return (L[LANG]||L.ko)[k]||k;}

/* ============================================================
   자동순회(키오스크) — 단지 × 페이지를 돌며 보여준다
   벽 화면·회의실 상시 표시용. «그냥 켜두면 알아서 넘어간다»가 전부다.

   지킬 것 넷:
   - **단지 목록을 여기 박지 말 것.** 지금 보고 있는 페이지에 물어서 받는다
     (`gst-kiosk-q`). 목록을 박으면 국내가 들어왔을 때 통째로 빠졌던 v89 가 그대로 재현된다.
   - **사람이 걸어 둔 필터를 돌려준다.** 순회는 남의 화면을 빌려 쓰는 것이다 —
     끝내고 나서 «내가 보던 단지»가 아니면 다음부터 아무도 안 켠다.
   - **지금 무엇을 보는지 화면에 적는다.** 벽에 걸면 지나가는 사람은 맥락 없이 숫자만
     본다. 단지 이름이 없으면 그 숫자를 자기 단지로 읽는다.
   - **마우스가 움직였다고 멈추지 않는다.** TV 앞은 사람이 지나다니는 곳이다.
     멈추는 것은 Esc 와 버튼뿐이다.
   자료 갱신은 따로 안 한다 — 페이지가 이미 GST.startAutoRefresh(30) 으로 30분마다 받는다.
   ============================================================ */
const KIOSK = {on:false, sec:15, axis:'campus', list:[], i:0, timer:null, raf:0, wake:null,
               vals:[], pages:[], full:true, wentFull:false, askT:null, replies:0};
const KK_SECS = [10,15,30,60];
/* 순회 기준 축. «사이트별» 을 사람마다 다르게 뜻한다 — 국내는 단지(H1·P2), 해외는
   법인(GST TAIWAN)이 곧 그 단위다. 그래서 고르게 한다. 값 목록은 어느 축이든
   페이지에 물어서 받는다(박지 않는다). */
const KK_AXES = [{k:'campus',t:'단지'},{k:'op',t:'운영단위'},{k:'customer',t:'고객사'}];

function kioskBtn(){
  if(KIOSK.on){ kioskStop(); return; }
  const pn=document.getElementById('kioskPanel');
  if(pn.classList.contains('open')){ pn.classList.remove('open'); return; }
  kioskBuildPanel(); pn.classList.add('open');
}

/* 값 목록은 «열려 있는 모든 탭»에 묻고 합친다.
   ⚠ 예전에는 활성 탭 하나에만 물었다. 그 탭이 답을 못 하면(자료 로딩 전이거나 배포된
     core.js 가 옛 버전이면) 패널이 「읽는 중…」 그대로 **영영 멈춰 있었다** — 실제로
     사용자가 하루 종일 그 화면을 봤다. 조용히 기다리는 것이 가장 나쁜 실패다.
   그래서 ① 여럿에게 묻고 ② 답이 없으면 시간을 끊어 ③ «무엇을 하면 되는지»를 적는다. */
function kioskAsk(){
  KIOSK.vals=[]; KIOSK.replies=0; KIOSK.askedVer=0;
  const fs=Object.keys(frames);
  fs.forEach(k=>{ try{ frames[k].contentWindow.postMessage({type:'gst-kiosk-q',axis:KIOSK.axis},'*'); }catch(e){} });
  kioskFillCamps();
  clearTimeout(KIOSK.askT);
  KIOSK.askT=setTimeout(()=>kioskFillCamps(true), 2500);   // 답이 안 오면 그때 진단을 적는다
}
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type!=='gst-kiosk-a' || d.axis!==KIOSK.axis) return;
  KIOSK.replies++; KIOSK.askedVer=d.ver||0;
  (d.list||[]).forEach(v=>{ if(KIOSK.vals.indexOf(v)<0) KIOSK.vals.push(v); });
  KIOSK.vals.sort((a,b)=>String(a).localeCompare(String(b),'ko'));
  kioskFillCamps();
});

function kioskBuildPanel(){
  // 순회 기준 축
  const ax=document.getElementById('kkAx');
  ax.innerHTML = KK_AXES.map(a=>'<button class="kp-chip'+(a.k===KIOSK.axis?' on':'')+'" data-a="'+a.k+'">'+a.t+'</button>').join('');
  ax.querySelectorAll('.kp-chip').forEach(b=>b.onclick=()=>{ KIOSK.axis=b.dataset.a;
    ax.querySelectorAll('.kp-chip').forEach(x=>x.classList.toggle('on',x===b)); kioskAsk(); });
  // 전환 간격
  const sec=document.getElementById('kkSec');
  sec.innerHTML = KK_SECS.map(v=>'<button class="kp-chip'+(v===KIOSK.sec?' on':'')+'" data-s="'+v+'">'+v+'초</button>').join('');
  sec.querySelectorAll('.kp-chip').forEach(b=>b.onclick=()=>{ KIOSK.sec=+b.dataset.s;
    sec.querySelectorAll('.kp-chip').forEach(x=>x.classList.toggle('on',x===b)); kioskEst(); });
  // 페이지 — 탭 정의에서 만든다(탭이 늘면 여기도 자동으로 는다)
  const pg=document.getElementById('kkPages');
  pg.innerHTML = TABS.map(t=>'<label><input type="checkbox" value="'+t.id+'"'
    +((!KIOSK.pages.length||KIOSK.pages.indexOf(t.id)>=0)?' checked':'')+'> '+(t[LANG]||t.ko)+'</label>').join('');
  pg.onchange=kioskEst;
  kioskAsk();
}
function kioskFillCamps(timedOut){
  const box=document.getElementById('kkCamps'), warn=document.getElementById('kkWarn'), go=document.getElementById('kkGo');
  const axName=(KK_AXES.find(a=>a.k===KIOSK.axis)||{}).t||'값';
  const nm=document.getElementById('kkAxName'); if(nm) nm.textContent=axName;
  if(KIOSK.vals.length){
    warn.style.display='none';
    box.innerHTML = KIOSK.vals.map(c=>'<label><input type="checkbox" value="'+c+'" checked> '+c+'</label>').join('');
    box.onchange=kioskEst; kioskEst(); return;
  }
  box.innerHTML='<div style="color:#8B98A9;font-size:11px;padding:4px">'+axName+' 목록을 읽는 중…</div>';
  go.disabled=true;
  if(!timedOut){ warn.style.display='none'; return; }
  /* 여기부터가 «무엇을 하면 되는지». 두 실패는 할 일이 완전히 다르다. */
  warn.style.display='block';
  const tabs=Object.keys(frames).length;
  if(!KIOSK.replies){
    warn.innerHTML='탭이 응답하지 않습니다 ('+tabs+'개 열림). 배포된 <b>core.js 가 옛 버전</b>일 수 있습니다 —'
      +' 대시보드에서 <b>Ctrl+Shift+R</b> 로 강제 새로고침한 뒤 다시 눌러 주세요.'
      +' <span style="color:#8B98A9">(자동순회는 core.js v101 이상이 필요합니다)</span>';
  } else {
    warn.innerHTML='「'+axName+'」 값이 이 화면 자료에 없습니다 (응답 '+KIOSK.replies+'개 탭 · core.js v'+(KIOSK.askedVer||'?')+').'
      +' 위에서 <b>다른 기준</b>을 골라 보시거나, 자료가 다 뜬 뒤 다시 눌러 주세요.';
  }
}
/* 여덟 페이지 × 값 여럿이면 손으로 다 끄기가 번거롭다 — 한 번에 뒤집는다. */
function kioskAll(id){
  const xs=[...document.querySelectorAll('#'+id+' input')];
  const on=xs.some(x=>!x.checked);
  xs.forEach(x=>x.checked=on); kioskEst();
}
/* «15초» 만 보면 한 바퀴가 얼마인지 아무도 모른다 — 8페이지 × 6단지면 12분이다.
   그 숫자를 안 적으면 «왜 아까 그 화면이 다시 안 오나» 로 돌아온다. */
function kioskEst(){
  const np=document.querySelectorAll('#kkPages input:checked').length;
  const nc=document.querySelectorAll('#kkCamps input:checked').length;
  const n=np*nc, sec=n*KIOSK.sec;
  const est=document.getElementById('kkEst');
  est.textContent = n ? (n+'단계 · 한 바퀴 '+(sec>=60?Math.round(sec/60)+'분':sec+'초')) : '';
  const go=document.getElementById('kkGo'); if(go) go.disabled = !n;
}

function kioskStart(){
  const pages=[...document.querySelectorAll('#kkPages input:checked')].map(x=>x.value);
  const vals =[...document.querySelectorAll('#kkCamps input:checked')].map(x=>x.value);
  if(!pages.length || !vals.length){
    const w=document.getElementById('kkWarn');
    w.style.display='block'; w.textContent='페이지와 기준값을 하나씩은 골라 주세요.'; return; }
  KIOSK.pages=pages;
  KIOSK.full=document.getElementById('kkFull').checked;
  /* 순서: 기준값이 «바깥», 페이지가 «안». 한 사이트의 이야기를 끝까지 보여 준 뒤 다음으로
     넘어간다 — 페이지를 바깥에 두면 같은 화면만 사이트를 바꿔 가며 반복해 맥락이 끊긴다. */
  KIOSK.list=[]; vals.forEach(c=>pages.forEach(p=>KIOSK.list.push({val:c,page:p})));
  KIOSK.i=-1; KIOSK.on=true;
  document.getElementById('kioskPanel').classList.remove('open');
  document.body.classList.add('kiosk-on');
  document.getElementById('kioskLabel').textContent=lt('kioskStop');
  /* 전체화면은 «사용자 동작 안에서만» 걸린다 — 그래서 시작 버튼 클릭 흐름에서 부른다.
     막히면 조용히 넘어간다(창 모드로도 순회는 그대로 돈다). */
  if(KIOSK.full) kioskFull(true);
  kioskWake(true);
  kioskNext();
}

/* 모니터를 꽉 채운다. 셸 머리(상단바·탭바·챗봇줄)를 감추고 브라우저도 전체화면으로. */
function kioskFull(on){
  document.body.classList.toggle('kiosk-full', !!on);
  try{
    if(on && document.documentElement.requestFullscreen && !document.fullscreenElement){
      document.documentElement.requestFullscreen().then(()=>{ KIOSK.wentFull=true; }).catch(()=>{});
    } else if(!on && KIOSK.wentFull && document.fullscreenElement && document.exitFullscreen){
      document.exitFullscreen().catch(()=>{});
    }
  }catch(e){}
  if(!on) KIOSK.wentFull=false;
}
/* F11 등으로 «전체화면만» 빠져나갔을 때 머리가 감춰진 채 남으면 되돌릴 방법이 없어진다. */
document.addEventListener('fullscreenchange',()=>{
  if(KIOSK.on && KIOSK.wentFull && !document.fullscreenElement) kioskStop();
});

function kioskNext(){
  if(!KIOSK.on) return;
  KIOSK.i = (KIOSK.i+1) % KIOSK.list.length;
  const it = KIOSK.list[KIOSK.i], nx = KIOSK.list[(KIOSK.i+1)%KIOSK.list.length];
  const nm = id => { const t=TABS.find(x=>x.id===id); return t?(t[LANG]||t.ko):id; };

  const wrap=document.getElementById('frameWrap');
  wrap.classList.add('kk-fade');
  setTimeout(()=>{
    switchTab(it.page);
    /* 탭이 이제 막 만들어졌으면 아직 로드 전이다 — 잠깐 뒤 한 번 더 보낸다.
       («한 번만» 보내면 첫 바퀴에서 그 탭만 필터가 안 걸린 채 지나간다.) */
    kioskSend(it.page, it.val);
    setTimeout(()=>kioskSend(it.page, it.val), 1200);
    wrap.classList.remove('kk-fade');
  }, 180);

  document.getElementById('kkCamp').textContent = it.val;
  document.getElementById('kkPage').textContent = nm(it.page);
  document.getElementById('kkNext').textContent = '다음 · '+nx.val+' '+nm(nx.page);
  document.getElementById('kkPos').textContent  = (KIOSK.i+1)+' / '+KIOSK.list.length;

  const t0=Date.now(), ms=KIOSK.sec*1000, bar=document.getElementById('kkProg');
  cancelAnimationFrame(KIOSK.raf);
  (function tick(){ if(!KIOSK.on) return;
    bar.style.width = Math.min(100,(Date.now()-t0)/ms*100)+'%';
    KIOSK.raf=requestAnimationFrame(tick); })();
  clearTimeout(KIOSK.timer); KIOSK.timer=setTimeout(kioskNext, ms);
}
function kioskSend(page, val){
  const f=frames[page]; if(!f) return;
  try{ f.contentWindow.postMessage({type:'gst-kiosk-set', axis:KIOSK.axis, value:val},'*'); }catch(e){}
}

function kioskStop(){
  KIOSK.on=false;
  clearTimeout(KIOSK.timer); cancelAnimationFrame(KIOSK.raf);
  document.body.classList.remove('kiosk-on');
  document.getElementById('frameWrap').classList.remove('kk-fade');
  document.getElementById('kioskLabel').textContent=lt('kiosk');
  kioskFull(false);
  /* 빌려 쓴 필터를 돌려준다 — 열린 «모든» 탭에 보낸다. 순회 도중 만들어진 탭도 있다. */
  Object.values(frames).forEach(f=>{ try{ f.contentWindow.postMessage({type:'gst-kiosk-restore'},'*'); }catch(e){} });
  kioskWake(false);
}

/* 화면이 잠들면 순회를 켜 둔 뜻이 없다. 지원 안 하는 브라우저면 조용히 넘어간다 —
   되지도 않는 것을 경고로 띄우면 매번 닫아야 한다. */
function kioskWake(on){
  try{
    if(on && navigator.wakeLock && !KIOSK.wake){
      navigator.wakeLock.request('screen').then(w=>{ KIOSK.wake=w;
        w.addEventListener('release',()=>{ KIOSK.wake=null; }); }).catch(()=>{});
    } else if(!on && KIOSK.wake){ KIOSK.wake.release().catch(()=>{}); KIOSK.wake=null; }
  }catch(e){}
}
/* 탭을 숨겼다 돌아오면 wakeLock 이 풀려 있다(브라우저 규약) — 다시 잡는다. */
document.addEventListener('visibilitychange',()=>{
  if(KIOSK.on && document.visibilityState==='visible') kioskWake(true);
});
/* 멈추는 것은 Esc 와 버튼뿐이다. 마우스 움직임으로 멈추면 TV 앞을 지나가기만 해도 꺼진다. */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(KIOSK.on) kioskStop();
    else document.getElementById('kioskPanel').classList.remove('open'); }
});

/* 업로드 화면은 별도 창. 셸의 iframe 에 띄우지 않는다 — 위 버튼 주석 참조. */
function openUpload(){ window.open('/upload/','gstUpload'); }

function applyLang(){
  {const _bt=document.getElementById('brandTag'); if(_bt&&!_bt.hasAttribute('data-lock'))_bt.textContent=lt('tag');}
  document.getElementById('logoutBtn').textContent=lt('logout');
  document.getElementById('refreshLabel').textContent=lt('refresh');
  document.getElementById('shareLabel').textContent=lt('share');
  document.getElementById('uploadLabel').textContent=lt('upload');
  document.getElementById('kioskLabel').textContent=KIOSK.on?lt('kioskStop'):lt('kiosk');
  document.getElementById('langLabel').textContent=LANG.toUpperCase();
  // 탭 이름 갱신
  document.querySelectorAll('.tab').forEach(el=>{
    const tab=TABS.find(t=>t.id===el.dataset.id);
    if(tab)el.querySelector('.tab-label').textContent=tab[LANG]||tab.ko;
  });
  renderGBar();
}

// ===== 공통 컨트롤 바 — 활성 페이지가 등록한 caps로 그린다 =====
const TAB_BAR={};   // tabId -> {caps,state,weeks}
function frameIdOf(src){
  return Object.keys(frames).find(k=>{ try{ return frames[k].contentWindow===src; }catch(e){ return false; } });
}
function renderGBar(){
  const el=document.getElementById('gbar'); if(!el)return;
  const reg=TAB_BAR[activeTab];
  el.innerHTML = reg ? GST.barHTML(reg, LANG) : '';
}
function barSend(key,val){
  // 구간 범위는 전 페이지 공통 상태 — 셸이 먼저 확정하고 살아 있는 모든 프레임에 뿌린다.
  // 활성 탭에만 보내면 다른 탭이 낡은 구간으로 남는다.
  if(key==='span'){
    GST.setSpan12(val===true||val==='true');
    Object.values(frames).forEach(f=>{ try{ f.contentWindow.postMessage({type:'gst-bar-set',key:key,val:val},'*'); }catch(err){} });
    renderGBar(); return;
  }
  const f=frames[activeTab]; if(!f)return;
  try{ f.contentWindow.postMessage({type:'gst-bar-set',key:key,val:val},'*'); }catch(e){}
}
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='gst-bar-reg'){
    const id=frameIdOf(e.source); if(!id)return;
    TAB_BAR[id]={caps:d.caps||{},state:d.state||{},weeks:d.weeks||null};
    if(id===activeTab) renderGBar();
    return;
  }
  // 차트 디자인은 전 페이지 공통 — 이미 열려 있는 다른 탭에도 전파
  if(d.type==='gst-style' && d.style){
    Object.values(frames).forEach(f=>{ try{f.contentWindow.postMessage({type:'gst-style',style:d.style},'*');}catch(err){} });
  }
});


// ===== 테마 (모든 iframe에 전파) =====
const THEMES=[{key:'slate',label:'Slate'},{key:'default',label:'Navy'},{key:'burgundy',label:'Burgundy'},{key:'light',label:'Light'}];
let THEME='slate';
try{const s=sessionStorage.getItem('gst_theme');if(s&&THEMES.find(t=>t.key===s))THEME=s;}catch(e){}

function cycleTheme(){
  const i=THEMES.findIndex(t=>t.key===THEME);
  THEME=THEMES[(i+1)%THEMES.length].key;
  try{sessionStorage.setItem('gst_theme',THEME);}catch(e){}
  applyTheme();
  broadcast({type:'gst-theme',theme:THEME});
}
function applyTheme(){
  document.getElementById('themeLabel').textContent=THEMES.find(t=>t.key===THEME).label;
  document.body.className = THEME==='default' ? '' : 'theme-'+THEME;
}
// 모든 iframe에 메시지 전송
function broadcast(msg){
  Object.values(frames).forEach(f=>{ try{f.contentWindow.postMessage(msg,'*');}catch(e){} });
}

// ===== URL 상태 (탭+필터) 공유 =====
const TAB_STATE={};
let PENDING_STATE=null;
function parseHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  return {tab:p.get('tab'), f:p.get('f')};
}
function updateHash(){
  try{
    const p=new URLSearchParams();
    if(activeTab)p.set('tab',activeTab);
    if(TAB_STATE[activeTab])p.set('f',TAB_STATE[activeTab]);
    history.replaceState(null,'','#'+p.toString());
  }catch(e){}
}
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='gst-state'){ TAB_STATE[activeTab]=d.state||''; updateHash(); }
});
/* ===== 대시보드 챗봇 =====
   각 탭(iframe)에 '지금 화면의 숫자'를 물어 모은 뒤(gst-ask → gst-facts) 답한다.
   ① AI 경로: kakao-bot 엣지펑션의 op=web 분기 — 카카오봇과 같은 엔진(시트 미러링)으로 답한다.
   ② 로컬 경로: 펑션이 없으면 core의 규칙 엔진이 해당 지표를 찾아 즉답한다.
   숫자는 어느 쪽이든 페이지가 계산한 값 그대로라 화면과 어긋나지 않는다. */
const ASK={hist:[],busy:false,ai:null,seq:0,pend:{}};
const ASK_TIPS=['재직 인원 몇 명?','교육 완료율 어때?','최근 30일 고장 몇 건?','PM 진행율 알려줘','라인별 인원 알려줘','설치 대수 몇 대야?'];
function askOpen(){ const p=document.getElementById('askPanel'); p.classList.add('open');
  if(!document.getElementById('askLog').children.length)askSay('a','안녕하세요. 대시보드에 있는 값은 무엇이든 물어보세요.\n탭을 여러 개 열어두면 그 탭들까지 함께 찾아 답합니다.');
  askTips(); }
function askClose(){ document.getElementById('askPanel').classList.remove('open'); }
function askTips(){ const b=document.getElementById('askTips'); if(b.children.length)return;
  ASK_TIPS.forEach(t=>{ const el=document.createElement('button'); el.className='ask-tip'; el.textContent=t;
    el.onclick=()=>{ document.getElementById('askInp').value=t; askSend(); }; b.appendChild(el); }); }
function askSay(kind,txt){
  const log=document.getElementById('askLog'), d=document.createElement('div');
  d.className='ask-msg '+kind;
  d.innerHTML=String(txt).replace(/[<>]/g,c=>({'<':'&lt;','>':'&gt;'}[c]))
    .replace(/&lt;span class="ct-src"&gt;(.*?)&lt;\/span&gt;/g,'<span class="ct-src">$1</span>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
}
// 살아 있는 모든 탭에 사실을 요청 — 응답이 오는 대로 모으고 잠시 뒤 마감
function askFacts(ms){
  const id=++ASK.seq, got=[];
  ASK.pend[id]=got;
  Object.keys(frames).forEach(k=>{ try{ frames[k].contentWindow.postMessage({type:'gst-ask',id:id},'*'); }catch(e){} });
  return new Promise(res=>setTimeout(()=>{ delete ASK.pend[id]; res(got); },ms||400));
}
// 안 연 탭은 데이터가 없다 — 백그라운드로 모두 띄워 전 탭을 답변 범위에 넣는다
function askLoadAll(){
  const miss=TABS.filter(t=>!frames[t.id]);
  if(!miss.length)return false;
  miss.forEach(t=>{ const f=document.createElement('iframe'); f.src=BASE+t.path; f.dataset.id=t.id;
    document.getElementById('frameWrap').appendChild(f); frames[t.id]=f; });
  askSay('a','다른 탭 '+miss.length+'개를 백그라운드로 불러오는 중입니다. 10~20초 뒤 다시 물어보시면 전 탭에서 찾아 답합니다.');
  return true;
}
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='gst-facts'&&ASK.pend[d.id]&&d.pack)ASK.pend[d.id].push(d.pack);
});
async function askSend(){
  const inp=document.getElementById('askInp'), q=(inp.value||'').trim();
  if(!q||ASK.busy)return;
  askOpen(); inp.value=''; askSay('q',q); ASK.busy=true;
  const wait=askSay('a','…찾는 중');
  try{
    const packs=await askFacts();
    if(!packs.length){ wait.textContent='탭이 아직 로딩 중입니다. 잠시 뒤 다시 물어봐 주세요.'; return; }
    let ans=null, mode='';
    if(ASK.ai!==false){                                  // AI 경로 우선(엣지펑션이 있으면)
      try{ ans=await GST.chatAI(q,packs,ASK.hist); ASK.ai=true; mode='AI'; }
      catch(err){ ASK.ai=false; }                        // 없거나 실패하면 이후로는 로컬만
    }
    if(!ans){ ans=GST.chatLocal(q,packs); mode='기본'; }
    wait.remove();
    if(!ans){
      const unopened=TABS.filter(t=>!frames[t.id]).length;
      askSay('a','그 값은 지금 열려 있는 탭에서 못 찾았습니다.'
        +(unopened?('\n안 연 탭이 '+unopened+'개 있습니다 — 아래 버튼을 누르면 전 탭을 불러와 다음 질문부터 함께 찾습니다.'):'')
        +'\n※ AI 응답은 kakao-bot 엣지펑션(op=web 지원 버전)이 배포돼 있어야 합니다.');
      if(unopened){ const b=document.createElement('button'); b.className='ask-tip'; b.textContent='📥 전 탭 불러오기';
        b.onclick=()=>{ askLoadAll(); b.remove(); }; document.getElementById('askLog').appendChild(b); }
      ASK.busy=false; return;
    }
    askSay('a',ans);
    document.getElementById('askMode').textContent=mode==='AI'?'AI 응답(시트 원본)':'기본 응답(화면 값만)';
    ASK.hist.push({role:'user',content:q},{role:'assistant',content:String(ans).slice(0,600)});
  }catch(err){ wait.textContent='오류: '+(err&&err.message||err); }
  finally{ ASK.busy=false; }
}
document.addEventListener('DOMContentLoaded',()=>{
  const inp=document.getElementById('askInp');
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')askSend(); });
  inp.addEventListener('focus',askOpen);
  document.getElementById('askGo').onclick=askSend;
  document.addEventListener('click',e=>{
    if(!e.target.closest('#askPanel')&&!e.target.closest('#askWrap'))askClose(); });
});

function shareLink(){
  navigator.clipboard.writeText(location.href).then(()=>{
    const s=document.getElementById('shareLabel'); const o=s.textContent;
    s.textContent=lt('copied'); setTimeout(()=>s.textContent=o,1500);
  });
}

// 카드/표 클릭 → 탭 전환 수신 (d.f 가 있으면 그 필터로 이동 = S/N 드릴다운)
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type!=='gst-goto' || !d.tab)return;
  const loaded=!!frames[d.tab];
  if(d.f && !loaded) PENDING_STATE={tab:d.tab,f:d.f};
  switchTab(d.tab);
  if(d.f && loaded){
    try{ frames[d.tab].contentWindow.postMessage({type:'gst-filter',f:d.f},'*'); }catch(err){}
  }
});
// 현재 탭 새로고침
function refreshActive(){
  if(activeTab && frames[activeTab]){
    frames[activeTab].contentWindow.location.reload();
  }
}

function cycleLang(){
  const order=['ko','en','zh','ja'];
  LANG=order[(order.indexOf(LANG)+1)%4];
  try{window.name=LANG;sessionStorage.setItem('gst_lang',LANG);}catch(e){}
  applyLang();
  broadcast({type:'gst-lang',lang:LANG});
}

function buildTabs(){
  const bar=document.getElementById('tabbar');
  bar.innerHTML='';
  TABS.forEach(tab=>{
    const b=document.createElement('button');
    b.className='tab'; b.dataset.id=tab.id;
    b.innerHTML=`<span class="ic">${SVG[tab.id]||''}</span><span class="tab-label">${tab[LANG]||tab.ko}</span>`;
    b.onclick=()=>switchTab(tab.id);
    bar.appendChild(b);
  });
}

function switchTab(id){
  if(activeTab===id)return;
  activeTab=id;
  // 탭 하이라이트
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  // iframe 없으면 생성 (지연 로딩)
  if(!frames[id]){
    const tab=TABS.find(t=>t.id===id);
    const f=document.createElement('iframe');
    f.src=BASE+tab.path+((PENDING_STATE&&PENDING_STATE.tab===id&&PENDING_STATE.f)?('?f='+PENDING_STATE.f):'');
    f.dataset.id=id;
    f.addEventListener('load',()=>{try{f.contentWindow.postMessage({type:'gst-theme',theme:THEME},'*');f.contentWindow.postMessage({type:'gst-lang',lang:LANG},'*');}catch(e){}});
    document.getElementById('frameWrap').appendChild(f);
    frames[id]=f;
  }
  // 표시 전환
  Object.values(frames).forEach(f=>f.classList.remove('active'));
  frames[id].classList.add('active');
  document.getElementById('frameLoading').style.display='none';
  renderGBar();
  // 현재 탭 기억
  try{sessionStorage.setItem('gst_tab',id);}catch(e){}
  updateHash();
}

// 로그아웃 — GST.signOut()이 세션 저장소 정리 후 새로고침까지 수행한다(공용 PC 보호)
function doLogout(){ GST.signOut(); }

function start(){
  buildTabs();
  GST.barBind(document.getElementById('gbar'), barSend);
  applyLang();
  applyTheme();
  // iframe이 직접 sessionStorage에서 테마를 읽을 수 있도록 현재 테마 저장
  try{sessionStorage.setItem('gst_theme',THEME);}catch(e){}
  // 마지막 본 탭 or 첫 탭
  let init=TABS[0].id;
  try{const saved=sessionStorage.getItem('gst_tab');if(saved&&TABS.find(t=>t.id===saved))init=saved;}catch(e){}
  const hs=parseHash();
  if(hs.tab&&TABS.find(t=>t.id===hs.tab)){ init=hs.tab; if(hs.f)PENDING_STATE={tab:hs.tab,f:hs.f}; }
  switchTab(init);
}


// 키보드 단축키: 1~6 탭 전환
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
  const n=parseInt(e.key);
  if(n>=1 && n<=TABS.length) switchTab(TABS[n-1].id);
});

// 초기화 — 로그인 성공 전에는 start()가 호출되지 않는다(대시보드가 열리지 않음)
(function(){
  applyLang();
  GST.authGate().then(function(r){ if(r) start(); });
})();
</script>
