<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통합 관제 · CS Global Team</title>

<script>window.Papa||document.write('<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js">\x3C/script>')</script>

<link rel="stylesheet" href="https://gstcsglobal-cloud.github.io/assets/theme.css?v=165">
<style>
/* ============================================================
   통합 관제 (v165 · 사용자 요청 「통합관리화면 신규 구축」)
   «세는 화면»이 아니라 «어디를 먼저 볼지»를 말하는 첫 화면이다.
   ⚠ 숫자를 새로 정의하지 않는다 — 판정은 전부 core 정본을 부른다:
     설비 대수 GST.EQ · PM 판정 GST.PM · 고장 위험 GST.riskRank · 국내 BM = 알람 원장(v92 · KR_ON) ·
     국내/해외 GST.ORG.region · 워런티 GST.WARR. 이 화면이 다른 탭과 다른 숫자를 내면 그것은 사고다.
   ⚠ 생김새는 theme.css 토큰을 그대로 쓴다(라이트 기본 · 다크 = body.theme-slate). 클래스는 hb- 로 갈라
     theme.css 의 .kpi/.card 규칙과 섞이지 않게 한다.
   ============================================================ */
body.hb{padding:0 !important;min-height:100vh}
.hb-wrap{max-width:1680px;margin:0 auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:14px}
.hb-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.hb-title{font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--txt-main)}
.hb-asof{font-size:12px;color:var(--txt-muted)}
.hb-sp{flex:1}
.hb-seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.hb-seg button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:transparent;color:var(--txt-2);
  padding:6px 13px;border-radius:999px;cursor:pointer;transition:background .18s var(--ease),color .18s var(--ease)}
.hb-seg button:hover{color:var(--txt-main)}
.hb-seg button.on{background:var(--accent);color:#fff}
.hb-seg button:focus-visible,.hb-btn:focus-visible,.hb-kpi:focus-visible,.hb-sig:focus-visible,.hb-bub:focus-visible,.hb-cell:focus-visible,.hb-q:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hb-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.hb-kpi{position:relative;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;overflow:hidden;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease)}
.hb-kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--line-2)}
.hb-kpi .l{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt-muted);font-weight:600}
.hb-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--txt-faint)}
.hb-dot.ok{background:var(--ok)}.hb-dot.warn{background:var(--warn)}.hb-dot.bad{background:var(--bad)}
.hb-kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.hb-kpi .v{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1;font-variant-numeric:tabular-nums;color:var(--txt-main)}
.hb-kpi .v small{font-size:13px;font-weight:600;color:var(--txt-muted);margin-left:3px;letter-spacing:0}
.hb-kpi .d{font-size:12px;color:var(--txt-muted);min-height:16px}
.hb-kpi .d.up-bad,.hb-kpi .d.dn-bad{color:var(--bad)} .hb-kpi .d.up-ok,.hb-kpi .d.dn-ok{color:var(--ok)}
.hb-spark{width:92px;height:30px;flex:none}

.hb-grid{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,3fr) minmax(280px,1.15fr);gap:12px;align-items:stretch}
.hb-grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,2fr);gap:12px}
@media (max-width:1200px){ .hb-grid{grid-template-columns:1fr 1fr} .hb-grid .hb-mapcard{grid-column:1 / -1;order:-1} .hb-grid2{grid-template-columns:1fr} }
@media (max-width:720px){ .hb-grid{grid-template-columns:1fr} .hb-wrap{padding:12px} }
.hb-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hb-card h2{font-size:14px;font-weight:700;color:var(--txt-main);margin:0;display:flex;align-items:center;gap:8px}
.hb-card h2 .s{font-size:12px;font-weight:500;color:var(--txt-muted)}
.hb-card h2 .r{margin-left:auto}
.hb-info{font:inherit;font-size:11px;font-weight:700;width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);
  background:transparent;color:var(--txt-muted);cursor:pointer;line-height:1;padding:0}
.hb-info:hover{color:var(--accent);border-color:var(--accent)}

/* 사이트 신호등 */
.hb-sigs{display:flex;flex-direction:column;gap:2px;overflow:auto;max-height:520px;margin:0 -6px;padding:0 6px}
.hb-sig{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;
  border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;transition:background .15s var(--ease),border-color .15s var(--ease)}
.hb-sig:hover{background:var(--surface-2)}
.hb-sig.on{background:var(--accent-soft);border-color:var(--accent)}
.hb-sig .n{flex:1;min-width:0}
.hb-sig .n b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-sig .n span{display:block;font-size:11.5px;color:var(--txt-muted)}
.hb-sig .c{display:flex;gap:9px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.hb-sig .c .bm{color:var(--txt-main)} .hb-sig .c .rk{color:var(--bad)} .hb-sig .c .rk.z{color:var(--txt-muted);font-weight:500}
.hb-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.hb-pill.ok{background:var(--ok-soft);color:var(--ok)} .hb-pill.warn{background:var(--warn-soft);color:var(--warn)} .hb-pill.bad{background:var(--bad-soft);color:var(--bad)}

/* 세계지도 */
.hb-map{position:relative;width:100%;aspect-ratio:240/93;min-height:220px}
.hb-map canvas{position:absolute;inset:0;width:100%;height:100%}
.hb-bub{position:absolute;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;padding:0;
  border:2px solid var(--surface);box-shadow:0 0 0 0 transparent;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s var(--ease)}
.hb-bub:hover{transform:translate(-50%,-50%) scale(1.15)}
.hb-bub.on{border-color:var(--txt-main);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent)}
.hb-bub.ok{background:color-mix(in srgb,var(--ok) 82%,transparent)} .hb-bub.warn{background:color-mix(in srgb,var(--warn) 85%,transparent)} .hb-bub.bad{background:color-mix(in srgb,var(--bad) 88%,transparent)}
.hb-bub .lb{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;font-size:10.5px;font-weight:700;
  color:var(--txt-2);white-space:nowrap;pointer-events:none;text-shadow:0 0 3px var(--surface),0 0 3px var(--surface)}
@keyframes hbPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hb-bub.bad:not(.on){animation:hbPulse 1.8s infinite}
.hb-pop{position:absolute;z-index:3;min-width:170px;max-width:240px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;
  padding:10px 12px;box-shadow:var(--shadow-md);pointer-events:none;font-size:12px;color:var(--txt-2)}
.hb-pop b{display:block;font-size:13.5px;color:var(--txt-main)}
.hb-pop .big{font-size:18px;font-weight:700;color:var(--txt-main);font-variant-numeric:tabular-nums}
.hb-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--txt-muted);align-items:center}
.hb-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.hb-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hb-stat{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:11.5px;color:var(--txt-muted)}
.hb-stat b{display:block;font-size:17px;color:var(--txt-main);font-variant-numeric:tabular-nums}

/* 선택한 운영단위 */
.hb-sel h3{margin:0;font-size:18px;font-weight:700;color:var(--txt-main);line-height:1.25;word-break:keep-all}
.hb-sel .sub{font-size:12px;color:var(--txt-muted)}
.hb-gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hb-g{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--txt-muted);text-align:center}
.hb-g .w{position:relative;width:72px;height:72px}
.hb-g .w b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--txt-main);font-variant-numeric:tabular-nums}
.hb-bars{display:flex;align-items:flex-end;gap:3px;height:64px}
.hb-bars i{flex:1;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--accent) 45%,transparent);transform-origin:bottom;
  animation:hbGrow .5s cubic-bezier(.2,.8,.2,1) both}
.hb-bars i.cur{background:var(--accent)}
@keyframes hbGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hb-mini{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.hb-mini div{display:flex;justify-content:space-between;gap:8px}
.hb-mini span{color:var(--txt-muted)}
.hb-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.hb-btn{font:inherit;font-size:13px;font-weight:600;min-height:40px;padding:0 14px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--txt-main);display:inline-flex;align-items:center;gap:6px;
  transition:background .15s var(--ease),border-color .15s var(--ease)}
.hb-btn:hover{background:var(--surface-2);border-color:var(--line-2)}
.hb-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.hb-btn.pri:hover{filter:brightness(1.06)}

/* 처리할 일 */
.hb-qs{display:flex;flex-direction:column;gap:6px}
.hb-q{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface-2);
  border:1px solid transparent;border-radius:10px;padding:9px 11px;cursor:pointer;transition:border-color .15s var(--ease),transform .15s var(--ease)}
.hb-q:hover{border-color:var(--line-2);transform:translateX(2px)}
.hb-q .t{flex:1;min-width:0}
.hb-qr{display:flex;align-items:stretch;gap:6px}
.hb-qr .hb-q{flex:1;min-width:0}
.hb-take{font:inherit;font-size:11.5px;font-weight:600;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:10px;padding:0 11px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.hb-take:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.hb-take.has{color:var(--txt-2)}
.hb-take.has b{color:var(--accent);font-weight:700}
.hb-take:disabled{opacity:.5;cursor:wait}
.hb-q .t b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-q .t span{display:block;font-size:11.5px;color:var(--txt-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-sev{font-size:11px;font-weight:700;min-width:40px;text-align:center;padding:3px 6px;border-radius:6px;color:#fff;flex:none}
.hb-sev.bad{background:var(--bad)} .hb-sev.warn{background:var(--warn)} .hb-sev.info{background:var(--accent)}

/* 히트맵 */
.hb-heat{display:grid;gap:3px;font-size:11.5px;overflow-x:auto}
.hb-heat .h{color:var(--txt-muted);text-align:center;font-size:11px}
.hb-heat .rl{color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px;display:flex;align-items:center}
.hb-cell{font:inherit;font-size:11px;font-variant-numeric:tabular-nums;height:28px;border:0;border-radius:5px;cursor:pointer;color:var(--txt-main);
  background:var(--surface-2);opacity:0;animation:hbIn .35s var(--ease) forwards}
.hb-cell:hover{outline:2px solid var(--line-2)}
@keyframes hbIn{to{opacity:1}}
.hb-empty{font-size:12.5px;color:var(--txt-muted);padding:10px 0}
.hb-status{font-size:12px;color:var(--txt-muted);text-align:right}
.hb-status.err{color:var(--bad)}
.hb-note{font-size:11.5px;color:var(--txt-muted)}
.hb-sk{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;
  animation:hbSk 1.2s ease-in-out infinite;border-radius:8px;color:transparent !important}
@keyframes hbSk{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} .hb-cell{opacity:1} }
@media print{ .hb-seg,.hb-btns,.hb-info{display:none} }
</style>
</head>
<body class="hb">
<div id="loginOverlay" style="position:fixed;inset:0;z-index:99999;background:#F5F6F8;display:flex;align-items:center;justify-content:center"></div>
<div class="hb-wrap">
  <div class="hb-head">
    <div>
      <div class="hb-title" data-i="title">통합 관제</div>
      <div class="hb-asof" id="asof">—</div>
    </div>
    <span class="hb-sp"></span>
    <div class="hb-seg" role="group" aria-label="구분" id="segRegion">
      <button type="button" data-r="all" class="on" data-i="all">전체</button>
      <button type="button" data-r="kr" data-i="kr">국내</button>
      <button type="button" data-r="os" data-i="os">해외</button>
    </div>
  </div>

  <section class="hb-kpis" id="kpis" aria-label="핵심 지표"></section>

  <section class="hb-grid">
    <div class="hb-card">
      <h2><span data-i="sigT">운영단위 신호등</span><button type="button" class="hb-info r" id="ruleBtn" aria-label="판정 기준" title="판정 기준">i</button></h2>
      <div class="hb-legend"><span><i style="background:var(--bad)"></i><span data-i="bad">위험</span></span><span><i style="background:var(--warn)"></i><span data-i="warn">주의</span></span><span><i style="background:var(--ok)"></i><span data-i="ok">정상</span></span><span class="hb-sp"></span><span data-i="sigCols">이번 주 고장 · 위험 설비</span></div>
      <div class="hb-sigs" id="sigs"></div>
    </div>

    <div class="hb-card hb-mapcard">
      <h2><span data-i="mapT">글로벌 설치 현황</span><span class="s" data-i="mapS">원 크기 = 반입 설비 · 색 = 신호</span></h2>
      <div class="hb-map" id="map"><canvas id="mapC" aria-hidden="true"></canvas><div id="bubs"></div><div class="hb-pop" id="pop" hidden></div></div>
      <div class="hb-stats" id="stats"></div>
      <div class="hb-note" id="mapNote"></div>
    </div>

    <div class="hb-card hb-sel" id="sel"></div>
  </section>

  <section class="hb-grid2">
    <div class="hb-card">
      <h2><span data-i="qT">처리할 일</span><span class="s" id="qS"></span></h2>
      <div class="hb-qs" id="queue"></div>
    </div>
    <div class="hb-card">
      <h2><span data-i="heatT">주차별 고장 히트맵</span><span class="s" data-i="heatS">진할수록 평소보다 많음 · 칸을 누르면 그 주의 고장 목록</span>
        <span class="r hb-seg" role="group" aria-label="행 기준" id="segHeat"><button type="button" data-h="op" class="on" data-i="byOp">운영단위</button><button type="button" data-h="campus" data-i="byCampus">단지</button></span></h2>
      <div class="hb-heat" id="heat"></div>
    </div>
  </section>
  <div class="hb-status" id="status"></div>
</div>

<script>
if(!window.GST){document.body.insertAdjacentHTML('afterbegin','<div style="background:#7f1d1d;color:#fff;padding:10px 16px;font:13px sans-serif">⚠️ assets/core.js 로드 실패</div>');throw new Error('GST core missing');}
GST.needVer && GST.needVer(164);
GST.authGate();

/* ── 세계 육지 점지도 ──
   Natural Earth(공개 자료) land 110m 를 1.5° 격자로 미리 래스터화해 행마다 «바다·육지 번갈아 길이»로 담았다

const esc=s=>GST._esc(s);
const nf=n=>Number(n||0).toLocaleString('en-US');
const DAY=864e5;
const KR=GST.ORG.REGION_KR, OS=GST.ORG.REGION_OS;
const REDUCE=(function(){ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } })();

/* 판정 기준 — 화면 «i» 와 같은 글을 쓴다. 숫자를 바꾸면 rule 문구도 같이 바꾼다. */
const RULE={badX:1.5, badD:5, warnX:1.2, warnD:3, repBad:3, repWarn:1};

let RAW=null;                          // 읽어 온 그대로(파싱 뒤)
const S={region:'all', heat:'op', sel:null};

/* ===== 읽기 — 파싱·조인·판정은 core GST.ops 한 벌(v167 · 사이트 상세와 같은 식) ===== */
const cityOf=GST.ops.cityOf;
async function load(){
  status(t('loading'));
  skel(true);
  const L=await GST.ops.load(); const INST=L.INST, WK=L.WK, KRA=L.KRA, fails=L.fails;
  RAW={INST, WK, KRA, fails};
  loadAct();
  skel(false);
  render();
  const tm=new Date();
  status((fails.length?t('fail')+' ('+fails.join(', ')+') · ':'')+'✅ '+tm.toLocaleString(), !!fails.length);
}

/* ===== 처리함(v166) — 이 신호가 이미 담겼나 =====
   ⚠ 자동으로 담지 않는다 — 사람이 「담기」를 눌러야 들어간다(setup-24 머리 주석). 읽기만 실패해도 관제 화면은 그대로 선다. */
const ACT={};   // ref → {id,status,assignee}
async function loadAct(){
  try{
    const C=await GST.db(); if(!C) return;
    const r=await C.from('action_items').select('id,ref,status,assignee').not('status','in','(done,dismissed)').not('ref','is',null).limit(2000);
    if(r.error) return;
    Object.keys(ACT).forEach(k=>delete ACT[k]); (r.data||[]).forEach(x=>{ ACT[x.ref]=x; });
    if(D) drawQueue();
  }catch(e){ console.warn('[hub] 처리함 읽기 실패', e); }
}
async function takeAct(q, btn){
  btn.disabled=true;
  try{
    const C=await GST.db(); if(!C) throw new Error('no client');
    const r=await C.rpc('action_add',{p_kind:q.kind,p_ref:q.ref,p_sev:q.sev,p_title:q.title,p_detail:q.sub||null,p_op:q.op||null,p_page:q.page||null,p_assignee:null,p_due:null});
    if(r.error) throw r.error;
    ACT[q.ref]={id:r.data&&r.data.id,status:'open',assignee:null};
    drawQueue();
  }catch(e){ console.warn('[hub] 담기 실패', e); btn.disabled=false; btn.textContent='⚠ '+t('q_take'); }
}

/* ===== 계산 — 판정은 core 정본만 부른다 ===== */
function weeksOf(asOf){
  const sun=new Date(Date.UTC(asOf.getUTCFullYear(),asOf.getUTCMonth(),asOf.getUTCDate())); sun.setUTCDate(sun.getUTCDate()-sun.getUTCDay());
  const out=[]; for(let i=11;i>=0;i--){ const st=new Date(sun.getTime()-i*7*DAY), en=new Date(st.getTime()+7*DAY);
    const k=GST.isoW(st); out.push({key:k, st, en, label:'W'+k.slice(-2)}); }
  return out;
}
const median=a=>{ if(!a.length) return 0; const s=a.slice().sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
function compute(){
  const R=RAW, rg=S.region, okR=reg=>rg==='all'||(rg==='kr'?reg===KR:reg===OS);
  /* 기준일 = 자료의 마지막 날(오늘을 넘지 않는다) — 수동 업로드라 «오늘»로 자르면 이번 주가 빈다 */
  const asOf=GST.ops.asOf(R);
  const W=weeksOf(asOf), wIx=d=>{ const v=d.getTime(); for(let i=0;i<W.length;i++) if(v>=W[i].st.getTime()&&v<W[i].en.getTime()) return i; return -1; };

  /* 고장(BM) — 주간현황과 같은 규칙(v92·v115): 해외 = 수선실적 BM · 국내 = 원장(내적·한 사건 첫 줄). 원장이 비면 국내도 수선실적 BM. */
  const KR_ON=R.KRA.length>0;
  const bm=GST.ops.bm(R, x=>okR(x.region));
  const pm=GST.ops.pm(R, x=>okR(x.region));
  const t0=asOf.getTime();
  /* 고장 위험 — 고장분석 「고장 위험 설비 TOP 20」과 같은 식(GST.ops.risk · v148) */
  const RISK=GST.ops.risk(R, asOf, x=>okR(x.region));

  /* 설비 — GST.EQ 정본 */
  const inst=R.INST.filter(x=>okR(x.region));
  const isIn=x=>GST.EQ.isIn(x.state,x.d,asOf), isRun=x=>GST.EQ.isRun(x.state,x.d,asOf);

  /* 운영단위 묶음 */
  const G={};
  const grp=op=>G[op]||(G[op]={op, cty:'', city:'', region:'', inN:0, runN:0, warrIn:0, warrN:0, wk:new Array(12).fill(0), bm:[], risk:[], rep:0, pmN:0});
  inst.forEach(x=>{ if(!isIn(x)) return; const g=grp(x.op||'—'); g.inN++; if(isRun(x)) g.runN++;
    if(x.warr){ g.warrN++; if(x.warr==='IN') g.warrIn++; } if(!g.cty&&x.cty){ g.cty=x.cty; g.city=x.cityKey; } if(!g.region) g.region=x.region; });
  bm.forEach(x=>{ const i=wIx(x.d); const g=grp(x.op||'—'); if(!g.region) g.region=x.region; if(!g.cty){ const c=GST.ORG.country(x.op); if(c){ g.cty=c; g.city=cityOf(x.op,c); } }
    if(i>=0){ g.wk[i]++; g.bm.push(x); } });
  pm.forEach(x=>{ if(wIx(x.d)>=W.length-4){ const g=G[x.op]; if(g) g.pmN++; } });
  RISK.forEach(r=>{ const g=G[r.site]; if(!g) return; g.risk.push(r); if(r.rep) g.rep++; });
  const groups=Object.values(G).filter(g=>g.inN||g.bm.length);
  groups.forEach(g=>{
    const cur=g.wk[11], base=median(g.wk.slice(3,11));
    g.cur=cur; g.base=base;
    g.st=((cur>=base*RULE.badX&&cur-base>=RULE.badD)||g.rep>=RULE.repBad)?'bad'
        :((cur>base*RULE.warnX&&cur-base>=RULE.warnD)||g.rep>=RULE.repWarn)?'warn':'ok';
  });
  const rank={bad:0,warn:1,ok:2};
  groups.sort((a,b)=>rank[a.st]-rank[b.st]||b.cur-a.cur||b.inN-a.inN);

  /* 전체 집계 */
  const bmW=W.map((w,i)=>bm.filter(x=>wIx(x.d)===i).length);
  const pmW=W.map((w,i)=>pm.filter(x=>wIx(x.d)===i).length);
  const inN=inst.filter(isIn).length, runN=inst.filter(isRun).length;
  const warrIn=inst.filter(x=>isIn(x)&&x.warr==='IN').length;
  const warrSoon=inst.filter(x=>isIn(x)&&x.wd&&x.wd.getTime()>t0&&x.wd.getTime()<=t0+90*DAY);
  const repN=RISK.filter(r=>r.rep>0).length;
  return {asOf, W, wIx, KR_ON, bm, pm, RISK, inst, groups, bmW, pmW, inN, runN, warrIn, warrSoon, repN};
}

/* ===== 그리기 ===== */
let D=null;
function render(){
  if(!RAW) return;
  D=compute();
  if(!S.sel||!D.groups.find(g=>g.op===S.sel)) S.sel=D.groups.length?D.groups[0].op:null;
  const wkLbl=D.W[11].label+' ('+GST.fmtD(D.W[11].st).slice(5)+'~)';
  document.getElementById('asof').textContent=fmt(t('asof'),{d:GST.fmtD(D.asOf), w:wkLbl})+(D.KR_ON||S.region==='os'?'':' · ⚠ '+t('krFall'));
  drawKpis(); drawSignals(); drawMap(); drawSel(); drawQueue(); drawHeat();
  try{ window.parent!==window && window.parent.postMessage({type:'gst-state',state:''},'*'); }catch(e){}
}
function spark(a, col){
  const mx=Math.max(1,...a), mn=Math.min(...a);
  const pts=a.map((v,i)=>(i*92/(a.length-1)).toFixed(1)+','+(27-(v-mn)/((mx-mn)||1)*24).toFixed(1)).join(' ');
  return '<svg class="hb-spark" viewBox="0 0 92 30" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function delta(cur, prev, upBad){
  const d=cur-prev; if(!prev&&!cur) return '';
  /* 작은 기준의 % 는 과장이다(v148 · GST.DELTA_ABS_MAX) — 직전이 작으면 건수 차이로 적는다 */
  const s=(prev<(GST.DELTA_ABS_MAX||10)||!prev)?((d>=0?'+':'')+d):((d>=0?'+':'')+Math.round(d/prev*100)+'%');
  const cls=d===0?'':(d>0?(upBad?'up-bad':'up-ok'):(upBad?'dn-ok':'dn-bad'));
  return '<span class="'+cls+'">'+(d>0?'▲ ':d<0?'▼ ':'')+esc(fmt(t('vsPrev'),{s}))+'</span>';
}
function dqItems(){
  const out=[];
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!/^gst_dq_/.test(k)||k==='gst_dq_report_kr') continue;
    const o=JSON.parse(localStorage.getItem(k)||'null'); if(!o||!o.items) continue;
    o.items.forEach(d=>{ if(d.sev==='warn'||d.sev==='bad') out.push(Object.assign({page:k.slice(7), at:o.at}, d)); }); } }catch(e){}
  return out.sort((a,b)=>(a.sev==='bad'?0:1)-(b.sev==='bad'?0:1));
}
function drawKpis(){
  const cssv=n=>getComputedStyle(document.body).getPropertyValue(n).trim()||'#2F6FED';
  const c={ok:cssv('--ok'),warn:cssv('--warn'),bad:cssv('--bad'),acc:cssv('--accent')};
  const runP=D.inN?Math.round(D.runN/D.inN*100):0;
  const cur=D.bmW[11], prev=D.bmW[10], base=median(D.bmW.slice(3,11));
  const bmSt=(cur>=base*RULE.badX&&cur-base>=RULE.badD)?'bad':(cur>base*RULE.warnX&&cur-base>=RULE.warnD)?'warn':'ok';
  const dq=dqItems();
  const K=[
    {id:'run', l:t('k_run'), v:D.runN, u:t('u_ea'), st:'ok', d:esc(fmt(t('k_run_d'),{n:nf(D.inN),p:runP})), sp:null},
    {id:'bm',  l:t('k_bm'),  v:cur, u:t('u_case'), st:bmSt, d:delta(cur,prev,true)+' · '+esc(fmt(t('vsBase'),{b:Math.round(base)})), sp:spark(D.bmW, c[bmSt==='ok'?'acc':bmSt])},
    {id:'pm',  l:t('k_pm'),  v:D.pmW[11], u:t('u_case'), st:'ok', d:delta(D.pmW[11],D.pmW[10],false), sp:spark(D.pmW, c.acc)},
    {id:'risk',l:t('k_risk'),v:D.RISK.length, u:t('u_ea'), st:D.repN>=RULE.repBad?'bad':D.repN?'warn':'ok', d:esc(fmt(t('k_risk_d'),{n:D.repN})), sp:null},
    {id:'warr',l:t('k_warr'),v:D.warrSoon.length, u:t('u_ea'), st:D.warrSoon.length?'warn':'ok', d:esc(fmt(t('k_warr_d'),{n:nf(D.warrIn)})), sp:null},
    {id:'dq',  l:t('k_dq'),  v:dq.length, u:'', st:dq.some(x=>x.sev==='bad')?'bad':dq.length?'warn':'ok', d:esc(dq.length?t('k_dq_d'):t('k_dq_none')), sp:null}
  ];
  const box=document.getElementById('kpis');
  box.innerHTML=K.map(k=>'<button type="button" class="hb-kpi" data-k="'+k.id+'"><span class="l"><span class="hb-dot '+k.st+'"></span>'+esc(k.l)+'</span>'
    +'<span class="row"><span class="v"><span class="num" data-to="'+k.v+'">'+nf(REDUCE?k.v:0)+'</span><small>'+esc(k.u)+'</small></span>'+(k.sp||'')+'</span>'
    +'<span class="d">'+k.d+'</span></button>').join('');
  countUp(box);
  box.querySelectorAll('.hb-kpi').forEach(b=>b.onclick=()=>kpiOpen(b.dataset.k));
}
function countUp(root){
  if(REDUCE) return;
  root.querySelectorAll('.num[data-to]').forEach(el=>{ const to=+el.dataset.to||0, t0=performance.now(), dur=700;
    const step=n=>{ const p=Math.min(1,(n-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=nf(Math.round(to*e)); if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step); });
}
function bmRows(list){
  return list.slice().sort((a,b)=>b.d-a.d).map(x=>[GST.fmtD(x.d), x.op||'', x.campus||'', x.code||'', x.sn||'', x.src==='kr'?t('src_kr'):t('src_wk'), x.desc||'']);
}
const BM_COLS=()=>[t('l_date'),t('l_op'),t('l_campus'),t('l_eq'),t('l_sn'),t('l_src'),t('l_desc')];
function kpiOpen(k){
  const w=D.W[11];
  if(k==='bm') return GST.rowsModal(t('k_bm')+' · '+w.label, BM_COLS(), bmRows(D.bm.filter(x=>D.wIx(x.d)===11)));
  if(k==='pm') return GST.rowsModal(t('k_pm')+' · '+w.label, [t('l_date'),t('l_op'),t('l_campus'),t('l_eq'),t('l_sn')],
    D.pm.filter(x=>D.wIx(x.d)===11).sort((a,b)=>b.d-a.d).map(x=>[GST.fmtD(x.d),x.op,x.campus,x.code,x.sn]));
  if(k==='risk') return GST.rowsModal(t('k_risk'), [t('l_eq'),t('l_op'),t('l_score'),t('l_why')], D.RISK.map(r=>[r.label,r.site,String(r.score),GST.riskWhy(r)]));
  if(k==='warr') return GST.rowsModal(t('k_warr'), [t('l_wd'),t('l_op'),t('l_campus'),t('l_eq'),t('l_sn'),t('l_state')],
    D.warrSoon.slice().sort((a,b)=>a.wd-b.wd).map(x=>[GST.fmtD(x.wd),x.op,x.campus,x.code,x.sn,x.stateRaw]));
  if(k==='dq') return GST.rowsModal(t('k_dq'), [t('q_dq'),t('l_desc'),'N'], dqItems().map(d=>[d.page, d.label, d.n==null?'':String(d.n)]));
  if(k==='run') return GST.goTab ? GST.goTab('scrubber') : null;
}
function drawSignals(){
  const box=document.getElementById('sigs');
  if(!D.groups.length){ box.innerHTML='<div class="hb-empty">'+esc(t('none'))+'</div>'; return; }
  box.innerHTML=D.groups.map(g=>'<button type="button" class="hb-sig'+(g.op===S.sel?' on':'')+'" data-op="'+esc(g.op)+'">'
    +'<span class="hb-dot '+g.st+'"></span><span class="n"><b>'+esc(short(g.op))+'</b><span>'+esc([ctyName(g.cty), nf(g.inN)+t('u_ea')].filter(Boolean).join(' · '))+'</span></span>'
    +'<span class="c"><span class="bm">'+g.cur+'</span><span class="rk'+(g.rep?'':' z')+'">'+g.rep+'</span></span></button>').join('');
  box.querySelectorAll('.hb-sig').forEach(b=>b.onclick=()=>pick(b.dataset.op));
}
/* 법인 이름 꼬리의 담당구분(SCRUBBER)만 뗀다 — 이름을 지어내지 않는다(v98 · corpLabel 과 같은 규칙) */
function short(op){ return String(op||'—').replace(/\s+(SCRUBBER|CHILLER)$/i,'').trim()||'—'; }
const CTY={ko:{KOREA:'한국',TAIWAN:'대만',CHINA:'중국',USA:'미국',JAPAN:'일본',SINGAPORE:'싱가포르',EUROPE:'유럽'},
  en:{KOREA:'Korea',TAIWAN:'Taiwan',CHINA:'China',USA:'USA',JAPAN:'Japan',SINGAPORE:'Singapore',EUROPE:'Europe'},
  zh:{KOREA:'韩国',TAIWAN:'台湾',CHINA:'中国',USA:'美国',JAPAN:'日本',SINGAPORE:'新加坡',EUROPE:'欧洲'},
  ja:{KOREA:'韓国',TAIWAN:'台湾',CHINA:'中国',USA:'米国',JAPAN:'日本',SINGAPORE:'シンガポール',EUROPE:'欧州'}};
function ctyName(c){ return (CTY[LANG]||CTY.ko)[c]||c||''; }
function pick(op){ S.sel=op; drawSignals(); drawMap(); drawSel(); }

/* 지도 — 캔버스에 점을 찍고, 원은 버튼(키보드로도 고른다) */
function drawMap(){
  const host=document.getElementById('map'), cv=document.getElementById('mapC');
  const r=host.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  const rows=WORLD.rle.length, cw=r.width/WORLD.w, ch=r.height/rows, rad=Math.max(0.8,Math.min(cw,ch)*0.33);
  ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--line-2').trim()||'#CDD3DC';
  WORLD.rle.forEach((s,y)=>{ let x=0, land=false; s.split(',').forEach(n=>{ n=+n; if(land){ for(let i=0;i<n;i++){ ctx.beginPath(); ctx.arc((x+i+.5)*cw,(y+.5)*ch,rad,0,6.283); ctx.fill(); } } x+=n; land=!land; }); });
  // 원
  const pos=(lat,lon)=>[ (lon-WORLD.lon0)/360*100, (WORLD.lat0-lat)/(rows*WORLD.step)*100 ];
  const byLoc={}, noLoc=[];
  D.groups.forEach(g=>{ const k=GEO[g.city]?g.city:(GEO[g.cty]?g.cty:''); if(!k){ if(g.inN) noLoc.push(g); return; } (byLoc[k]=byLoc[k]||[]).push(g); });
  const mx=Math.max(1,...D.groups.map(g=>g.inN));
  /* 이름표는 겹치면 안 쓴다 — 동아시아에 법인이 몰려 글자가 포개졌다. 큰 원·고른 원부터 자리를 잡고, 이미 잡힌 이름표와 가까우면 빼고
     (원은 그대로 · 누르거나 올리면 팝업이 이름을 말한다). */
  const B=[];
  Object.keys(byLoc).forEach(k=>{ const L=byLoc[k], n=L.length;
    L.forEach((g,i)=>{ let [lat,lon]=GEO[k];
      if(n>1){ const a=i/n*2*Math.PI-Math.PI/2, rr=3.2; lat+=Math.sin(a)*rr*0.8; lon+=Math.cos(a)*rr; }   // 같은 국가의 여러 법인은 둥글게 벌려 놓는다
      const [x,y]=pos(lat,lon); B.push({g, x, y, sz:Math.round(14+Math.sqrt(g.inN/mx)*34)}); }); });
  const taken=[];
  B.slice().sort((a,b)=>(b.g.op===S.sel)-(a.g.op===S.sel)||b.sz-a.sz).forEach(b=>{
    const px=b.x/100*r.width, py=b.y/100*r.height+b.sz/2+8, w=Math.max(40,short(b.g.op).length*6.4);
    b.lb=!taken.some(t=>Math.abs(t.x-px)<(t.w+w)/2+4 && Math.abs(t.y-py)<15);
    if(b.lb) taken.push({x:px,y:py,w}); });
  let html='';
  B.forEach(b=>{ const g=b.g;
    html+='<button type="button" class="hb-bub '+g.st+(g.op===S.sel?' on':'')+'" data-op="'+esc(g.op)+'" style="left:'+b.x.toFixed(2)+'%;top:'+b.y.toFixed(2)+'%;width:'+b.sz+'px;height:'+b.sz+'px" aria-label="'+esc(short(g.op)+' · '+t(g.st))+'">'
      +(b.lb?'<span class="lb">'+esc(short(g.op))+'</span>':'')+'</button>'; });
  const bubs=document.getElementById('bubs'); bubs.innerHTML=html;
  bubs.querySelectorAll('.hb-bub').forEach(b=>{ b.onclick=()=>pick(b.dataset.op); b.onmouseenter=b.onfocus=()=>popShow(b); b.onmouseleave=b.onblur=()=>{ document.getElementById('pop').hidden=true; }; });
  const tot=D.groups.reduce((s,g)=>s+g.inN,0), ctys=new Set(D.groups.map(g=>g.cty).filter(Boolean)), bm12=D.bmW.reduce((s,v)=>s+v,0);
  document.getElementById('stats').innerHTML=[[t('st_units'),nf(tot)],[t('st_ops'),D.groups.length],[t('st_cty'),ctys.size],[t('st_bm12'),nf(bm12)]]
    .map(a=>'<div class="hb-stat">'+esc(a[0])+'<b>'+esc(a[1])+'</b></div>').join('');
  document.getElementById('mapNote').textContent=noLoc.length?fmt(t('noLoc'),{n:noLoc.length,list:noLoc.slice(0,4).map(g=>short(g.op)).join(', ')+(noLoc.length>4?' …':'')}):'';
}
function popShow(b){
  const g=D.groups.find(x=>x.op===b.dataset.op); if(!g) return;
  const p=document.getElementById('pop'), host=document.getElementById('map').getBoundingClientRect(), br=b.getBoundingClientRect();
  p.innerHTML='<span>'+esc(ctyName(g.cty))+'</span><b>'+esc(short(g.op))+'</b><span class="big">'+nf(g.inN)+'</span> '+esc(t('u_ea'))
    +'<br>'+esc(t('k_bm'))+' '+g.cur+' · <span class="hb-pill '+g.st+'">'+esc(t(g.st))+'</span>';
  p.hidden=false;
  const cx=br.left-host.left+br.width/2, cy=br.top-host.top;
  const left=cx>host.width*0.62; p.style.left=left?'':(cx+br.width/2+8)+'px'; p.style.right=left?(host.width-cx+br.width/2+8)+'px':''; p.style.top=Math.max(4,cy-10)+'px';
}
function gauge(v, label){
  const st=v>=90?'var(--ok)':v>=70?'var(--warn)':'var(--bad)', c=2*Math.PI*29;
  return '<div class="hb-g"><div class="w"><svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="29" fill="none" stroke="var(--surface-3)" stroke-width="7"/>'
    +'<circle cx="36" cy="36" r="29" fill="none" stroke="'+st+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(c*v/100).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 36 36)"/></svg><b>'+(v==null?'—':v+'%')+'</b></div>'+esc(label)+'</div>';
}
function drawSel(){
  const box=document.getElementById('sel'), g=D.groups.find(x=>x.op===S.sel);
  if(!g){ box.innerHTML='<div class="hb-empty">'+esc(t('none'))+'</div>'; return; }
  const runP=g.inN?Math.round(g.runN/g.inN*100):null, warrP=g.warrN?Math.round(g.warrIn/g.warrN*100):null;
  const pmP=(g.pmN+g.wk.slice(8).reduce((s,v)=>s+v,0))?Math.round(g.pmN/(g.pmN+g.wk.slice(8).reduce((s,v)=>s+v,0))*100):null;
  const mx=Math.max(1,...g.wk);
  const lastBm=g.bm.length?g.bm.reduce((m,x)=>x.d>m?x.d:m,g.bm[0].d):null;
  box.innerHTML='<div class="sub">'+esc(t('sel_h'))+' · '+esc([ctyName(g.cty),g.region].filter(Boolean).join(' · '))+'</div>'
    +'<h3>'+esc(short(g.op))+' <span class="hb-pill '+g.st+'">'+esc(t(g.st))+'</span></h3>'
    +'<div class="hb-gauges">'+gauge(runP,t('g_run'))+gauge(warrP,t('g_warr'))+gauge(pmP,t('g_pm'))+'</div>'
    +'<div><div class="sub" style="margin-bottom:6px">'+esc(t('bars'))+'</div><div class="hb-bars">'
    +g.wk.map((v,i)=>'<i class="'+(i===11?'cur':'')+'" style="height:'+Math.round(v/mx*60+3)+'px;animation-delay:'+(i*25)+'ms" title="'+esc(D.W[i].label+' · '+v)+'"></i>').join('')+'</div></div>'
    +'<div class="hb-mini">'
    +'<div><span>'+esc(t('m_units'))+'</span><b>'+nf(g.inN)+' / '+nf(g.runN)+'</b></div>'
    +'<div><span>'+esc(t('m_risk'))+'</span><b>'+g.risk.length+'</b></div>'
    +'<div><span>'+esc(t('m_rep'))+'</span><b>'+g.rep+'</b></div>'
    +'<div><span>'+esc(t('m_last'))+'</span><b>'+(lastBm?GST.fmtD(lastBm):'—')+'</b></div>'
    +'</div>'
    +(g.risk.length?'<div class="hb-mini"><div class="sub">'+esc(t('risk_top'))+'</div>'+g.risk.slice(0,3).map(r=>'<div><span>'+esc(r.label)+'</span><b title="'+esc(GST.riskWhy(r))+'">'+r.score+'</b></div>').join('')+'</div>':'')
    +'<div class="hb-btns"><button type="button" class="hb-btn pri" id="goSite">'+esc(t('open_site'))+' →</button><button type="button" class="hb-btn" id="goFault">'+esc(t('open_fault'))+'</button><button type="button" class="hb-btn" id="goInst">'+esc(t('open_inst'))+'</button></div>';
  /* 사이트 상세로 «이 운영단위»를 넘긴다 — 같은 출처 iframe 끼리 sessionStorage 를 나눠 쓴다(사이트 화면이 gst-shown 에서 받는다) */
  document.getElementById('goSite').onclick=()=>{ try{ sessionStorage.setItem('gst_site_sel', g.op); }catch(e){} GST.goTab&&GST.goTab('site'); };
  document.getElementById('goFault').onclick=()=>GST.goTab&&GST.goTab('fault');
  document.getElementById('goInst').onclick=()=>GST.goTab&&GST.goTab('scrubber');
}
function drawQueue(){
  const box=document.getElementById('queue'), adm=GST.isAdmin&&GST.isAdmin();
  const items=[];
  D.RISK.slice(0,5).forEach(r=>items.push({sev:r.rep?'bad':'warn', tag:t('q_risk'), title:r.label+' · '+short(r.site), sub:GST.riskWhy(r), go:()=>GST.goTab&&GST.goTab('fault'),
    kind:'risk', ref:'risk:'+r.key, op:r.site, page:'fault'}));
  dqItems().slice(0,5).forEach(d=>items.push({sev:d.sev==='bad'?'bad':'warn', tag:t('q_dq'), title:d.label, sub:(d.page||'')+(d.n!=null?' · '+nf(d.n):''),
    go:adm?()=>window.open('https://gstcsglobal-cloud.github.io/edit/?tab=dq&fix='+encodeURIComponent(d.page+'.'+d.key),'gstEdit'):null,
    kind:'dq', ref:'dq:'+d.page+'.'+d.key, page:d.page}));
  document.getElementById('qS').textContent=t('q_s');
  if(!items.length){ box.innerHTML='<div class="hb-empty">'+esc(t('q_none'))+'</div>'; return; }
  const can=GST.actCan&&GST.actCan();
  box.innerHTML=items.map((q,i)=>{ const a=ACT[q.ref];
    const side=a?'<button type="button" class="hb-take has" data-open="'+i+'" title="'+esc(t('q_open'))+'">'+esc(t('q_taken'))+' · <b>'+esc(t('st_'+a.status)||a.status)+'</b></button>'
      :(can?'<button type="button" class="hb-take" data-take="'+i+'">+ '+esc(t('q_take'))+'</button>':'');
    return '<div class="hb-qr"><button type="button" class="hb-q" data-q="'+i+'"'+(q.go?'':' disabled')+'><span class="hb-sev '+q.sev+'">'+esc(q.tag)+'</span>'
      +'<span class="t"><b>'+esc(q.title)+'</b><span>'+esc(q.sub)+'</span></span></button>'+side+'</div>'; }).join('');
  box.querySelectorAll('.hb-q').forEach(b=>{ const q=items[+b.dataset.q]; if(q.go) b.onclick=q.go; });
  box.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>takeAct(items[+b.dataset.take], b));
  box.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>GST.goTab&&GST.goTab('action'));
}
function drawHeat(){
  const box=document.getElementById('heat'), W=D.W, by=S.heat;
  const M={};
  D.bm.forEach(x=>{ const i=D.wIx(x.d); if(i<0) return; const k=(by==='campus'?(x.campus||'—'):short(x.op))||'—'; (M[k]=M[k]||{k, wk:new Array(12).fill(0), list:[]}); M[k].wk[i]++; M[k].list.push(x); });
  const rows=Object.values(M).sort((a,b)=>b.wk.reduce((s,v)=>s+v,0)-a.wk.reduce((s,v)=>s+v,0)).slice(0,14);
  if(!rows.length){ box.innerHTML='<div class="hb-empty">'+esc(t('none'))+'</div>'; return; }
  box.style.gridTemplateColumns='minmax(90px,150px) repeat(12,minmax(30px,1fr))';
  let h='<div></div>'+W.map(w=>'<div class="h">'+esc(w.label)+'</div>').join('');
  rows.forEach((r,ri)=>{ const base=median(r.wk.filter(v=>v>0))||0;
    h+='<div class="rl" title="'+esc(r.k)+'">'+esc(r.k)+'</div>';
    r.wk.forEach((v,i)=>{ const z=base?(v-base)/base:(v?1:0);
      const hot=v>0&&z>0.3, a=v?Math.min(0.92,0.18+Math.min(1,Math.abs(z))*0.6+(hot?0.12:0)):0;
      const bg=v?(hot?'color-mix(in srgb,var(--bad) '+Math.round(a*100)+'%,transparent)':'color-mix(in srgb,var(--accent) '+Math.round(a*70)+'%,transparent)'):'var(--surface-2)';
      h+='<button type="button" class="hb-cell" data-r="'+ri+'" data-w="'+i+'" style="background:'+bg+';color:'+(a>0.55?'#fff':'var(--txt-main)')+';animation-delay:'+(ri*18+i*6)+'ms" aria-label="'+esc(r.k+' '+W[i].label+' '+v)+'">'+(v||'')+'</button>'; }); });
  box.innerHTML=h;
  box.querySelectorAll('.hb-cell').forEach(b=>b.onclick=()=>{ const r=rows[+b.dataset.r], i=+b.dataset.w;
    GST.rowsModal(r.k+' · '+W[i].label, BM_COLS(), bmRows(r.list.filter(x=>D.wIx(x.d)===i))); });
}

/* ===== 틀 ===== */
function status(s, err){ const e=document.getElementById('status'); e.textContent=s; e.classList.toggle('err',!!err); }
function skel(on){ document.querySelectorAll('.hb-card,#kpis').forEach(e=>e.classList.toggle('hb-sk',!!on)); }
function applyLang(){
  document.documentElement.lang=LANG;
  try{ GST.applyI18n && GST.applyI18n(t, LANG); }catch(e){ document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent=t(el.dataset.i); }); }
  render();
}
window.setLang=function(l){ if(T[l]){ LANG=l; applyLang(); } };
document.getElementById('segRegion').addEventListener('click',e=>{ const b=e.target.closest('button[data-r]'); if(!b) return;
  S.region=b.dataset.r; document.querySelectorAll('#segRegion button').forEach(x=>x.classList.toggle('on',x===b)); S.sel=null; render(); });
document.getElementById('segHeat').addEventListener('click',e=>{ const b=e.target.closest('button[data-h]'); if(!b) return;
  S.heat=b.dataset.h; document.querySelectorAll('#segHeat button').forEach(x=>x.classList.toggle('on',x===b)); drawHeat(); });
document.getElementById('ruleBtn').onclick=()=>GST.rowsModal(t('rule_t'), [t('l_desc')], t('rule').split('\n').filter(Boolean).map(s=>[s]));
let _rz=0; window.addEventListener('resize',()=>{ cancelAnimationFrame(_rz); _rz=requestAnimationFrame(()=>D&&drawMap()); });
/* 테마가 바뀌면 캔버스 점 색을 다시 칠한다 — 캔버스는 CSS 변수를 못 읽는다 */
try{ new MutationObserver(()=>D&&(drawMap(),drawKpis())).observe(document.body,{attributes:true,attributeFilter:['class']}); }catch(e){}
window.addEventListener('gst-role',()=>{ if(D) drawQueue(); });   // 등급이 늦게 오면 「담기」 단추를 그때 연다
window.addEventListener('message',e=>{ const d=e.data||{}; if(d.type==='gst-lang'&&T[d.lang]){ LANG=d.lang; applyLang(); } });
applyLang();
/* 자동 새로고침·셸 「새로고침」·백필 완료가 부르는 이름(GST._softReload 는 window.loadData 를 찾는다) */
window.loadData=load;
load().catch(e=>{ console.error('[hub] 읽기 실패', e); skel(false); status((GST.failNote?GST.failNote(e):String(e&&e.message||e)), true); });
GST.startAutoRefresh && GST.startAutoRefresh(30);
</script>
