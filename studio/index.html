<style>
/* ============================================================
   분석 작업대 (v168 · 사용자 요청 「통합관리화면」 4단계)
   정해진 차트 밖의 질문 — 「F16 의 모델별 월간 고장」 같은 것 — 을 사람이 직접 만든다. 표 · 가로축 · 계열 · 값 · 거르기를 고르면
   차트가 서고, 그 차트들을 «보드»로 묶어 저장한다(setup-25 · 설정만 담고 숫자는 담지 않는다 — 열 때마다 지금 자료로 다시 그린다).
   ⚠ 열은 «SPEC 이 아는 이름»으로만 고른다(GST.SM.SPEC · 제1원칙) — 열 번호를 저장하지 않는다. 시트에 열이 끼어도 보드가 안 깨진다.
   ⚠ 숫자를 «판정»하지 않는다 — 건수·합계·고유 수만 센다. BM·PM·가동 같은 판정이 필요한 지표는 정해진 화면(관제·사이트·고장분석)이 정본이다.
   ⚠ 클래스는 sd- 로 갈라 theme.css 와 섞이지 않게. 라이트 기본 · 다크 = body.theme-slate.
   ============================================================ */
body.sd{padding:0 !important;min-height:100vh}
.sd-wrap{max-width:1680px;margin:0 auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:14px}
.sd-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.sd-title{font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--txt-main)}
.sd-sub{font-size:12px;color:var(--txt-muted)}
.sd-sp{flex:1}
.sd-in,.sd-sel{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--txt-main);padding:7px 10px;border-radius:9px;min-width:0}
.sd-btn{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--txt-main);padding:7px 13px;border-radius:9px;cursor:pointer;transition:border-color .15s,transform .1s;white-space:nowrap}
.sd-btn:hover{border-color:var(--accent)} .sd-btn:active{transform:scale(.97)}
.sd-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.sd-btn.ghost{border-color:transparent;background:transparent;color:var(--txt-2)}
.sd-btn:disabled{opacity:.45;cursor:not-allowed}
.sd-main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.sd-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.sd-card h2{font-size:14px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:var(--txt-main)}
.sd-card h2 .s{font-size:11.5px;font-weight:500;color:var(--txt-muted)}
.sd-form{display:flex;flex-direction:column;gap:10px;position:sticky;top:12px}
.sd-form label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600;color:var(--txt-2)}
.sd-row{display:flex;gap:8px}.sd-row>*{flex:1;min-width:0}
.sd-types{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sd-types button{font:inherit;font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--txt-2);padding:7px 0;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.sd-types button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.sd-flt{display:flex;flex-direction:column;gap:6px}
.sd-flt .sd-row{align-items:center}
.sd-x{font:inherit;border:0;background:none;color:var(--txt-muted);cursor:pointer;font-size:16px;flex:none !important;padding:0 4px}
.sd-chart{position:relative;height:380px}
.sd-meta{font-size:11.5px;color:var(--txt-muted);margin-top:8px}
.sd-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.sd-w{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;animation:sdIn .35s ease both}
@keyframes sdIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sd-w h3{font-size:13px;font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:6px;color:var(--txt-main)}
.sd-w h3 span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-w .sd-chart{height:240px}
.sd-empty{padding:30px 10px;text-align:center;color:var(--txt-muted);font-size:12.5px}
.sd-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.sd-tbl th{font-size:11px;color:var(--txt-muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.sd-tbl td{padding:6px 8px;border-bottom:1px solid var(--line)}
.sd-tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.sd-tblw{overflow:auto;max-height:380px}
.sd-w .sd-tblw{max-height:240px}
.sd-warn{background:var(--warn-soft,#FFF4E0);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:10px;padding:10px 12px;font-size:12.5px}
.sd-status{font-size:11.5px;color:var(--txt-muted);text-align:right}
.sd-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--txt-main);color:var(--surface);padding:9px 16px;border-radius:10px;font-size:13px;transition:opacity .2s,transform .25s;pointer-events:none;z-index:50}
.sd-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.sd-w{animation:none}.sd-btn:active{transform:none}}
/* ---- 보드 = 화면 (v202) — 12칸 격자. 위치는 grid-column/row 로만 정한다(절대 좌표 없음 — 폭이 바뀌어도 칸이 따라간다) ---- */
.sd-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:56px;gap:14px;position:relative;min-height:120px}
.sd-grid.edit{background-image:repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 2.5%,transparent) 0 calc((100% - 154px)/12),transparent calc((100% - 154px)/12) calc((100% - 154px)/12 + 14px));border-radius:14px}
.sd-gw{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.sd-gw.drag{z-index:5;box-shadow:0 16px 40px rgba(0,0,0,.35);border-color:var(--gold,var(--accent))}
.sd-gw.sel{border-color:var(--gold,var(--accent))}
.sd-gw h3{font-size:13px;font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:6px;color:var(--txt-main);flex:none}
.sd-gw h3 span.n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-gw h3 .sd-std{font-size:10.5px;font-weight:700;color:var(--gold,var(--accent));border:1px solid currentColor;border-radius:6px;padding:0 5px;flex:none}
.sd-gw [data-wh]{flex:1;min-height:0;display:flex;flex-direction:column}
.sd-gw [data-wh]>*{flex:1;min-height:0}
.sd-gw .sd-chart{height:100%;min-height:0}
.sd-gw .sd-tblw{max-height:none;height:100%;overflow:auto}
.sd-grip{cursor:grab;touch-action:none;border:0;background:none;color:var(--txt-muted);font-size:13px;padding:2px 4px;letter-spacing:-1px}
.sd-rs{position:absolute;right:3px;bottom:3px;width:15px;height:15px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 0 55%,var(--txt-muted) 55% 62%,transparent 62% 72%,var(--txt-muted) 72% 79%,transparent 79%);opacity:.6}
.sd-gw.k-title{background:transparent;border-style:dashed;padding:4px 10px}
body.sd-view .sd-gw.k-title{border-color:transparent}
.sd-gw.k-title h3{margin:0;font-size:11px;color:var(--txt-muted)}
body.sd-view .sd-gw.k-title h3{display:none}
.sd-ttl{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:var(--txt-main)}
.sd-ttl::before{content:"";width:4px;height:20px;border-radius:3px;background:linear-gradient(180deg,var(--gold,#C9A24A),var(--accent))}
.sd-txt{white-space:pre-line;font-size:13.5px;line-height:1.65;color:var(--txt-2);overflow:auto}
.sd-txt.attn{border-left:3px solid var(--gold,#C9A24A);padding-left:10px;color:var(--txt-main)}
.sd-kpiw{display:flex}.sd-kpiw .ds-kpi{width:100%;height:100%}
.sd-heat{width:100%;border-collapse:separate;border-spacing:3px;font-size:11.5px;font-variant-numeric:tabular-nums}
.sd-heat th{font-weight:600;color:var(--txt-muted);text-align:right;padding:2px 6px;white-space:nowrap}
.sd-heat thead th{text-align:center}
.sd-heat td{text-align:center;border-radius:6px;padding:4px 0;cursor:pointer;color:var(--txt-main)}
.sd-pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px}
.sd-pill.ok{background:var(--ok-soft,#e6f6ef);color:var(--ok,#14915F)}.sd-pill.warn{background:var(--warn-soft,#fff4e0);color:var(--warn,#B07A12)}.sd-pill.bad{background:var(--bad-soft,#fdecea);color:var(--bad,#C2412F)}.sd-pill.none{background:var(--surface-2);color:var(--txt-muted)}
.sd-pop{position:absolute;top:36px;right:8px;z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.28);padding:10px;display:flex;flex-direction:column;gap:8px;width:260px;max-width:calc(100% - 16px)}
.sd-pop label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:600;color:var(--txt-2)}
.sd-pop textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:80px;background:var(--surface-2);color:var(--txt-main)}
.sd-pop .sd-note{font-size:11px;color:var(--txt-muted)}
.sd-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sd-add .sd-dd{position:relative}
.sd-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.28);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:240px}
.sd-menu button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--txt-main);text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer}
.sd-menu button:hover{background:var(--surface-2)}
.sd-dim[hidden]{display:none !important}
/* ---- 화면 목록 (v203) — «새 화면 만들기»와 «맞춤 분석»이 같은 화면이었다(사용자 지적) → 입구 하나, 목록에서 시작 ---- */
body.sd-list .sd-main,body.sd-list .sd-ed,body.sd-list #boardBar{display:none !important}
body:not(.sd-list) #gallery{display:none !important}
.sd-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sd-tile{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--txt-main);transition:border-color .15s,transform .1s}
.sd-tile:hover{border-color:var(--accent)} .sd-tile:active{transform:scale(.99)}
.sd-tile b{font-size:14px;font-weight:700}
.sd-tile small{font-size:11.5px;color:var(--txt-muted)}
.sd-tile .mini{position:relative;height:96px;border-radius:10px;background:var(--surface-2);overflow:hidden}
.sd-tile .mini i{position:absolute;border-radius:4px;background:color-mix(in srgb,var(--accent) 22%,transparent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.sd-tile .mini i.k-title{background:transparent;border-style:dashed}
.sd-tile.new{border-style:dashed;align-items:center;justify-content:center;min-height:170px;color:var(--accent)}
.sd-tile.new .plus{font-size:34px;font-weight:300;line-height:1}
.sd-tags{display:flex;flex-wrap:wrap;gap:5px}.sd-tags span{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--txt-2)}
.sd-tags span.pub{background:color-mix(in srgb,var(--ok,#14915F) 14%,transparent);color:var(--ok,#14915F)}
.sd-form{max-height:calc(100vh - 24px);overflow:auto}
#pv{height:380px;display:flex;flex-direction:column}
.sd-dim{position:fixed;inset:0;background:rgba(3,8,16,.5);display:grid;place-items:center;padding:16px;z-index:60}
.sd-dlg{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);padding:20px;display:flex;flex-direction:column;gap:10px}
.sd-dlg h2{margin:0;font-size:17px;color:var(--txt-main)}
.sd-dlg p{margin:0;font-size:12.5px;color:var(--txt-2)}
.sd-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px;color:var(--txt-main)}
.sd-opt small{display:block;color:var(--txt-muted);font-size:11.5px}
.sd-opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.sd-dact{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.sd-pubb{font-size:11.5px;font-weight:700;color:var(--ok,#14915F);border:1px solid currentColor;border-radius:999px;padding:2px 9px}
.sd-vhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sd-vhead h1{margin:0;font-size:21px;font-weight:800;color:var(--txt-main)}
body.sd-view .sd-head,body.sd-view #form,body.sd-view #pvCard,body.sd-view #boardBar{display:none !important}
body.sd-view .sd-main{grid-template-columns:minmax(0,1fr)}
@media (max-width:760px){.sd-grid{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(56px,auto)}.sd-grid>.sd-gw{grid-column:1 / -1 !important;grid-row:auto / span var(--h,4) !important}.sd-grid.edit{background:none}.sd-rs,.sd-grip{display:none}}
@media (max-width:1100px){.sd-main{grid-template-columns:1fr}.sd-form{position:static}.sd-board{grid-template-columns:1fr}}
@media (max-width:640px){.sd-wrap{padding:12px 16px 20px}}
</style>
</head>
<body class="sd">
<div id="loginOverlay" style="position:fixed;inset:0;z-index:99999;background:#F5F6F8;display:flex;align-items:center;justify-content:center"></div>
<div class="sd-wrap">
  <div class="sd-head">
    <div>
      <div class="sd-title" data-i="title">분석 작업대</div>
      <div class="sd-sub" data-i="sub">차트와 표준 지표를 배치해 새 화면을 만들고, 탭으로 게시합니다</div>
    </div>
    <span class="sd-sp"></span>
    <button type="button" class="sd-btn ghost sd-ed" id="backBtn" data-i="back">← 화면 목록</button>
    <button type="button" class="sd-btn ghost sd-ed" id="undoBtn" aria-label="undo" disabled>↶</button><button type="button" class="sd-btn ghost sd-ed" id="redoBtn" aria-label="redo" disabled>↷</button>
    <select class="sd-sel sd-ed" id="boardSel" aria-label="보드" hidden></select>
    <input class="sd-in sd-ed" id="boardName" maxlength="80" style="width:190px" data-i-ph="board_name" placeholder="화면 이름">
    <label class="sd-ed" style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--txt-2)"><input type="checkbox" id="boardShared"><span data-i="shared">공유</span></label>
    <button type="button" class="sd-btn pri sd-ed" id="saveBtn" data-i="save">저장</button>
    <button type="button" class="sd-btn sd-ed" id="newBtn" data-i="new_board">복사본 만들기</button>
    <button type="button" class="sd-btn ghost sd-ed" id="rmBtn" data-i="remove">감추기</button>
    <span class="sd-pubb sd-ed" id="pubBadge" hidden></span>
    <button type="button" class="sd-btn sd-ed" id="pubBtn" data-i="publish" hidden>탭으로 게시</button>
    <button type="button" class="sd-btn ghost sd-ed" id="viewBtn" data-i="view_screen" hidden>화면 보기</button>
  </div>
  <div class="sd-vhead" id="vhead" hidden><h1 id="vTitle"></h1><span class="sd-sub" id="vDate"></span><span class="sd-sp"></span><button type="button" class="sd-btn" id="vEdit" data-i="edit_screen" hidden>화면 편집</button></div>
  <div id="warn"></div>
  <section class="sd-gal" id="gallery" hidden></section>

  <section class="sd-main">
    <div class="sd-card sd-form" id="form">
      <h2 data-i="build">차트 만들기</h2>
      <div id="cbForm"></div>
      <div class="sd-row"><button type="button" class="sd-btn pri" id="addW" data-i="add_board">보드에 추가</button><button type="button" class="sd-btn" id="updW" data-i="update_w" hidden>이 차트 고치기</button></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div class="sd-card" id="pvCard">
        <h2><span id="pvTitle" data-i="preview">미리 보기</span><span class="s" id="pvMeta"></span></h2>
        <div id="pv" class="gcb-host"></div>
        <div class="sd-meta" data-i="drill_hint">막대·점·조각을 누르면 그 행들이 뜹니다</div>
      </div>
      <div>
        <div id="boardBar" style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:2px 2px 10px"><b style="font-size:14px" data-i="board">보드</b><span class="sd-sub" id="boardMeta"></span><span class="sd-sp"></span>
          <div class="sd-add"><span class="sd-dd"><button type="button" class="sd-btn" id="addStd" data-i="add_std">표준 지표 추가</button></span><span class="sd-dd"><button type="button" class="sd-btn" id="addLay" data-i="add_lay">레이아웃 요소</button></span></div></div>
        <div class="sd-grid edit" id="board"></div>
      </div>
    </div>
  </section>
  <div class="sd-status" id="status"></div>
</div>
<div class="sd-toast" id="toast" role="status" aria-live="polite"></div>
<div class="sd-dim" id="pubDlg" hidden><div class="sd-dlg" role="dialog" aria-modal="true" aria-labelledby="pubT">
  <h2 id="pubT" data-i="publish">탭으로 게시</h2><p data-i="pub_desc"></p>
  <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--txt-2)"><span data-i="pub_name">탭 이름</span><input class="sd-in" id="pubName" maxlength="40"></label>
  <div style="font-size:12px;font-weight:600;color:var(--txt-2)" data-i="pub_vis">공개 범위</div>
  <label class="sd-opt"><input type="radio" name="pubVis" value="all"><span><span data-i="vis_all"></span><small data-i="vis_all_s"></small></span></label>
  <label class="sd-opt"><input type="radio" name="pubVis" value="staff"><span><span data-i="vis_staff"></span><small data-i="vis_staff_s"></small></span></label>
  <label class="sd-opt"><input type="radio" name="pubVis" value="admin"><span><span data-i="vis_admin"></span><small data-i="vis_admin_s"></small></span></label>

function gridOp(type, i, e){
  const B=document.getElementById('board'), W=S.board.widgets, w=W[i]; if(!w) return;
  const colW=(B.clientWidth-GRID.G*(GRID.C-1))/GRID.C, z=WSZ[wk(w)]||WSZ.chart, o=Object.assign({},w.lay), el=B.querySelector('[data-w="'+i+'"]');
  const sx=e.clientX, sy=e.clientY; let last='', L=null;
  el.classList.add('drag'); popClose();
  const mv=ev=>{ const cx=Math.round((ev.clientX-sx)/(colW+GRID.G)), cy=Math.round((ev.clientY-sy)/(GRID.R+GRID.G));
    let n=Object.assign({},o);
    if(type==='move'){ n.x=clampN(o.x+cx,0,GRID.C-o.w); n.y=Math.max(0,o.y+cy); }
    else { n.w=clampN(o.w+cx,z[2],GRID.C-o.x); n.h=clampN(o.h+cy,z[3],k1(w)?1:24); }
    const key=[n.x,n.y,n.w,n.h].join(); if(key===last) return; last=key;
    const tmp=W.map((x,j)=>j===i?n:x.lay); L=resolveL(tmp,i); posAll(L); };
  const up=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
    el.classList.remove('drag');
    if(L && last!==[o.x,o.y,o.w,o.h].join()){ const R=resolveL(L,null); W.forEach((x,j)=>x.lay=R[j]); posAll(R); setDirty(true);
      if(type==='resize'){ el.querySelectorAll('canvas').forEach(cv=>{ try{ const c=Chart.getChart(cv); if(c) c.resize(); }catch(err){} }); } } };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
}

    if(C){ let r=await C.from('user_layouts').select('id,owner,name,config,shared,updated_at,pub').order('updated_at',{ascending:false}).limit(200);
      if(r.error&&/pub/.test(r.error.message||'')) r=await C.from('user_layouts').select('id,owner,name,config,shared,updated_at').order('updated_at',{ascending:false}).limit(200);
      if(r.error){ S.sql=!/user_layouts|relation|schema cache/i.test(r.error.message||''); if(S.sql) console.warn('[studio] 보드 읽기 실패', r.error); }
      else { S.sql=true; S.boards=(r.data||[]).map(b=>({id:b.id,name:b.name,owner:b.owner,shared:b.shared,pub:b.pub||null,widgets:(b.config&&b.config.widgets)||[]})); }
    } else S.sql=false;
  }catch(e){ S.sql=false; }
  if(!S.sql) S.boards=localBoards().map((b,i)=>Object.assign({id:'L'+i}, b));
  document.getElementById('warn').innerHTML=S.sql?'':'<div class="sd-warn">'+esc(t(GST.isAdmin&&GST.isAdmin()?'nosql':'nosql_v'))+'</div>';
  drawBoardSel(); if(S.list) drawGallery();
}
function drawBoardSel(){
  const sel=document.getElementById('boardSel');
  sel.innerHTML='<option value="">'+esc(t('new_board_n'))+'</option>'+S.boards.map(b=>'<option value="'+b.id+'"'+(String(b.id)===String(S.board.id)?' selected':'')+'>'+esc(b.name)+(b.owner&&b.owner!==me()?' · '+esc(b.owner.replace(/@.*/,'')):'')+'</option>').join('');
  document.getElementById('boardName').value=S.board.name||'';
  document.getElementById('boardShared').checked=!!S.board.shared;
  document.getElementById('rmBtn').hidden=!S.board.id;
  pubPaint();
}
async function saveBoard(asNew){
  const name=document.getElementById('boardName').value.trim()||t('new_board_n'), shared=document.getElementById('boardShared').checked;
  fixLay(S.board.widgets); const cfg={v:2, widgets:S.board.widgets};
  if(!S.sql){ const L=localBoards(); const ix=String(S.board.id||'').startsWith('L')&&!asNew?+String(S.board.id).slice(1):-1;
    const b={name, widgets:S.board.widgets}; if(ix>=0) L[ix]=b; else L.unshift(b); try{ localStorage.setItem(LKEY, JSON.stringify(L.slice(0,50))); }catch(e){}
    S.board.name=name; await loadBoards(); S.board.id='L'+(ix>=0?ix:0); setDirty(false); drawBoardSel(); toast(t('saved')); return; }
  try{ const C=await GST.db();
    const own=!S.board.owner||S.board.owner===me();
    const r=await C.rpc('layout_save',{p_id:asNew||!own?null:S.board.id, p_name:name, p_config:cfg, p_shared:shared});
    if(r.error){ toast(/not_yours/.test(r.error.message)?t('not_yours'):t('fail')); console.warn(r.error); return; }
    S.board.id=r.data.id; S.board.name=name; S.board.shared=shared; S.board.owner=me(); setDirty(false); await loadBoards(); toast(t('saved'));
    try{ history.replaceState(null,'', location.pathname+'?board='+encodeURIComponent(S.board.id)); }catch(e){}
    if(S.board.pub){ try{ parent.postMessage({type:'gst-screens'},'*'); }catch(e){} }
  }catch(e){ toast(t('fail')); console.warn(e); }
}
async function removeBoard(){
  if(!S.board.id) return;
  if(!S.sql){ const L=localBoards(); L.splice(+String(S.board.id).slice(1),1); try{ localStorage.setItem(LKEY, JSON.stringify(L)); }catch(e){} }
  else { try{ const C=await GST.db(); const r=await C.rpc('layout_remove',{p_id:S.board.id}); if(r.error){ toast(/not_yours/.test(r.error.message)?t('not_yours'):t('fail')); return; } }catch(e){ toast(t('fail')); return; } }
  const wasPub=!!S.board.pub; S.board={id:null,name:'',shared:false,owner:null,widgets:[],pub:null}; setDirty(false); listMode(true); try{ history.replaceState(null,'', location.pathname); }catch(e){} await loadBoards(); drawBoard(); drawGallery(); toast(t('removed'));
  if(wasPub){ try{ parent.postMessage({type:'gst-screens'},'*'); }catch(e){} }
}
let _tt=0; function toast(s){ const e=document.getElementById('toast'); e.textContent=s; e.classList.add('on'); clearTimeout(_tt); _tt=setTimeout(()=>e.classList.remove('on'),2600); }

/* ===== 틀 ===== */
function bind(){
  const c=()=>S.cfg;
  document.getElementById('addW').onclick=()=>{ addWidget(JSON.parse(JSON.stringify(c()))); S.editIx=-1; drawForm(); toast(t('added')); };
  document.getElementById('updW').onclick=()=>{ if(S.editIx<0) return; const old=S.board.widgets[S.editIx]; S.board.widgets[S.editIx]=Object.assign(JSON.parse(JSON.stringify(c())),{lay:old&&old.lay}); S.editIx=-1; setDirty(true); drawBoard(); drawForm(); };
  document.getElementById('backBtn').onclick=backToList;
  document.getElementById('undoBtn').onclick=()=>histUndo(true); document.getElementById('redoBtn').onclick=()=>histUndo(false);
  document.addEventListener('keydown', ev=>{ if(!(ev.ctrlKey||ev.metaKey)||ev.altKey||S.view||S.list) return; const k=ev.key.toLowerCase(); if(k!=='z'&&k!=='y') return;
    const tg=ev.target; if(tg&&(/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable)) return; ev.preventDefault(); histUndo(k==='z'&&!ev.shiftKey); });
  document.getElementById('gallery').addEventListener('click', e=>{ const b=e.target.closest('[data-open]'); if(!b) return; openBoard(b.dataset.open); });
  document.getElementById('boardSel').onchange=e=>{ const b=S.boards.find(x=>String(x.id)===e.target.value);
    S.board=b?{id:b.id,name:b.name,shared:b.shared,owner:b.owner||null,pub:b.pub||null,widgets:JSON.parse(JSON.stringify(b.widgets||[]))}:{id:null,name:'',shared:false,owner:null,widgets:[],pub:null};
    S.editIx=-1; S.sel=-1; setDirty(false); drawBoardSel(); drawBoard(); drawForm(); };
  document.getElementById('saveBtn').onclick=()=>saveBoard(false);
  document.getElementById('newBtn').onclick=()=>{ S.board={id:null,name:'',shared:false,owner:null,widgets:JSON.parse(JSON.stringify(S.board.widgets)),pub:null}; setDirty(true); drawBoardSel(); document.getElementById('boardName').focus(); };
  bindBoard();
  document.getElementById('rmBtn').onclick=removeBoard;
}
function applyLang(){
  document.documentElement.lang=LANG;
  try{ GST.applyI18n && GST.applyI18n(t, LANG); }catch(e){ document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent=t(el.dataset.i); }); }
  if(S.cfg){ drawForm(); preview(); drawBoard(); } drawBoardSel(); viewPaint(); if(S.list) drawGallery();
  try{ document.getElementById('undoBtn').title=GST.cb.T('undo'); document.getElementById('redoBtn').title=GST.cb.T('redo'); }catch(e){}
}
window.setLang=function(l){ if(T[l]){ LANG=l; applyLang(); } };
window.addEventListener('message',e=>{ const d=e.data||{}; if(d.type==='gst-lang'&&T[d.lang]){ LANG=d.lang; applyLang(); } });
/* 테마가 바뀌면 차트 잉크를 다시 칠한다(캔버스는 CSS 변수를 못 읽는다) */
/* 테마 클래스가 바뀐 때만(v197) — 이미지 저장(gst-shot)·효과 패널이 body 클래스를 바꿀 때마다 보드 전체를 다시 그렸다 */
try{ let _th=document.body.className.match(/theme-\S+/g)+''; new MutationObserver(()=>{ const th=document.body.className.match(/theme-\S+/g)+''; if(th===_th) return; _th=th; if(S.cfg){ preview(); drawBoard(); } }).observe(document.body,{attributes:true,attributeFilter:['class']}); }catch(e){}
async function load(){
  document.getElementById('status').textContent=t('loading');
  GST.cb._reset && GST.cb._reset();
  await GST.loadMe().catch(()=>{});
  STD=null;
  await loadBoards();
  if(S.list){ drawGallery(); }
  else { pickWanted(); drawBoard(); }
  histMark();
  await setSrc(S.cfg?S.cfg.src:'wk', true);
  document.getElementById('status').textContent='✅ '+new Date().toLocaleString();
}
window.loadData=load;
bind(); applyLang();
load().catch(e=>{ console.error('[studio] 읽기 실패', e); document.getElementById('status').textContent=GST.failNote?GST.failNote(e):String(e&&e.message||e); });
GST.startAutoRefresh && GST.startAutoRefresh(30);
</script>
<script>GST.initSync();</script>
