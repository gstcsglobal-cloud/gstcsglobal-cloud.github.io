<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알림 발송 · CS Global Team</title>
<link rel="stylesheet" href="https://gstcsglobal-cloud.github.io/assets/vendor/pretendard/pretendardvariable-dynamic-subset.css">
<script src="https://gstcsglobal-cloud.github.io/assets/vendor/papaparse.min.js"></script>
<script>window.Papa||document.write('<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js">\x3C/script>')</script>
<script src="https://gstcsglobal-cloud.github.io/assets/core.js?v=199"></script>
<link rel="stylesheet" href="https://gstcsglobal-cloud.github.io/assets/theme.css?v=199">
<link rel="stylesheet" href="https://gstcsglobal-cloud.github.io/assets/ds.css?v=1">
<!--
  알림 발송 (v207 · supabase/setup-33-notify.sql · 엣지펑션 notify-send)
  사용자: 「관리 페이지에서 발송하고자 하는 이메일을 등록하고, 지정된 시각 또는 발송 빈도를 조정 — 막 아무한테나 보내면 안 되니까」
          · 「카톡도 등록 사용자 리스트를 웹 관리 화면에서 볼 수 있게 하고 보내는 사람들을 선택해서」.
  ⚠ 관리자 + 쓰기 권한만(서버 _tgt_who). 등록된 사람에게만 간다 — 등록 · 수정 · 빼기는 변경 이력(sheet_edits gid notify)에 남는다.
  ⚠ 글은 «글로벌 현황»이 남긴 브리핑 스냅샷과 조치 사항을 옮긴 것이다 — 여기서 판정하지 않는다.
  ⚠ 카톡은 «챗봇에서 이메일 인증을 마친 사람»만 고를 수 있다. 화면에는 이메일만 보이고 카톡 식별자는 서버만 안다.
  관리 화면이라 한국어만 둔다(/edit/ · /upload/ 와 같다).
-->
<style>
.nf-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px;align-items:end}
.nf-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--txt-muted)}
.nf-form .full{grid-column:1/-1}
.nf-kinds{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--txt-main)}
.nf-kinds label{flex-direction:row;align-items:center;gap:6px;color:var(--txt-main);font-size:13px}
.nf-pick{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-md);padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.nf-pick label{flex-direction:row;align-items:center;gap:8px;color:var(--txt-main);font-size:13px;padding:3px 0}
.nf-pick .m{color:var(--txt-muted);font-size:11.5px;margin-left:auto}
.nf-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nf-steps{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--txt-2)}
.nf-steps code{font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.nf-err{color:var(--bad);font-size:12px}
</style>
</head>
<body class="ds">
<div id="loginOverlay" style="position:fixed;inset:0;z-index:99999;background:#F5F6F8;display:flex;align-items:center;justify-content:center"></div>
<div class="ds-wrap">
  <header class="ds-head">
    <div>
      <h1 class="ds-title">알림 발송</h1>
      <div class="ds-sub">등록한 사람에게만 · 정한 시각에 · 브리핑과 조치 사항을 메일·카톡으로 보냅니다</div>
    </div>
    <span class="ds-sp"></span>
    <button type="button" class="ds-btn" id="reload">새로고침</button>
  </header>
  <div id="banners" class="ds-grid"></div>
  <div class="ds-card" id="cAdd"></div>
  <div class="ds-card" id="cSubs"></div>
  <div class="ds-grid ds-g2e">
    <div class="ds-card" id="cKakao"></div>
    <div class="ds-card" id="cSetup"></div>
  </div>
  <div class="ds-card" id="cLog"></div>
  <div class="ds-status" id="status"></div>
</div>

<script>
if(!window.GST){document.body.insertAdjacentHTML('afterbegin','<div style="background:#7f1d1d;color:#fff;padding:10px 16px;font:13px sans-serif">⚠️ assets/core.js 로드 실패</div>');throw new Error('GST core missing');}
GST.needVer && GST.needVer(199);
GST.authGate();

const esc=s=>GST._esc(s);
const $=id=>document.getElementById(id);
const FREQ={daily:'매일',weekdays:'평일(월~금)',weekly:'매주',monthly:'매월'};
const DOW=['일','월','화','수','목','금','토'];
const KIND={brief:'이번 주 브리핑',actions:'열린 조치 사항(범위 안)',mine:'내가 맡은 조치 사항'};
const ERR={forbidden:'관리자 + 쓰기 권한이 필요합니다',conflict:'그사이 다른 사람이 바꿨습니다 — 다시 불러왔으니 확인 후 다시 저장하세요',
  duplicate:'같은 채널·받는 사람·범위로 이미 등록돼 있습니다',kakao_not_verified:'카톡 챗봇에서 이메일 인증을 마친 사람만 고를 수 있습니다',
  bad_target:'이메일 주소 형식이 아닙니다',bad_hour:'시각은 0~23 입니다',bad_dom:'날짜는 1~28 입니다(29~31일이 없는 달이 있다)',bad_kinds:'보낼 내용을 하나 이상 고르세요',
  not_found:'이미 빠진 수신자입니다',no_smtp:'메일 발송 설정이 아직 없습니다(오른쪽 «발송 준비» 1번)',no_kakao:'카톡 발송 설정이 아직 없습니다(«발송 준비» 2번)',
  kakao_no_user:'이 이메일로 인증된 카톡 사용자가 없습니다',kakao_outbox:'카톡 대기함에 넣지 못했습니다',kakao_lookup:'카톡 사용자를 찾지 못했습니다'};
const errText=e=>{ const s=String(e||''); const k=Object.keys(ERR).find(x=>s===x||s.startsWith(x)); return k?ERR[k]+(s!==k?' ('+s+')':''):s; };
let C=null, D=null, SCOPES=[];

function status(s, bad){ const e=$('status'); e.textContent=s||''; e.style.color=bad?'var(--bad)':''; }
function toast(s){ if(GST.capToast) GST.capToast(s); status(s); }
function scopeName(sc){ return sc==='all'?'전사':sc==='r:국내'?'국내 전체':sc==='r:해외'?'해외 전체':String(sc).replace(/^[ro]:/,''); }
function when(s){ return (FREQ[s.freq]||s.freq)+(s.freq==='weekly'?' '+DOW[s.dow]+'요일':'')+(s.freq==='monthly'?' '+s.dom+'일':'')+' '+String(s.hour).padStart(2,'0')+':00'; }
function ago(t){ if(!t) return '—'; const d=new Date(t); return GST.ymdL?GST.ymdL(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):d.toLocaleString(); }

async function load(){
  status('불러오는 중…');
  try{
    await GST.loadMe();
    C = await GST._dbAuthed();
    if(!C){ $('banners').innerHTML='<div class="ds-banner warn">서버에 연결되지 않아 알림 설정을 읽을 수 없습니다(인증 꺼짐 · 오프라인).</div>'; status(''); return; }
    if(!(GST._me && GST._me.role==='admin' && GST._me.can_write)){
      $('banners').innerHTML='<div class="ds-banner warn"><b>관리자 전용 화면입니다</b> — 알림 수신자는 관리자(쓰기 권한)만 등록·변경할 수 있습니다.</div>';
      ['cAdd','cSubs','cKakao','cSetup','cLog'].forEach(id=>$(id).style.display='none'); status(''); return;
    }
    const r = await C.rpc('notify_admin');
    if(r.error){
      const m=String(r.error.message||r.error.code||'');
      $('banners').innerHTML='<div class="ds-banner warn">'+(/notify_admin|does not exist|PGRST20/.test(m)
        ?'서버에 알림 기능이 아직 없습니다 — supabase/setup-33-notify.sql 을 실행한 뒤 다시 여세요.':'알림 설정을 읽지 못했습니다: '+esc(m))+'</div>';
      status(''); return;
    }
    D = r.data || {};
    if(D.error){ $('banners').innerHTML='<div class="ds-banner warn">'+esc(errText(D.error))+'</div>'; status(''); return; }
    /* 범위 후보 — 브리핑 스냅샷이 있는 범위(글로벌 현황이 남긴 것)만. 없는 범위는 전사 브리핑으로 간다. */
    try{ const b=await C.from('brief_snap').select('scope'); SCOPES=(b.data||[]).map(x=>x.scope).filter(s=>s!=='all').sort(); }catch(e){ SCOPES=[]; }
    $('banners').innerHTML='';
    drawAll(); status('');
  }catch(e){ console.warn('[notify]', e); status('불러오지 못했습니다: '+(e&&e.message||e), true); }
}

function scopeOpts(sel){
  const L=['all','r:국내','r:해외'].concat(SCOPES.filter(s=>s.startsWith('o:')));
  if(sel && !L.includes(sel)) L.push(sel);
  return L.map(s=>'<option value="'+esc(s)+'"'+(s===sel?' selected':'')+'>'+esc(scopeName(s))+'</option>').join('');
}
function schedFields(s){
  s=s||{freq:'weekly',hour:8,dow:1,dom:1,scope:'all',kinds:['brief','actions']};
  return '<label>빈도<select class="ds-select" data-f="freq">'+Object.keys(FREQ).map(k=>'<option value="'+k+'"'+(k===s.freq?' selected':'')+'>'+FREQ[k]+'</option>').join('')+'</select></label>'+
    '<label>시각(한국)<select class="ds-select" data-f="hour">'+Array.from({length:24},(_,h)=>'<option value="'+h+'"'+(h===+s.hour?' selected':'')+'>'+String(h).padStart(2,'0')+':00</option>').join('')+'</select></label>'+
    '<label data-only="weekly">요일<select class="ds-select" data-f="dow">'+DOW.map((d,i)=>'<option value="'+i+'"'+(i===+s.dow?' selected':'')+'>'+d+'요일</option>').join('')+'</select></label>'+
    '<label data-only="monthly">날짜<select class="ds-select" data-f="dom">'+Array.from({length:28},(_,i)=>'<option value="'+(i+1)+'"'+(i+1===+s.dom?' selected':'')+'>'+(i+1)+'일</option>').join('')+'</select></label>'+
    '<label>범위<select class="ds-select" data-f="scope">'+scopeOpts(s.scope)+'</select></label>'+
    '<div class="full"><div class="ds-note" style="margin-bottom:4px">보낼 내용</div><div class="nf-kinds">'+
      Object.keys(KIND).map(k=>'<label><input type="checkbox" data-k="'+k+'"'+((s.kinds||[]).includes(k)?' checked':'')+'> '+KIND[k]+'</label>').join('')+'</div></div>';
}
function syncOnly(box){
  const f=box.querySelector('[data-f="freq"]').value;
  box.querySelectorAll('[data-only]').forEach(el=>{ el.style.display=el.dataset.only===f?'':'none'; });
}
function readSched(box){
  const g=k=>box.querySelector('[data-f="'+k+'"]').value;
  return { freq:g('freq'), hour:+g('hour'), dow:+g('dow'), dom:+g('dom'), scope:g('scope'),
           kinds:[].slice.call(box.querySelectorAll('[data-k]:checked')).map(x=>x.dataset.k) };
}

function drawAll(){ drawAdd(); drawSubs(); drawKakao(); drawSetup(); drawLog(); }

function drawAdd(){
  const people=(D.people||[]), kk=(D.kakao||[]);
  const has=(ch,em,sc)=>(D.subs||[]).some(s=>s.channel===ch&&s.target===em&&s.scope===sc);
  $('cAdd').innerHTML='<h2>수신자 등록 <span class="s">한 사람씩 등록합니다 — 등록한 사람에게만 갑니다</span></h2>'+
    '<div class="ds-seg" id="addCh" role="tablist"><button type="button" data-ch="email" class="on" aria-pressed="true">메일</button><button type="button" data-ch="kakao" aria-pressed="false">카톡</button></div>'+
    '<div class="nf-form" id="addBox">'+
      '<label class="full" data-ch-only="email">받는 사람(메일)<input class="ds-in" id="addMail" list="peopleList" placeholder="name@company.com" autocomplete="off">'+
        '<datalist id="peopleList">'+people.map(p=>'<option value="'+esc(p.email)+'">'+esc(p.role||'')+'</option>').join('')+'</datalist>'+
        '<span class="ds-note" id="addMailNote">대시보드 허용 사용자 목록에서 고르거나 직접 입력합니다</span></label>'+
      '<div class="full" data-ch-only="kakao" style="display:none"><div class="ds-note" style="margin-bottom:4px">받는 사람(카톡) — 챗봇에서 이메일 인증을 마친 사람 '+kk.length+'명</div>'+
        (kk.length?'<div class="nf-pick" id="addKk">'+kk.map(u=>'<label><input type="checkbox" value="'+esc(u.email)+'"> '+esc(u.email)+
          (u.allowed?'':' <span class="ds-pill warn">대시보드 사용자 아님</span>')+'<span class="m">인증 '+esc(ago(u.verified_at))+'</span></label>').join('')+'</div>'
          :'<div class="ds-empty">인증된 카톡 사용자가 없습니다 — 챗봇에서 이메일 인증을 먼저 해야 합니다.</div>')+
      '</div>'+
      '<label class="full">이름표(선택)<input class="ds-in" id="addLabel" maxlength="60" placeholder="예: 대만 법인장"></label>'+
      schedFields()+
      '<div class="full nf-act"><span class="nf-err" id="addErr"></span><button type="button" class="ds-btn pri" id="addGo">등록</button></div>'+
    '</div>';
  const box=$('addBox'); syncOnly(box);
  box.querySelector('[data-f="freq"]').onchange=()=>syncOnly(box);
  let ch='email';
  $('addCh').querySelectorAll('button').forEach(b=>b.onclick=()=>{ ch=b.dataset.ch;
    $('addCh').querySelectorAll('button').forEach(x=>{ x.classList.toggle('on',x===b); x.setAttribute('aria-pressed',x===b?'true':'false'); });
    box.querySelectorAll('[data-ch-only]').forEach(el=>el.style.display=el.dataset.chOnly===ch?'':'none'); });
  $('addMail').oninput=()=>{ const v=$('addMail').value.trim().toLowerCase();
    $('addMailNote').textContent = !v?'대시보드 허용 사용자 목록에서 고르거나 직접 입력합니다':
      people.some(p=>p.email===v)?'대시보드 허용 사용자입니다':'⚠ 대시보드 허용 사용자가 아닙니다 — 회사 밖 주소라면 보내지 않는 것이 맞습니다'; };
  $('addGo').onclick=async()=>{
    const sch=readSched(box), label=$('addLabel').value.trim();
    const err=$('addErr'); err.textContent='';
    if(!sch.kinds.length){ err.textContent=ERR.bad_kinds; return; }
    let targets=[];
    if(ch==='email'){ const v=$('addMail').value.trim().toLowerCase(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ err.textContent=ERR.bad_target; return; }
      if(!people.some(p=>p.email===v) && !confirm(v+' 은(는) 대시보드 허용 사용자가 아닙니다. 그래도 이 주소로 보낼까요?')) return;
      targets=[v]; }
    else { targets=[].slice.call(box.querySelectorAll('#addKk input:checked')).map(x=>x.value); if(!targets.length){ err.textContent='카톡으로 받을 사람을 고르세요'; return; } }
    const dup=targets.filter(t=>has(ch,t,sch.scope));
    if(dup.length===targets.length){ err.textContent=ERR.duplicate; return; }
    $('addGo').disabled=true; let okN=0; const bad=[];
    for(const t of targets){ if(dup.includes(t)) continue;
      const r=await C.rpc('notify_save',{p_id:null, p_set:Object.assign({channel:ch, target:t, label:label||null}, sch), p_at:null});
      const d=r.data||{}; if(r.error||!d.ok) bad.push(t+': '+errText(r.error?r.error.message:d.error)); else okN++; }
    $('addGo').disabled=false;
    if(bad.length) err.textContent=bad.join(' · ');
    if(okN){ toast(okN+'명 등록했습니다'+(dup.length?' · 이미 있는 '+dup.length+'명은 건너뜀':'')); await load(); }
  };
}

function drawSubs(){
  const L=D.subs||[];
  const last={}; (D.log||[]).forEach(l=>{ if(l.sub_id!=null && !last[l.sub_id]) last[l.sub_id]=l; });
  $('cSubs').innerHTML='<h2>등록된 수신자 <span class="s">'+L.length+'명 · 메일 '+L.filter(s=>s.channel==='email').length+' · 카톡 '+L.filter(s=>s.channel==='kakao').length+'</span></h2>'+
    (L.length?'<div class="ds-tbl-wrap"><table class="ds-tbl" data-gst-nosn><thead><tr><th>채널</th><th>받는 사람</th><th>언제</th><th>범위</th><th>내용</th><th>사용</th><th>마지막 발송</th><th></th></tr></thead><tbody>'+
      L.map(s=>{ const lg=last[s.id];
        return '<tr data-id="'+s.id+'"><td><span class="ds-pill">'+(s.channel==='email'?'메일':'카톡')+'</span></td>'+
          '<td><b>'+esc(s.label||s.target)+'</b>'+(s.label?'<div class="ds-note">'+esc(s.target)+'</div>':'')+'</td>'+
          '<td>'+esc(when(s))+'</td><td>'+esc(scopeName(s.scope))+'</td>'+
          '<td class="ds-note">'+(s.kinds||[]).map(k=>esc(KIND[k]||k)).join(' · ')+'</td>'+
          '<td><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-a="en"'+(s.enabled?' checked':'')+'>'+(s.enabled?'켜짐':'꺼짐')+'</label></td>'+
          '<td>'+(s.last_sent_at?esc(ago(s.last_sent_at)):'—')+(lg&&!lg.ok?'<div class="nf-err">'+esc(errText(lg.error))+'</div>':'')+'</td>'+
          '<td><div class="nf-act"><button type="button" class="ds-btn sm" data-a="edit">수정</button><button type="button" class="ds-btn sm" data-a="test">테스트</button>'+
          '<button type="button" class="ds-btn sm" data-a="now">지금 보내기</button><button type="button" class="ds-btn sm ghost" data-a="rm">빼기</button></div></td></tr>'+
          '<tr class="nf-edit" data-for="'+s.id+'" hidden><td colspan="8"><div class="nf-form">'+schedFields(s)+
          '<label class="full">이름표<input class="ds-in" data-f="label" maxlength="60" value="'+esc(s.label||'')+'"></label>'+
          '<div class="full nf-act"><span class="nf-err"></span><button type="button" class="ds-btn" data-a="cancel">취소</button><button type="button" class="ds-btn pri" data-a="save">저장</button></div></div></td></tr>';
      }).join('')+'</tbody></table></div>'
      :'<div class="ds-empty">아직 등록된 수신자가 없습니다 — 위에서 등록하면 정한 시각에 보냅니다.</div>');
  $('cSubs').querySelectorAll('tbody tr[data-id]').forEach(tr=>{
    const s=L.find(x=>String(x.id)===tr.dataset.id), ed=$('cSubs').querySelector('tr[data-for="'+s.id+'"]');
    const box=ed.querySelector('.nf-form'); syncOnly(box); box.querySelector('[data-f="freq"]').onchange=()=>syncOnly(box);
    tr.querySelector('[data-a="edit"]').onclick=()=>{ ed.hidden=!ed.hidden; };
    ed.querySelector('[data-a="cancel"]').onclick=()=>{ ed.hidden=true; };
    ed.querySelector('[data-a="save"]').onclick=async(ev)=>{
      const sch=readSched(box); sch.label=box.querySelector('[data-f="label"]').value.trim();
      const e=ed.querySelector('.nf-err'); e.textContent='';
      if(!sch.kinds.length){ e.textContent=ERR.bad_kinds; return; }
      ev.target.disabled=true;
      const r=await C.rpc('notify_save',{p_id:s.id, p_set:sch, p_at:s.updated_at}); const d=r.data||{};
      ev.target.disabled=false;
      if(r.error||!d.ok){ e.textContent=errText(r.error?r.error.message:d.error); if(d.error==='conflict') await load(); return; }
      toast('저장했습니다'); await load();
    };
    tr.querySelector('[data-a="en"]').onchange=async(ev)=>{
      const r=await C.rpc('notify_save',{p_id:s.id, p_set:{enabled:ev.target.checked}, p_at:s.updated_at}); const d=r.data||{};
      if(r.error||!d.ok){ alert(errText(r.error?r.error.message:d.error)); }
      await load();
    };
    tr.querySelector('[data-a="rm"]').onclick=async()=>{
      if(!confirm((s.label||s.target)+' 을(를) 수신자에서 뺄까요? (변경 이력은 남습니다)')) return;
      const r=await C.rpc('notify_remove',{p_id:s.id, p_at:s.updated_at}); const d=r.data||{};
      if(r.error||!d.ok){ alert(errText(r.error?r.error.message:d.error)); }
      else toast('뺐습니다'); await load();
    };
    const send=async(mode, btn)=>{ let msg=null;
      if(mode==='now' && !confirm((s.label||s.target)+' 에게 지금 보낼까요? (정해진 발송과 같은 글 · 마지막 발송 시각이 바뀝니다)')) return;
      btn.disabled=true; const old=btn.textContent; btn.textContent='보내는 중…';
      try{
        const tok=await GST.token();
        const res=await fetch(GST.SB_URL+'/functions/v1/notify-send?op=test',{method:'POST',
          headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok, apikey:GST.SB_ANON},
          body:JSON.stringify({id:s.id, mode}), signal:AbortSignal.timeout(40000)});
        const d=await res.json().catch(()=>({}));
        msg=d.ok?(mode==='test'?'테스트를 ':'')+'보냈습니다 — '+(s.channel==='email'?'메일함을':'카톡을')+' 확인하세요':null;
        if(!d.ok) alert('보내지 못했습니다: '+errText(d.error||('HTTP '+res.status)));
      }catch(e){ alert('보내지 못했습니다: '+(e&&e.message||e)); }
      btn.disabled=false; btn.textContent=old; await load(); if(msg) toast(msg);   // 다시 읽은 뒤에 적는다(읽기가 상태줄을 지운다)
    };
    tr.querySelector('[data-a="test"]').onclick=ev=>send('test', ev.target);
    tr.querySelector('[data-a="now"]').onclick=ev=>send('now', ev.target);
  });
}

function drawKakao(){
  const kk=D.kakao||[], subs=D.subs||[];
  $('cKakao').innerHTML='<h2>카톡 인증 사용자 <span class="s">'+kk.length+'명 · 챗봇에서 이메일 인증을 마친 사람</span></h2>'+
    (kk.length?'<div class="ds-tbl-wrap"><table class="ds-tbl" data-gst-nosn><thead><tr><th>이메일</th><th>대시보드</th><th>인증</th><th>카톡 알림</th></tr></thead><tbody>'+
      kk.map(u=>{ const n=subs.filter(s=>s.channel==='kakao'&&s.target===u.email).length;
        return '<tr><td>'+esc(u.email)+'</td><td>'+(u.allowed?'<span class="ds-pill ok">사용자</span>':'<span class="ds-pill warn">아님</span>')+'</td>'+
          '<td>'+esc(ago(u.verified_at))+'</td><td>'+(n?'<span class="ds-pill ok">등록 '+n+'</span>':'<span class="ds-note">—</span>')+'</td></tr>'; }).join('')+
      '</tbody></table></div>':'<div class="ds-empty">인증된 카톡 사용자가 없습니다.</div>')+
    '<div class="ds-note">카톡으로 받을 사람은 위 «수신자 등록»의 «카톡»에서 골라 등록합니다. 카톡 식별자는 화면에 내보내지 않습니다.</div>';
}

function drawSetup(){
  const lg=D.log||[], noSmtp=lg.some(l=>l.error==='no_smtp'), noK=lg.some(l=>l.error==='no_kakao');
  $('cSetup').innerHTML='<h2>발송 준비 <span class="s">처음 한 번 · 관리자가 Supabase 에서</span></h2>'+
    '<ol class="nf-steps">'+
    '<li><b>메일</b>'+(noSmtp?' <span class="ds-pill warn">설정 필요</span>':'')+' — 보내는 Gmail 계정에서 «2단계 인증»을 켜고 «앱 비밀번호»를 만든 뒤, Supabase → Edge Functions → Secrets 에 '+
      '<code>GMAIL_USER</code>(보내는 주소) · <code>GMAIL_APP_PW</code>(앱 비밀번호)를 넣습니다. Gmail 무료 계정은 하루 약 500통까지입니다.</li>'+
    '<li><b>카톡</b>'+(noK?' <span class="ds-pill warn">설정 필요</span>':'')+' — 카카오 비즈니스 «챗봇 관리자센터»에서 이벤트 API 사용을 신청하고(건당 과금 · 성공 건만), '+
      '이벤트 블록(이벤트 이름 예: <code>gst_notify</code>)을 만들어 그 블록이 스킬 <code>…/functions/v1/notify-send?op=event</code> 를 부르게 합니다(헤더는 기존 스킬과 같게). '+
      '그다음 Secrets 에 <code>KAKAO_BOT_ID</code> · <code>KAKAO_EVENT_KEY</code>(REST API 키) · <code>KAKAO_EVENT_NAME</code> 을 넣습니다.</li>'+
    '<li><b>정해진 시각</b> — 매시 7분에 서버가 «보낼 차례인 수신자»를 찾아 보냅니다(이미 켜져 있습니다).</li>'+
    '<li>설정 뒤 수신자 줄의 <b>테스트</b>로 확인합니다 — 테스트는 마지막 발송 시각을 바꾸지 않습니다.</li></ol>'+
    '<div class="ds-note">글은 «글로벌 현황»이 마지막으로 남긴 브리핑입니다 — 언제 집계한 글인지 첫 줄에 적힙니다(오래되면 오래됐다고 적힙니다).</div>';
}

function drawLog(){
  const L=D.log||[];
  $('cLog').innerHTML='<h2>발송 이력 <span class="s">최근 '+L.length+'건</span></h2>'+
    (L.length?'<div class="ds-tbl-wrap"><table class="ds-tbl" data-gst-nosn><thead><tr><th>시각</th><th>채널</th><th>받는 사람</th><th>종류</th><th>결과</th><th>제목</th></tr></thead><tbody>'+
      L.map(l=>'<tr><td>'+esc(ago(l.at))+'</td><td>'+(l.channel==='email'?'메일':'카톡')+'</td><td>'+esc(l.target)+'</td>'+
        '<td>'+({sched:'정기',test:'테스트',now:'지금 보내기'}[l.kind]||esc(l.kind))+'</td>'+
        '<td>'+(l.ok?'<span class="ds-pill ok">보냄</span>':'<span class="ds-pill bad">실패</span> <span class="ds-note">'+esc(errText(l.error))+'</span>')+'</td>'+
        '<td class="ds-note">'+esc(l.summary||'')+'</td></tr>').join('')+'</tbody></table></div>'
      :'<div class="ds-empty">아직 보낸 알림이 없습니다.</div>');
}

$('reload').onclick=load;
load();
</script>
</body>
