let LANG='ko';
try{ const l=sessionStorage.getItem('gst_lang'); if(l&&T[l]) LANG=l; else if(window.name&&T[window.name]) LANG=window.name; }catch(e){}
const t=k=>(T[LANG]&&T[LANG][k]!=null)?T[LANG][k]:(T.ko[k]!=null?T.ko[k]:k);
const fmt=(s,o)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m);
const esc=s=>GST._esc(s);
const v2t=(k,o)=>GST.v2t(k,o,LANG);
const KR=GST.ORG.REGION_KR, OS=GST.ORG.REGION_OS;
const short=op=>String(op||'—').replace(/\s+(SCRUBBER|CHILLER)$/i,'').trim()||'—';

let RAW=null, ACTS=null;
const S={sc:{kind:'all', v:''}};

async function load(){
  status(t('loading'));
  const r=await Promise.allSettled([GST.ops.load(), GST.targets.load(), loadActs()]);
  RAW=r[0].status==='fulfilled'?r[0].value:{INST:[],WK:[],KRA:[],fails:['ops']};
  try{ if(GST.loadMe) await GST.loadMe(); }catch(e){}
  const q=new URLSearchParams(location.search);
  if(q.get('op')) S.sc={kind:'op', v:q.get('op')}; else if(q.get('region')) S.sc={kind:'region', v:q.get('region')==='os'?OS:KR};
  fillScope(); render();
  status((RAW.fails.length?t('fail')+' ('+RAW.fails.join(', ')+') · ':'')+'✅ '+new Date().toLocaleString(), !!RAW.fails.length);
}
async function loadActs(){
  try{ const C=await GST.db(); if(!C){ ACTS=null; return; }
    const r=await C.from('action_items').select('op,due,status').not('status','in','(done,dismissed)').limit(2000);
    ACTS=r.error?null:(r.data||[]);
  }catch(e){ ACTS=null; }
}
function opsList(){
  const asOf=GST.ops.asOf(RAW), M={};
  RAW.INST.forEach(x=>{ if(!x.op||!GST.ops.isIn(x,asOf)) return; M[x.op]=(M[x.op]||0)+1; });
  GST.targets.rows.forEach(x=>{ if(x.scope_kind==='op'&&M[x.scope]==null) M[x.scope]=0; });   // 자료에서 사라진 운영단위의 목표도 고칠 수 있어야 한다
  return Object.keys(M).sort((a,b)=>M[b]-M[a]||a.localeCompare(b));
}
const scKey=sc=>sc.kind==='all'?'all':(sc.kind==='region'?'r:'+sc.v:'o:'+sc.v);
const scOf=k=>!k||k==='all'?{kind:'all',v:''}:(k.slice(0,2)==='r:'?{kind:'region',v:k.slice(2)}:{kind:'op',v:k.slice(2)});
const scName=sc=>sc.kind==='all'?t('sc_all'):(sc.kind==='region'?(sc.v===KR?t('sc_kr'):sc.v===OS?t('sc_os'):sc.v):short(sc.v));
const rowSc=x=>({kind:x.scope_kind, v:x.scope});
function regionOfOp(op){ const x=RAW.INST.find(i=>i.op===op)||RAW.WK.find(i=>i.op===op); return GST.ORG.region(op)||(x?x.region:''); }
function fillScope(){
  const sel=document.getElementById('scope'), ops=opsList();
  sel.innerHTML='<option value="all">'+esc(t('sc_all'))+'</option><option value="r:'+esc(KR)+'">'+esc(t('sc_kr'))+'</option><option value="r:'+esc(OS)+'">'+esc(t('sc_os'))+'</option>'
    +'<optgroup label="'+esc(t('sc_ops'))+'">'+ops.map(o=>'<option value="o:'+esc(o)+'">'+esc(short(o))+'</option>').join('')+'</optgroup>';
  sel.value=scKey(S.sc);
}

function render(){
  const can=GST.targets.can()&&GST.targets.why==='', adm=GST.isAdmin&&GST.isAdmin();
  /* 띠 — 서버 사정은 관리자에게 원인까지, 그 밖에는 «읽기 전용»이라는 사실만 */
  const B=[];
  if(GST.targets.why==='no_table') B.push(adm?t('noTbl'):t('ro'));
  else if(GST.targets.why==='no_db') B.push(t('noDb'));
  else if(!can) B.push(t('ro'));
  document.getElementById('banners').innerHTML=B.map(s=>'<div class="ds-banner'+(GST.targets.why==='no_table'&&adm?' warn':'')+'"><span>'+esc(s)+'</span></div>').join('');
  drawEdit(can); drawAll();
}
function curVals(){
  const asOf=GST.ops.asOf(RAW);
  return GST.metrics.one(RAW, asOf, GST.metrics.okOf(S.sc), {actions:ACTS||undefined});
}
function bandTxt(mt){ const b=(GST.METRICS[mt]||{}).band||{}; return b.abs!=null?('±'+b.abs+((GST.METRICS[mt].unit==='pct')?v2t('u_pt'):GST.v2unit(mt))):('±'+Math.round((b.rel||0.1)*100)+'%'); }
function drawEdit(can){
  const box=document.getElementById('cEdit'), cur=curVals(), sc=S.sc;
  const pickSc=sc.kind==='op'?{op:sc.v, region:regionOfOp(sc.v)}:(sc.kind==='region'?{region:sc.v}:{});
  let h='<h2>'+esc(fmt(t('editT'),{s:scName(sc)}))+'<span class="s">'+esc(t('editS'))+'</span></h2>'
    +'<div class="ds-tbl-wrap"><table class="ds-tbl"><thead><tr><th>'+esc(t('c_m'))+'</th><th class="n">'+esc(t('c_now'))+'</th><th>'+esc(t('c_use'))+'</th>'
    +'<th style="min-width:90px">'+esc(t('c_tgt'))+'</th><th style="min-width:110px">'+esc(t('c_warn'))+'</th><th>'+esc(t('c_dir'))+'</th><th style="min-width:140px">'+esc(t('c_note'))+'</th><th></th></tr></thead><tbody>';
  GST.METRIC_ORDER.forEach(mt=>{
    const M=GST.METRICS[mt], ex=GST.targets.exact(mt, sc.kind, sc.kind==='all'?'':sc.v), use=GST.targets.pick(mt, pickSc);
    const v=cur.m[mt].v, st=GST.targets.judge(mt, v, use);
    const useTxt=use?(GST.v2fmt(mt,use.target)+GST.v2unit(mt)+' '+v2t(use.dir==='ge'?'tgt_ge':'tgt_le')+' · '+(ex?t('own'):fmt(t('inh'),{s:scName(rowSc(use))}))):t('none');
    const dir=ex?ex.dir:M.dir, ro=can?'':' readonly';
    h+='<tr data-m="'+mt+'"><td><b>'+esc(v2t('m_'+mt))+'</b><div class="ds-note">'+esc(v2t('d_'+mt))+'</div></td>'
      +'<td class="n"><span class="ds-kpi-t '+(st||'')+'">'+esc(GST.v2fmt(mt,v))+esc(v==null?'':GST.v2unit(mt))+'</span></td>'
      +'<td><span class="ds-note">'+esc(useTxt)+'</span></td>'
      +'<td><input class="ds-in" inputmode="decimal" data-f="target" value="'+(ex?esc(ex.target):'')+'" aria-label="'+esc(t('c_tgt'))+'"'+ro+'></td>'
      +'<td><input class="ds-in" inputmode="decimal" data-f="warn" value="'+(ex&&ex.warn!=null?esc(ex.warn):'')+'" placeholder="'+esc(t('warn_ph'))+'" title="'+esc(fmt(t('band'),{b:bandTxt(mt)}))+'" aria-label="'+esc(t('c_warn'))+'"'+ro+'></td>'
      +'<td><select class="ds-in" data-f="dir" aria-label="'+esc(t('c_dir'))+'"'+(can?'':' disabled')+'><option value="le"'+(dir==='le'?' selected':'')+'>'+esc(t('le'))+'</option><option value="ge"'+(dir==='ge'?' selected':'')+'>'+esc(t('ge'))+'</option></select></td>'
      +'<td><input class="ds-in" data-f="note" maxlength="300" value="'+(ex&&ex.note?esc(ex.note):'')+'" aria-label="'+esc(t('c_note'))+'"'+ro+'></td>'
      +'<td style="white-space:nowrap">'+(can?'<button type="button" class="ds-btn sm pri" data-act="save">'+esc(t('save'))+'</button> '
        +(ex?'<button type="button" class="ds-btn sm" data-act="rm">'+esc(t('remove'))+'</button>':''):'')+'</td></tr>';
  });
  box.innerHTML=h+'</tbody></table></div><div class="ds-note" id="editMsg" role="status"></div>';
  box.querySelectorAll('.ds-in').forEach(i=>i.addEventListener('input',()=>i.classList.add('dirty')));
  box.querySelectorAll('[data-act="save"]').forEach(b=>b.onclick=()=>save(b.closest('tr')));
  box.querySelectorAll('[data-act="rm"]').forEach(b=>b.onclick=()=>askRemove(b.closest('tr'), b));
}
function msg(s, bad){ const e=document.getElementById('editMsg'); if(e){ e.textContent=s; e.style.color=bad?'var(--bad)':''; } if(!bad&&GST.capToast) GST.capToast(s); }
const ERR=e=>({forbidden:t('e_forbidden'),login:t('e_login'),conflict:t('e_conflict'),no_db:t('e_noDb'),bad_warn:t('e_warn'),bad_target:t('e_num')})[e]||fmt(t('e_other'),{e:e});
async function save(tr){
  const mt=tr.dataset.m, g=f=>tr.querySelector('[data-f="'+f+'"]').value.trim(), sc=S.sc;
  const num=s=>{ if(s==='') return null; const n=GST.numv?GST.numv(s):Number(s); return isNaN(n)?NaN:n; };
  const tg=num(g('target')), wn=num(g('warn')), dir=g('dir');
  if(tg==null||isNaN(tg)) return msg(t('e_num'), true);
  if(wn!=null&&(isNaN(wn)||(dir==='le'&&wn<tg)||(dir==='ge'&&wn>tg))) return msg(t('e_warn'), true);
  const ex=GST.targets.exact(mt, sc.kind, sc.kind==='all'?'':sc.v);
  tr.querySelectorAll('button').forEach(b=>b.disabled=true);
  const r=await GST.targets.save({metric:mt, scope_kind:sc.kind, scope:sc.kind==='all'?'':sc.v, target:tg, warn:wn, dir:dir, note:g('note'), at:ex?ex.updated_at:null});
  if(r&&r.ok){ await GST.targets.load(); render(); msg(t('saved')); return; }
  if(r&&r.error==='conflict'){ await GST.targets.load(); render(); }
  else tr.querySelectorAll('button').forEach(b=>b.disabled=false);
  msg(ERR(r&&r.error), true);
}
/* 확인은 화면 안에서 — confirm() 은 셸 iframe 에서 막히는 환경이 있다 */
function askRemove(tr, btn){
  const cell=btn.parentElement, keep=cell.innerHTML;
  cell.innerHTML='<span class="ds-note">'+esc(t('rm_q'))+'</span> <button type="button" class="ds-btn sm" data-y>'+esc(t('yes'))+'</button> <button type="button" class="ds-btn sm ghost" data-n>'+esc(t('no'))+'</button>';
  cell.querySelector('[data-n]').onclick=()=>{ render(); };
  cell.querySelector('[data-y]').onclick=async ()=>{
    const mt=tr.dataset.m, sc=S.sc, ex=GST.targets.exact(mt, sc.kind, sc.kind==='all'?'':sc.v); if(!ex) return render();
    const r=await GST.targets.remove(ex.id, ex.updated_at);
    await GST.targets.load(); render();
    if(r&&r.ok) msg(t('removed')); else msg(ERR(r&&r.error), true);
  };
}
function drawAll(){
  const box=document.getElementById('cAll'), L=GST.targets.rows.slice().sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)));
  let h='<h2>'+esc(t('allT'))+'<span class="s">'+esc(t('allS'))+'</span></h2>';
  if(!L.length){ box.innerHTML=h+'<div class="ds-empty">'+esc(t('none'))+'</div>'; return; }
  h+='<div class="ds-tbl-wrap"><table class="ds-tbl"><thead><tr><th>'+esc(t('c_m'))+'</th><th>'+esc(t('c_sc'))+'</th><th class="n">'+esc(t('c_tgt'))+'</th><th class="n">'+esc(t('c_warn'))+'</th><th>'+esc(t('c_dir'))+'</th><th>'+esc(t('c_note'))+'</th><th>'+esc(t('c_by'))+'</th></tr></thead><tbody>'
    +L.map(x=>'<tr class="click" data-k="'+esc(scKey(rowSc(x)))+'" tabindex="0"><td>'+esc(v2t('m_'+x.metric))+'</td><td>'+esc(scName(rowSc(x)))+'</td>'
      +'<td class="n">'+esc(GST.v2fmt(x.metric,x.target))+esc(GST.v2unit(x.metric))+'</td><td class="n">'+(x.warn==null?'—':esc(GST.v2fmt(x.metric,x.warn)))+'</td>'
      +'<td>'+esc(t(x.dir))+'</td><td>'+esc(x.note||'')+'</td><td class="ds-note">'+esc([x.updated_by, String(x.updated_at||'').slice(0,16).replace('T',' ')].filter(Boolean).join(' · '))+'</td></tr>').join('')
    +'</tbody></table></div>';
  box.innerHTML=h;
  box.querySelectorAll('tr[data-k]').forEach(tr=>{ const go=()=>{ S.sc=scOf(tr.dataset.k); fillScope(); render(); window.scrollTo({top:0,behavior:'smooth'}); };
    tr.onclick=go; tr.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } }; });
}

function status(s, err){ const e=document.getElementById('status'); e.textContent=s; e.classList.toggle('err',!!err); }
function applyLang(){
  document.documentElement.lang=LANG;
  try{ GST.applyI18n && GST.applyI18n(t, LANG); }catch(e){ document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent=t(el.dataset.i); }); }
  if(RAW){ fillScope(); render(); }
}
window.setLang=function(l){ if(T[l]){ LANG=l; applyLang(); } };
document.getElementById('scope').addEventListener('change',e=>{ S.sc=scOf(e.target.value); render(); });
document.getElementById('goHome').onclick=()=>{ location.href='https://gstcsglobal-cloud.github.io/home/'; };
window.addEventListener('gst-role',()=>{ if(RAW) render(); });
window.addEventListener('message',e=>{ const d=e.data||{}; if(d.type==='gst-lang'&&T[d.lang]){ LANG=d.lang; applyLang(); } });
applyLang();
window.loadData=load;
load().catch(e=>{ console.error('[targets] 읽기 실패', e); status((GST.failNote?GST.failNote(e):String(e&&e.message||e)), true); });
</script>
<script>GST.initSync();</script>
</body>
</html>
