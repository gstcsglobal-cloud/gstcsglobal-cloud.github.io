<title>S6 — 스크러버·칠러 만담</title>
<!--
  S6 만담 장면 — 스크러버와 칠러가 「오늘 무슨 일 있었어?」 / 「아니.」 를 주고받는다.
  결과물은 ../footage/s6_banter.webm 하나다.

  ⚠ 재질·조명·부품(cabinet/louvered/signalTower/screen)은 scene3d.html 과 «같은 규약»이다.
     여기서 따로 예쁘게 만들면 한 영상 안에서 같은 스크러버가 두 모습으로 보인다.

  v24 «진중판» (사내 피드백 「유치뽕짝」 대응 · 사용자 지시 「씬의 의도를 살려 진중하게」):
    · 웃는 눈·입 → HMI 트렌드 화면. 평평한 트렌드 라인이 곧 «아무 일 없음»의 시각화다 —
      말할 때만 그 선이 목소리처럼 잔물결친다(기계는 화면으로 말한다).
    · 몸짓(으쓱·끄덕·놀람) 제거 — 미세한 idle 숨쉬기만 남긴다. 정지가 진중함이다.
    · 말풍선은 여기서 굽지 않는다 — scene.html 의 다크 글래스 오버레이가 전담한다(v23).
      BEATS 는 «발화 타이밍»으로만 쓴다(HMI 리플·scene 쪽 큐의 정본).
    · 조명 쿨톤·감광, 캐비닛 채도 다운 — 새벽 관제의 온도.
  ⚠ 화면의 상태 표기는 일반 문구만(«SYSTEM STATUS»·«NORMAL») — 실데이터·수치 금지(공개 저장소).
  ⚠ 구도 규약(서브팹 배경·투샷·기계가 화면을 채움)은 유지 — 허전함이 «촌스러움»의 절반이었다.
  ⚠ seek(t) 는 t 만의 함수여야 한다 — rAF·Math.random() 금지(같은 프레임이 늘 같아야 캡처가 된다).
-->

<script type="module">
import * as THREE from 'three';
const W=1920,H=1080, DUR=6.4;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const p=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c=1.70158+1, s=1.70158; return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2);};  // 살짝 튀는 등장
const lerp=(a,b,x)=>a+(b-a)*x;
// 결정적 난수 — Math.random() 을 쓰면 프레임마다 먼지가 튄다
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const S=new THREE.Scene();
S.background=new THREE.Color('#05091a');
S.fog=new THREE.Fog(0x05091a,8,20);   // v24: 안개를 당겨 원경을 눌러 앉힌다 — 새벽 관제 톤

R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=0.88;   // v24: 1.15 → 감광(실란 씬 기준으로 한 단계 더)
document.body.appendChild(R.domElement);

// 반사용 간이 환경맵 — 금속·도장면이 «무엇인가를 비추고» 있어야 사진처럼 보인다
function makeEnv(){
  const size=64, faces=[];
  for(let i=0;i<6;i++){
    const c=document.createElement('canvas'); c.width=c.height=size;
    const g=c.getContext('2d'), gr=g.createLinearGradient(0,0,0,size);
    if(i===2){ gr.addColorStop(0,'#eaf1ff'); gr.addColorStop(1,'#9fb4d6'); }
    else if(i===3){ gr.addColorStop(0,'#141a2b'); gr.addColorStop(1,'#070d1f'); }
    else { gr.addColorStop(0,'#c4d3ee'); gr.addColorStop(.5,'#6b7d9e'); gr.addColorStop(1,'#1d2436'); }
    g.fillStyle=gr; g.fillRect(0,0,size,size); faces.push(c);
  }
  const t=new THREE.CubeTexture(faces); t.needsUpdate=true; return t;
}
const ENV=makeEnv();
const bodyMat=(color,o={})=>new THREE.MeshPhysicalMaterial({color,
  roughness:o.roughness??0.42, metalness:o.metalness??0.2, clearcoat:0.35, clearcoatRoughness:0.28,
  envMap:ENV, envMapIntensity:0.7});
const metalMat=(color,r=0.3,m=0.75)=>new THREE.MeshStandardMaterial({color,roughness:r,metalness:m,envMap:ENV,envMapIntensity:0.9});

// ── 조명: 영상 팔레트(짙은 남색 + CI 파랑 림)에 맞춘다.
//    v24: 웜 키라이트가 «친근한 장난감» 인상의 절반이었다 — 쿨톤으로 바꾸고 전체를 줄인다.
//    림은 오히려 키운다(어두운 방의 푸른 윤곽 = 시네마틱).
S.add(new THREE.HemisphereLight(0xbcd2ff,0x0b1224,0.46));
const key=new THREE.DirectionalLight(0xcfe0ff,1.35); key.position.set(6,10,7); key.castShadow=true;
key.shadow.mapSize.set(1536,1536);
{ const s=key.shadow.camera; s.left=-8;s.right=8;s.top=9;s.bottom=-3;s.near=1;s.far=40; key.shadow.bias=-0.0018; }
S.add(key);
const fill=new THREE.DirectionalLight(0x9fc4ff,0.30); fill.position.set(-8,5,-4); S.add(fill);
const rim =new THREE.DirectionalLight(0x5c8cff,1.45); rim.position.set(-5,6,-9); S.add(rim);
const rim2=new THREE.DirectionalLight(0x6fa8ff,0.85); rim2.position.set(6,4,-8); S.add(rim2);

// ── 바닥
const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),
  new THREE.MeshStandardMaterial({color:0x070d1c,roughness:0.40,metalness:0.45,envMap:ENV,envMapIntensity:0.40}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; S.add(floor);
const grid=new THREE.GridHelper(120,120,0x1b2a55,0x111c3a); grid.position.y=0.003;
grid.material.transparent=true; grid.material.opacity=0.38; S.add(grid);
const plate=new THREE.Mesh(new THREE.CircleGeometry(4.6,64),
  new THREE.MeshStandardMaterial({color:0x081020,roughness:0.30,metalness:0.58,envMap:ENV,envMapIntensity:0.45}));
plate.rotation.x=-Math.PI/2; plate.position.y=0.004; plate.receiveShadow=true; S.add(plate);

// ── 배경: 서브팹 파이프랙 · 케이블 트레이 · 원경 캐비닛.
//    ⚠ 빈 바닥이 «허접함»의 절반이었다. 안개에 묻히는 원경이라 비용은 거의 안 든다.
{
  const BG=new THREE.Group(); BG.position.z=-7.6; S.add(BG);
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(52,16),
    new THREE.MeshStandardMaterial({color:0x080d1a,roughness:0.95,metalness:0.05}));
  wall.position.set(0,7,-2.4); BG.add(wall);
  for(let i=-7;i<=7;i++){
    const pipe=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,8.4,8),metalMat(0x212938,0.55,0.45));
    pipe.position.set(i*1.75+(i%2?0.25:0),4.2,-1.1); BG.add(pipe);
  }
  // ⚠ 트레이는 y 4.3 위로 — 옛 판은 3.05 라 두 얼굴 «뒤»를 가로질러 화면이 어수선했다
  for(const y of [4.30,4.92]){
    const tray=new THREE.Mesh(new THREE.BoxGeometry(26,0.10,0.42),metalMat(0x2a3245,0.6,0.45));
    tray.position.set(0,y,-0.55); BG.add(tray);
    for(let i=0;i<3;i++){
      const c=new THREE.Mesh(new THREE.CylinderGeometry(0.030,0.030,26,6),metalMat(0x18202e,0.85,0.15));
      c.rotation.z=Math.PI/2; c.position.set(0,y+0.09,-0.55+i*0.12); BG.add(c);
    }
  }
  [[-6.6,1.5,0.9],[-4.6,1.1,0.7],[4.9,1.35,0.85],[7.0,1.6,1.0],[9.1,1.2,0.75]].forEach(([x,h,w])=>{
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.7),
      new THREE.MeshStandardMaterial({color:0x131b2c,roughness:0.7,metalness:0.25,envMap:ENV,envMapIntensity:0.3}));
    b.position.set(x,h/2,0.2); BG.add(b);
  });
}
// 광선(라이트 샤프트) — 위에서 내려오는 빛 두 줄기. 공간에 «공기»가 생긴다
const SHAFTS=[];
[[-3.6,-3.2],[3.8,-2.6]].forEach(([x,z])=>{
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.10,1.5,7.0,18,1,true),
    new THREE.MeshBasicMaterial({color:0x7fb0ff,transparent:true,opacity:0.026,depthWrite:false,
      side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));
  m.position.set(x,3.4,z); m.rotation.z=(x<0?1:-1)*0.05; S.add(m); SHAFTS.push(m);
});
// 먼지 — 결정적 위치 + 느린 표류
const DN=170, DBASE=[], dgeo=new THREE.BufferGeometry(), dpos=new Float32Array(DN*3);
{ const rnd=mulberry(20260913);
  for(let i=0;i<DN;i++) DBASE.push({x:(rnd()-.5)*13,y:rnd()*4.4+0.15,z:(rnd()-.5)*8-1.2,s:0.25+rnd()*0.55,ph:rnd()*6.283}); }
dgeo.setAttribute('position',new THREE.BufferAttribute(dpos,3));
const DUST=new THREE.Points(dgeo,new THREE.PointsMaterial({color:0xa7c6ff,size:0.035,transparent:true,
  opacity:0.30,depthWrite:false,sizeAttenuation:true})); S.add(DUST);

// ── 부품 (scene3d.html 과 같은 규약)
function cabinet(w,h,d,color,o={}){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bodyMat(color,o));
  b.castShadow=b.receiveShadow=true; b.position.y=h/2; g.add(b);
  const seam=new THREE.Mesh(new THREE.BoxGeometry(0.008,h*0.92,0.008),new THREE.MeshStandardMaterial({color:0x9098a8,roughness:0.6}));
  seam.position.set(0,h/2,d/2+0.005); g.add(seam);
  const foot=new THREE.Mesh(new THREE.BoxGeometry(w*1.03,0.07,d*1.03),metalMat(0x161b28,0.55,0.35));
  foot.position.y=0.035; foot.receiveShadow=true; g.add(foot);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(w*1.01,0.03,d*1.01),bodyMat(0xccd5e3,{roughness:0.35}));
  cap.position.y=h+0.015; g.add(cap);
  return g;
}
function louvered(w,h,color){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(w,h,0.03),bodyMat(color,{roughness:0.55})));
  const cav=new THREE.Mesh(new THREE.BoxGeometry(w*0.92,h*0.92,0.01),new THREE.MeshStandardMaterial({color:0x0c101a,roughness:0.9}));
  cav.position.z=0.012; g.add(cav);
  for(let i=0,n=Math.floor(h*0.9/0.045);i<n;i++){
    const bar=new THREE.Mesh(new THREE.BoxGeometry(w*0.86,0.012,0.035),metalMat(0x2a3040,0.5,0.4));
    bar.position.set(0,-h*0.44+i*0.045,0.02); g.add(bar);
  }
  return g;
}
function signalTower(store){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.05,0.03,12),metalMat(0x1c2230)));
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.22,10),metalMat(0x242b3a)); pole.position.y=0.13; g.add(pole);
  [0xff3b3b,0xffd23b,0x3bff6a].forEach((c,i)=>{
    const m=new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:0.2,roughness:0.35,transparent:true,opacity:0.95});
    const l=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.06,14),m);
    l.position.y=0.07+i*0.068; g.add(l); store.push({m,idx:i});
  });
  return g;
}
function panel(w,h){  // 작은 조작 패널(얼굴이 아니다)
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.015),
    new THREE.MeshStandardMaterial({color:0x06101c,emissive:0x0d3a5c,emissiveIntensity:0.7,roughness:0.25,envMap:ENV,envMapIntensity:0.4}));
  const bz=new THREE.Mesh(new THREE.BoxGeometry(w*1.15,h*1.2,0.01),metalMat(0x161b26,0.5,0.3)); bz.position.z=-0.005; m.add(bz);
  return m;
}

// ── HMI 모니터 (v24 — 옛 «얼굴»의 자리). 평평한 트렌드 라인이 «아무 일 없음»의 시각화다.
//    말할 때만 그 선이 목소리처럼 잔물결친다 — 기계는 화면으로 말한다.
//    상태는 전부 인자로 받는다(내부에 시간이 없다) — seek(t) 결정성을 깨지 않기 위해.
//    st = { tt(시각) · talk(발화 포락선 0~1) · blink(리프레시 스윕 0~1) }
function makeFace(w,h,px,accCol){
  const c=document.createElement('canvas'); c.width=px; c.height=Math.round(px*h/w);
  const g=c.getContext('2d');
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  const bz=new THREE.Mesh(new THREE.BoxGeometry(w*1.12,h*1.20,0.022),metalMat(0x141a26,0.5,0.35));
  bz.position.z=-0.014; mesh.add(bz);
  const CW=c.width, CH=c.height;
  mesh.userData.draw=function(st){
    g.clearRect(0,0,CW,CH);
    g.fillStyle='#030810'; g.fillRect(0,0,CW,CH);
    const vg=g.createRadialGradient(CW/2,CH/2,CH*0.1,CW/2,CH/2,CH*0.95);
    vg.addColorStop(0,'rgba(24,58,104,0.30)'); vg.addColorStop(1,'rgba(3,8,16,0)');
    g.fillStyle=vg; g.fillRect(0,0,CW,CH);
    // 그리드 — 옅은 계기판 눈금
    g.strokeStyle='rgba(120,168,232,0.10)'; g.lineWidth=1;
    for(let i=1;i<5;i++){ g.beginPath(); g.moveTo(CW*0.06,CH*0.30+i*CH*0.13); g.lineTo(CW*0.94,CH*0.30+i*CH*0.13); g.stroke(); }
    for(let i=0;i<=8;i++){ const x=CW*0.06+i*CW*0.11; g.beginPath(); g.moveTo(x,CH*0.30); g.lineTo(x,CH*0.86); g.stroke(); }
    // 헤더 — 일반 문구만(실데이터 금지)
    g.textBaseline='middle'; g.textAlign='left';
    g.font=`700 ${Math.round(CW*0.048)}px NotoKR, sans-serif`;
    g.fillStyle='rgba(140,190,255,0.75)'; g.fillText('SYSTEM STATUS', CW*0.06, CH*0.155);
    g.textAlign='right';
    g.fillStyle='#59d98a'; g.fillText('NORMAL', CW*0.94, CH*0.155);
    g.save(); g.shadowColor='#3ee07c'; g.shadowBlur=CW*0.02; g.fillStyle='#3ee07c';
    g.beginPath(); g.arc(CW*0.94-g.measureText('NORMAL').width-CW*0.035, CH*0.155, CW*0.013, 0, 6.283); g.fill();
    g.restore();
    // 트렌드 라인 — 평상시 플랫, 발화 중에는 음성 잔물결
    const ly=CH*0.585;
    g.save(); g.shadowColor=accCol; g.shadowBlur=CW*0.022;
    g.strokeStyle=accCol; g.lineWidth=Math.max(2,CW*0.007); g.lineCap='round'; g.beginPath();
    for(let i=0;i<=64;i++){
      const fx=i/64, x=CW*0.06+fx*CW*0.88;
      const win=Math.sin(fx*Math.PI);                       // 가장자리는 늘 평평 — 계기판답게
      const y=ly + st.talk*win*( Math.sin(fx*34+st.tt*21)*0.55 + Math.sin(fx*57+st.tt*33)*0.45 )*CH*0.075;
      i?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.stroke(); g.restore();
    // 느린 스위프 커서 — «지켜보고 있다»는 표식
    const sx=CW*0.06+((st.tt*0.055)%1)*CW*0.88;
    g.fillStyle='rgba(150,200,255,0.20)'; g.fillRect(sx,CH*0.30,Math.max(1.5,CW*0.004),CH*0.56);
    // 리프레시 스윕(옛 blink 시각 재사용) — 밝은 가로선이 스치듯 지나간다
    if(st.blink>0.02){ g.globalAlpha=0.16*st.blink; g.fillStyle='#cfe4ff';
      g.fillRect(0,CH*(0.30+0.56*(1-st.blink)),CW,2); g.globalAlpha=1; }
    g.globalAlpha=0.05; g.fillStyle='#ffffff';            // 스캔라인 — «디스플레이»로 읽히게
    for(let y=0;y<CH;y+=4) g.fillRect(0,y,CW,1);
    g.globalAlpha=1;
    tex.needsUpdate=true;
  };
  return mesh;
}

// ── 스크러버 (GAIA 계열 외형) — 덩치 큰 쪽, 무뚝뚝한 고참
const SLAMP=[], CLAMP=[];
function buildScrubber(){
  const g=new THREE.Group();
  g.add(cabinet(1.02,1.86,0.82,0xc2ccdc,{roughness:0.4}));
  const bb=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.26,0.46),bodyMat(0xaab5c8,{roughness:0.5}));
  bb.position.set(0.08,2.01,0.03); bb.castShadow=true; g.add(bb);
  [[-0.14,0.1],[0.05,0.1],[0.23,0.1],[-0.03,-0.09],[0.18,-0.09]].forEach(([a,b])=>{
    const pi=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.2,14),metalMat(0x99a3b4,0.28,0.65));
    pi.position.set(0.08+a,2.24,0.03+b); pi.castShadow=true; g.add(pi);
  });
  const lv=louvered(0.62,0.5,0xb6c0d1); lv.rotation.y=Math.PI/2; lv.position.set(-0.515,0.42,-0.05); g.add(lv);
  const pn=panel(0.17,0.12); pn.position.set(0.33,0.95,0.417); g.add(pn);
  const tw=signalTower(SLAMP); tw.position.set(-0.40,1.86,0.28); g.add(tw);
  const f=makeFace(0.68,0.42,512,'#8ec0ff'); f.position.set(0,1.50,0.418); g.add(f);
  g.userData.face=f;
  return g;
}
// ── 칠러 (EES 계열 외형) — 작은 쪽, 말 많은 후배
function buildChiller(){
  const g=new THREE.Group();
  g.add(cabinet(0.70,1.52,0.58,0xbac5d7,{roughness:0.4}));
  const top=new THREE.Mesh(new THREE.BoxGeometry(0.70,0.20,0.58),bodyMat(0xc6d0e0,{roughness:0.38}));
  top.position.y=1.62; top.rotation.x=-0.1; top.castShadow=true; g.add(top);
  const lv=louvered(0.80,0.60,0xacb7c9); lv.rotation.y=Math.PI/2; lv.position.set(0.355,0.46,0); g.add(lv);
  const pn=panel(0.13,0.10); pn.position.set(0.20,0.88,0.297); g.add(pn);
  const tw=signalTower(CLAMP); tw.position.set(-0.24,1.55,0.18); tw.scale.setScalar(0.8); g.add(tw);
  const f=makeFace(0.53,0.33,400,'#8fe9ff'); f.position.set(0,1.21,0.298); g.add(f);
  g.userData.face=f;
  return g;
}

// ── 배치. «대화 구도»라 서로 안쪽으로 조금 돌려 세운다.
//    피벗 그룹을 따로 두는 이유: 기울이기·끄덕이기를 «발밑»을 축으로 걸어야 기계가 떠 보이지 않는다.
const SCRUB=buildScrubber(), CHILL=buildChiller();
const SP=new THREE.Group(); SP.position.set(-0.99,0,0.10); SP.add(SCRUB); S.add(SP);
const CP=new THREE.Group(); CP.position.set( 1.13,0,0.22); CP.add(CHILL); S.add(CP);


// ── 대사. 4박자 — 질문 · 무뚝뚝한 대답 · 짚어주기 · 펀치라인.
//    ⚠ 펀치는 「아무 일도 없었다」를 «자랑»으로 뒤집는 자리다(영상 전체의 주제 그대로).
const BEATS=[
  { who:'C', on:0.50, off:1.82, ko:'오늘 무슨 일\n있었어?',  en:'Anything happen today?' },
  { who:'S', on:1.96, off:2.88, ko:'아니.',                  en:'Nope.' },
  { who:'C', on:3.02, off:4.34, ko:'25년째\n그 대답이야.',   en:'Same answer for 25 years.' },
  { who:'S', on:4.48, off:6.06, ko:'그게\n내 일이거든.',     en:"Yeah. That's my job." },
];

// 화면 위 머리글 — 3D 스프라이트가 아니라 HTML 이어야 또렷하다
const HUD=document.createElement('div');
HUD.style.cssText='position:absolute;left:0;top:56px;width:1920px;text-align:center;font-family:NotoKR,sans-serif;opacity:0';
HUD.innerHTML='<div style="font-weight:700;font-size:25px;color:#8aa0c8;letter-spacing:3px">S C R U B B E R　·　C H I L L E R</div>'+
  '<div style="font-weight:900;font-size:52px;color:#eaf2ff;margin-top:12px">25년째 같은 자리.</div>';
document.body.appendChild(HUD);

// 깜빡임은 «정해진 시각»에만 — 난수를 쓰면 프레임마다 달라진다
const BLINK={ S:[0.30,1.55,3.35,5.55], C:[0.85,2.35,4.10,5.90] };
const blinkAt=(t,who)=>{ let b=0; for(const s of BLINK[who]) b=Math.max(b,1-clamp(Math.abs(t-s)/0.10,0,1)); return b; };
// 말하는 동안의 «음절» 포락선 — 입과 끄덕임이 같은 파형을 쓴다(따로 만들면 입만 따로 논다)
const syl=t=>clamp(Math.abs(Math.sin(t*17.5))*0.72+Math.abs(Math.sin(t*27.3))*0.28,0,1);

function seek(t){
  t=clamp(t,0,DUR);

  // ── 카메라: 투샷으로 크게 잡고 아주 천천히 민다. 펀치라인에서 한 번 «툭» 다가간다.
  // v24: 피사체를 «오른쪽»으로 —  실란·칠러 씬과 같은 구도 언어(왼쪽 글자 · 오른쪽 피사체).
  //   DX 는 «횡이동»이라 카메라와 주시점을 같이 옮긴다(한쪽만 옮기면 원근이 비틀린다).
  //   펀치라인 푸시인(4.40~)은 뺐다 — 대사 연출이 사라졌으므로 한 벌의 느린 전진만 남는다.
  const DX=-0.92;
  const push=eo(p(t,0,DUR))*0.22;
  const rad=5.62-push, ang=lerp(-0.10,0.085,eio(t/DUR)), hy=lerp(1.60,1.46,eio(t/DUR));
  C.position.set(Math.sin(ang)*rad+0.06+DX, hy, Math.cos(ang)*rad);
  C.lookAt(0.04+DX, 1.14, 0.16);

  // ── 누가 말하고 있나
  let cur=null; for(const B of BEATS) if(t>=B.on-0.10 && t<B.off-0.18) cur=B;
  const talkS=cur&&cur.who==='S', talkC=cur&&cur.who==='C';
  const env=cur?syl(t-cur.on)*clamp(p(t,cur.on,cur.on+0.10),0,1)*(1-p(t,cur.off-0.30,cur.off-0.18)):0;

  // ── 몸짓 (v24): 미세한 idle 숨쉬기만 — 으쓱·끄덕·놀람은 전부 뺐다. 정지가 진중함이다.
  SP.position.y = Math.sin(t*1.55)*0.011;
  SP.rotation.z = -0.009*Math.sin(t*1.15);
  SP.rotation.x =  0.004*Math.sin(t*1.4);
  SP.rotation.y =  0.40;
  SCRUB.scale.set(1,1,1);

  CP.position.y = Math.sin(t*1.85+1.7)*0.012;
  CP.rotation.z =  0.010*Math.sin(t*1.35+0.8);
  CP.rotation.x =  0.005*Math.sin(t*1.7+2.1);
  CP.rotation.y = -0.40;

  // ── HMI — 발화 중에만 트렌드가 잔물결친다(누가 말하는지는 화면이 말한다)
  SCRUB.userData.face.userData.draw({ tt:t, talk: talkS?env:0, blink: blinkAt(t,'S') });
  CHILL.userData.face.userData.draw({ tt:t, talk: talkC?env:0, blink: blinkAt(t,'C') });

  // ── 신호탑: 초록만 천천히 숨쉰다 — «정상 가동»의 맥박. 축하 점멸은 뺐다(v24).
  SLAMP.forEach(l=>{ l.m.emissiveIntensity = l.idx===2 ? 0.40+0.20*Math.sin(t*1.5) : 0.10; });
  CLAMP.forEach(l=>{ l.m.emissiveIntensity = l.idx===2 ? 0.38+0.20*Math.sin(t*1.5+1.1) : 0.10; });

  // ── 먼지 · 광선 · HUD
  for(let i=0;i<DN;i++){ const d=DBASE[i];
    dpos[i*3  ]=d.x+Math.sin(t*d.s*0.7+d.ph)*0.09;
    dpos[i*3+1]=d.y+Math.sin(t*d.s    +d.ph)*0.13;
    dpos[i*3+2]=d.z+Math.cos(t*d.s*0.6+d.ph)*0.07; }
  dgeo.attributes.position.needsUpdate=true;
  SHAFTS.forEach((m,i)=>{ m.material.opacity=0.026+0.009*Math.sin(t*0.9+i*2.1); });
  HUD.style.opacity=String(Math.min(p(t,0.12,0.52), 1-p(t,2.25,2.70)));

  R.render(S,C);
}
window.seek=seek; window.DUR3D=DUR;

await document.fonts.load('700 46px NotoKR'); await document.fonts.load('400 22px NotoKR');
await document.fonts.load('900 52px NotoKR'); await document.fonts.ready;
// v24: 말풍선은 여기서 굽지 않는다 — 대사는 scene.html 의 교신 콘솔 오버레이가 그린다.
//      BEATS 는 발화 타이밍(HMI 리플)의 정본으로만 남는다.
seek(0); window.__ready=true;
</script></body></html>
