<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>S8 — 경보와 작업자(도열 · 적색 경광등 · 점검)</title>
<!--
  S8 «경보와 작업자» — 도열한 설비 중 «한 대»에 적색 경광등이 돌고, 작업자 2인이 그 앞에서
  점검한다. 결과물은 ../footage/s8_alarm.webm 하나다. 길이 6.4초(= s6 슬롯 그대로 갈아끼움).

  사용자 지시(v24): 「도열되어 있는 설비들이 있고 설비 한 대에 경보가 울리는 상황(경광등 빨강)에
    작업자 2인이 설비 점검을 취하는 모습」. s7(전부 정상인 도열)과 «같은 세계»를 쓰되 사건이 있다.

  ⚠ 이 씬이 영상의 논리를 완성한다 — 경보는 «울렸고», 사람이 갔고, 그래서 «아무 일도 없었다».
     경보를 아예 안 보여 주면 「아무 일 없음」이 저절로 된 것처럼 읽힌다.
  ⚠ 적색은 «이 장면의 유일한 난색»이다. 다른 곳에 빨강을 더하지 말 것 — 시선이 갈라진다.
  ⚠ 사람이 «크기 자»다. 설비만 있으면 장난감으로 보인다(scene3d.html 의 같은 규약).

  ⚠ 재질·부품(cabinet/louvered/signalTower/screen)은 scene3d.html · s6.html 과 «같은 규약»이다.
     여기서만 다르게 만들면 한 영상 안에서 같은 스크러버가 두 모습으로 보인다.
  ⚠ 구도 규약 — 왼쪽 40%는 «비운다». 실란·칠러 씬과 같은 «왼쪽 글자 · 오른쪽 피사체»여야
     한 영상 안에서 조판이 따로 놀지 않는다. 자막은 3D 에 굽지 않는다(scene.html 이 그린다).
  ⚠ seek(t) 는 t 만의 함수여야 한다 — rAF·Math.random() 금지(같은 프레임이 늘 같아야 캡처가 된다).
-->
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#05091a}
canvas{display:block}
</style></head><body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const W=1920,H=1080, DUR=6.4;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const p=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,x)=>a+(b-a)*x;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const S=new THREE.Scene();
S.background=new THREE.Color('#05091a');
// 안개가 이 장면의 «규모»를 만든다 — 줄의 끝을 감춰야 «끝이 안 보인다»로 읽힌다
S.fog=new THREE.Fog(0x05091a,7,34);
const C=new THREE.PerspectiveCamera(34,W/H,0.1,140);
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
R.setSize(W,H); R.setPixelRatio(1);
R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=0.88;
document.body.appendChild(R.domElement);

function makeEnv(){
  const size=64, faces=[];
  for(let i=0;i<6;i++){
    const c=document.createElement('canvas'); c.width=c.height=size;
    const g=c.getContext('2d'), gr=g.createLinearGradient(0,0,0,size);
    if(i===2){ gr.addColorStop(0,'#dce6f8'); gr.addColorStop(1,'#8fa5c8'); }
    else if(i===3){ gr.addColorStop(0,'#111726'); gr.addColorStop(1,'#05091a'); }
    else { gr.addColorStop(0,'#b3c4e2'); gr.addColorStop(.5,'#5e7092'); gr.addColorStop(1,'#171e2e'); }
    g.fillStyle=gr; g.fillRect(0,0,size,size); faces.push(c);
  }
  const t=new THREE.CubeTexture(faces); t.needsUpdate=true; return t;
}
const ENV=makeEnv();
const bodyMat=(color,o={})=>new THREE.MeshPhysicalMaterial({color,
  roughness:o.roughness??0.42, metalness:o.metalness??0.2, clearcoat:0.35, clearcoatRoughness:0.28,
  envMap:ENV, envMapIntensity:0.7});
const metalMat=(color,r=0.3,m=0.75)=>new THREE.MeshStandardMaterial({color,roughness:r,metalness:m,envMap:ENV,envMapIntensity:0.9});

// ── 조명 (s6 v24 와 같은 온도 — 새벽 관제)
S.add(new THREE.HemisphereLight(0xbcd2ff,0x0b1224,0.42));
const key=new THREE.DirectionalLight(0xcfe0ff,1.15); key.position.set(7,12,9); key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
{ const s=key.shadow.camera; s.left=-14;s.right=14;s.top=12;s.bottom=-4;s.near=1;s.far=60; key.shadow.bias=-0.0018; }
S.add(key);
const fill=new THREE.DirectionalLight(0x9fc4ff,0.26); fill.position.set(-9,6,4); S.add(fill);
// 림 둘 — 어두운 복도에서 «윤곽»이 사는 것이 이 장면 퀄리티의 절반이다
const rim =new THREE.DirectionalLight(0x5c8cff,1.55); rim.position.set(-6,7,-12); S.add(rim);
const rim2=new THREE.DirectionalLight(0x6fa8ff,0.95); rim2.position.set(9,5,-10); S.add(rim2);

// ── 바닥 · 통로
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({color:0x070d1c,roughness:0.34,metalness:0.52,envMap:ENV,envMapIntensity:0.45}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; S.add(floor);
const grid=new THREE.GridHelper(200,200,0x1b2a55,0x111c3a); grid.position.y=0.003;
grid.material.transparent=true; grid.material.opacity=0.30; S.add(grid);
// 통로 유도선 — 바닥에 «공장»의 기호를 하나만 둔다(많으면 어수선하다)
for(const x of [0.55,1.05]){
  const ln=new THREE.Mesh(new THREE.PlaneGeometry(0.05,120),
    new THREE.MeshBasicMaterial({color:0x2c4a86,transparent:true,opacity:0.30}));
  ln.rotation.x=-Math.PI/2; ln.position.set(x,0.006,-48); S.add(ln);
}

// ── 부품 (scene3d.html · s6.html 과 같은 규약)
function cabinet(w,h,d,color,o={}){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bodyMat(color,o));
  b.castShadow=b.receiveShadow=true; b.position.y=h/2; g.add(b);
  const seam=new THREE.Mesh(new THREE.BoxGeometry(0.008,h*0.92,0.008),new THREE.MeshStandardMaterial({color:0x7d8699,roughness:0.6}));
  seam.position.set(0,h/2,d/2+0.005); g.add(seam);
  const foot=new THREE.Mesh(new THREE.BoxGeometry(w*1.03,0.07,d*1.03),metalMat(0x161b28,0.55,0.35));
  foot.position.y=0.035; foot.receiveShadow=true; g.add(foot);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(w*1.01,0.03,d*1.01),bodyMat(0xb4bfd2,{roughness:0.35}));
  cap.position.y=h+0.015; g.add(cap);
  return g;
}
function louvered(w,h,color){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(w,h,0.03),bodyMat(color,{roughness:0.55})));
  const cav=new THREE.Mesh(new THREE.BoxGeometry(w*0.92,h*0.92,0.01),new THREE.MeshStandardMaterial({color:0x0c101a,roughness:0.9}));
  cav.position.z=0.012; g.add(cav);
  for(let i=0,n=Math.floor(h*0.9/0.05);i<n;i++){
    const bar=new THREE.Mesh(new THREE.BoxGeometry(w*0.86,0.012,0.035),metalMat(0x2a3040,0.5,0.4));
    bar.position.set(0,-h*0.44+i*0.05,0.02); g.add(bar);
  }
  return g;
}
const LAMPS=[], REDS=[];
function signalTower(idx, alarm){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.05,0.03,10),metalMat(0x1c2230)));
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.20,8),metalMat(0x242b3a)); pole.position.y=0.12; g.add(pole);
  // ⚠ 꺼진 렌즈는 «어두운 색»이어야 한다 — 원색으로 두면 장난감 신호등이 된다(실측: 적·황이 화면에서 튀었다)
  [[0x3a1414,0xff3b3b],[0x3a3214,0xffd23b],[0x14401f,0x3bff6a]].forEach(([off,on],i)=>{
    const m=new THREE.MeshStandardMaterial({color:i===2?on:off,emissive:i===2?on:0x000000,emissiveIntensity:0.1,roughness:0.45});
    const l=new THREE.Mesh(new THREE.CylinderGeometry(0.048,0.048,0.055,12),m);
    l.position.y=0.065+i*0.062; g.add(l);
    if(alarm){ if(i===0) REDS.push(m); if(i===2){ m.emissive.setHex(0x0a1a0f); m.emissiveIntensity=0.05; } }
    else if(i===2) LAMPS.push({m,idx});   // 초록만 살아 있다 — «정상»의 맥박
  });
  return g;
}
// HMI — 도열 거리에서는 «평평한 선 + 초록 점»만 읽힌다. 캔버스 하나를 모두가 공유한다(비용).
const HMI=(()=>{
  const c=document.createElement('canvas'); c.width=256; c.height=160;
  const g=c.getContext('2d');
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true});
  function draw(t){
    g.clearRect(0,0,256,160);
    g.fillStyle='#030810'; g.fillRect(0,0,256,160);
    const vg=g.createRadialGradient(128,80,12,128,80,140);
    vg.addColorStop(0,'rgba(24,58,104,0.34)'); vg.addColorStop(1,'rgba(3,8,16,0)');
    g.fillStyle=vg; g.fillRect(0,0,256,160);
    g.strokeStyle='rgba(120,168,232,0.11)'; g.lineWidth=1;
    for(let i=1;i<4;i++){ g.beginPath(); g.moveTo(16,44+i*26); g.lineTo(240,44+i*26); g.stroke(); }
    for(let i=0;i<=6;i++){ const x=16+i*37.3; g.beginPath(); g.moveTo(x,40); g.lineTo(x,136); g.stroke(); }
    g.save(); g.shadowColor='#8ec0ff'; g.shadowBlur=7; g.strokeStyle='#8ec0ff'; g.lineWidth=3;
    g.beginPath(); g.moveTo(16,92); g.lineTo(240,92); g.stroke(); g.restore();   // 평평한 선 = 아무 일 없음
    g.save(); g.shadowColor='#3ee07c'; g.shadowBlur=8; g.fillStyle='#3ee07c';
    g.beginPath(); g.arc(228,24,7,0,6.283); g.fill(); g.restore();
    const sx=16+((t*0.055)%1)*224;                                              // 느린 스위프
    g.fillStyle='rgba(150,200,255,0.18)'; g.fillRect(sx,40,2,96);
    g.globalAlpha=0.05; g.fillStyle='#ffffff';
    for(let y=0;y<160;y+=4) g.fillRect(0,y,256,1);
    g.globalAlpha=1; tex.needsUpdate=true;
  }
  return {mat,draw};
})();
function screen(w,h){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),HMI.mat);
  const bz=new THREE.Mesh(new THREE.BoxGeometry(w*1.12,h*1.20,0.02),metalMat(0x141a26,0.5,0.35));
  bz.position.z=-0.013; m.add(bz);
  return m;
}

// ── 설비 한 대 (스크러버 / 칠러)
function buildScrubber(i, alarm){
  const g=new THREE.Group();
  g.add(cabinet(1.02,1.86,0.82,0xaab6c9,{roughness:0.4}));
  const bb=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.26,0.46),bodyMat(0x96a2b6,{roughness:0.5}));
  bb.position.set(0.08,2.01,0.03); bb.castShadow=true; g.add(bb);
  [[-0.14,0.1],[0.05,0.1],[0.23,0.1],[-0.03,-0.09],[0.18,-0.09]].forEach(([a,b])=>{
    const pi=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.2,10),metalMat(0x99a3b4,0.28,0.65));
    pi.position.set(0.08+a,2.24,0.03+b); pi.castShadow=true; g.add(pi);
  });
  const lv=louvered(0.62,0.5,0xb6c0d1); lv.rotation.y=Math.PI/2; lv.position.set(-0.515,0.42,-0.05); g.add(lv);
  const f=screen(0.60,0.38); f.position.set(0,1.46,0.416); g.add(f);
  const tw=signalTower(i, alarm); tw.position.set(-0.40,1.86,0.28); g.add(tw);
  return g;
}
function buildChiller(i){
  const g=new THREE.Group();
  g.add(cabinet(0.70,1.52,0.58,0xa3afc3,{roughness:0.4}));
  const top=new THREE.Mesh(new THREE.BoxGeometry(0.70,0.20,0.58),bodyMat(0xaeb9cd,{roughness:0.38}));
  top.position.y=1.62; top.castShadow=true; g.add(top);
  const lv=louvered(0.80,0.60,0xacb7c9); lv.rotation.y=Math.PI/2; lv.position.set(0.355,0.46,0); g.add(lv);
  const f=screen(0.46,0.29); f.position.set(0,1.20,0.296); g.add(f);
  const tw=signalTower(i, false); tw.position.set(-0.24,1.55,0.18); tw.scale.setScalar(0.8); g.add(tw);
  return g;
}

// ── 도열. 앞줄(주인공)과 뒷줄(밀도) 두 벌 — 뒷줄은 안개에 묻혀 «끝이 없다»를 만든다.
//    ⚠ 간격을 일정하게 두면 «렌더»로 보인다. 결정적 난수로 아주 조금씩 흔든다.
const rnd=mulberry(20260914);
const ALARM_I=2, ALARM_Z=-4.55, ALARM_X=2.35;          // 경보 설비 — 카메라에서 두 번째(인물이 읽히는 거리)
for(let i=1;i<14;i++){          // i=0 은 비운다 — 전경 설비가 경보 설비를 통째로 가렸다(실측)
  const alarm = (i===ALARM_I);
  const m = alarm ? buildScrubber(i,true) : ((i%2===0) ? buildScrubber(i,false) : buildChiller(i));
  m.position.set(ALARM_X+(alarm?0:(rnd()-0.5)*0.10), 0, alarm?ALARM_Z:(-0.6-i*2.35+(rnd()-0.5)*0.14));
  m.rotation.y = -Math.PI/2 + (alarm?0:(rnd()-0.5)*0.035);   // 통로를 향해 선다
  S.add(m);
}
// ── 경광 조명. «빛이 주변에 번져야» 경보로 읽힌다 — 램프만 빨개지면 스티커처럼 보인다.
const beacon=new THREE.PointLight(0xff3b2e, 0, 7.5, 2.0);
beacon.position.set(ALARM_X-0.52, 2.28, ALARM_Z+0.10); S.add(beacon);
const beaconFar=new THREE.PointLight(0xff5a3a, 0, 14, 2.0);
beaconFar.position.set(ALARM_X-1.15, 1.50, ALARM_Z+0.1); S.add(beaconFar);

// ── 작업자 2인 (v24b — 「레고 같다」 지적 반영해 전면 재작성)
//    ⚠ 저폴리가 «장난감»으로 읽히는 원인은 폴리 수가 아니라 세 가지다(실측):
//       ① 비율 — 옛 인물은 머리가 키의 1/5.7 이었다(사람은 1/7.5). 이것 하나가 절반이다.
//       ② 꺾이지 않는 팔다리 — 곧은 막대는 무조건 인형이다. 팔꿈치·무릎을 넣는다.
//       ③ 자세 — 두 발을 모으고 차렷으로 서면 인형이다. 무게를 한쪽에 싣고 발을 벌린다.
//    몸통은 Lathe 로 «작업복»의 부드러운 실루엣을 만든다 — 서브팹 작업자는 방진복이 아니라
//    작업복·안전모다(방진복은 위층 클린룸이다). 어두운 작업복이라 실루엣으로도 맞다.
const suit  =new THREE.MeshStandardMaterial({color:0x2a3450,roughness:0.85,metalness:0.03});
const suitD =new THREE.MeshStandardMaterial({color:0x1d2539,roughness:0.9,metalness:0.03});
const hatMat=new THREE.MeshStandardMaterial({color:0x54658f,roughness:0.5,metalness:0.12});
const skinM =new THREE.MeshStandardMaterial({color:0x6b7490,roughness:0.7,metalness:0.03});
const WORKERS=[];
// ⚠ 접지 그림자가 없으면 사람이 «떠 보인다». 키라이트가 카메라 반대쪽이라 진짜 그림자는 안 보인다 —
//   발밑에 부드러운 원반을 하나 깔아 «닿아 있다»를 만든다(실측: 이것 하나로 부유감이 사라진다).
const CONTACT=(()=>{
  const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,2,32,32,31);
  gr.addColorStop(0,'rgba(0,0,0,0.55)'); gr.addColorStop(0.55,'rgba(0,0,0,0.22)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c);
  return new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false});
})();
function limb(mat,r0,r1,len,seg=10){           // 끝으로 갈수록 가늘어지는 팔다리 — 원통은 «파이프»로 보인다
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r0,len,seg),mat);
  m.position.y=-len/2; m.castShadow=true;
  const cap=new THREE.Mesh(new THREE.SphereGeometry(r1,seg,8),mat); cap.position.y=-len; m.add(cap);
  return m;
}
// 키 1.74m · 머리 0.225m(1/7.7). 관절은 «피벗 그룹»이라 각도만 주면 꺾인다.
function worker(x,z,ry,pose){
  const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=ry; S.add(g);
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(0.78,0.60),CONTACT);
  sh.rotation.x=-Math.PI/2; sh.position.y=0.012; g.add(sh);

  // 몸통 — 골반 0.90 → 어깨 1.40. 허리가 잘록해야 «옷 입은 사람»이다.
  const prof=[[0.010,0.86],[0.170,0.88],[0.158,1.00],[0.150,1.10],[0.168,1.22],[0.196,1.34],
              [0.165,1.41],[0.075,1.45],[0.010,1.46]].map(([r,y])=>new THREE.Vector2(r,y));
  const torso=new THREE.Mesh(new THREE.LatheGeometry(prof,22),suit);
  torso.castShadow=true; torso.scale.z=0.72; g.add(torso);      // 앞뒤로 눌러야 «판자»가 아니다
  const belt=new THREE.Mesh(new THREE.CylinderGeometry(0.163,0.163,0.035,20),suitD);
  belt.position.y=1.02; belt.scale.z=0.74; g.add(belt);
  // 목 · 머리 · 안전모
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.052,0.058,0.07,12),skinM); neck.position.y=1.475; g.add(neck);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.108,20,16),skinM);
  head.position.y=1.60; head.scale.set(0.88,1.06,0.94); head.castShadow=true; g.add(head);
  const hat=new THREE.Mesh(new THREE.SphereGeometry(0.122,20,12,0,6.283,0,1.15),hatMat);
  hat.position.y=1.615; hat.scale.set(1,0.92,1.04); hat.castShadow=true; g.add(hat);
  const brim=new THREE.Mesh(new THREE.CylinderGeometry(0.152,0.152,0.014,20),hatMat);
  brim.position.set(0,1.598,0.022); brim.scale.z=1.12; g.add(brim);

  // 다리 — 골반에서 허벅지, 무릎에서 종아리. 한쪽에 무게를 싣는다(짝다리).
  const legs=[];
  [[-0.082,0.10,0.0],[0.082,-0.14,0.06]].forEach(([lx,rot,zoff],i)=>{
    const hip=new THREE.Group(); hip.position.set(lx,0.90,zoff); g.add(hip);
    hip.rotation.x=rot*0.5;
    const thigh=limb(suit,0.082,0.067,0.44); hip.add(thigh);
    const knee=new THREE.Group(); knee.position.y=-0.44; hip.add(knee);
    knee.rotation.x=(i===0?0.14:0.05);
    const shin=limb(suit,0.066,0.052,0.42); knee.add(shin);
    const shoe=new THREE.Mesh(new THREE.BoxGeometry(0.105,0.062,0.235),suitD);
    shoe.position.set(0,-0.445,0.045); shoe.castShadow=true; knee.add(shoe);
    legs.push({hip,knee});
  });

  // 팔 — 어깨 피벗 + 팔꿈치 피벗. 꺾여야 사람이다.
  const arms=[];
  for(const s2 of [-1,1]){
    const sho=new THREE.Group(); sho.position.set(s2*0.185,1.365,0); g.add(sho);
    const up=limb(suit,0.062,0.050,0.30); sho.add(up);
    const elb=new THREE.Group(); elb.position.y=-0.30; sho.add(elb);
    const fore=limb(suit,0.050,0.040,0.26); elb.add(fore);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(0.046,10,8),skinM); hand.position.y=-0.27; elb.add(hand);
    arms.push({sho,elb});
  }
  let pad=null;
  if(pose==='pad'){
    // ⚠ 너무 눕히면 옆에서 «선»으로 보인다(실측). 세워 들어야 화면이 읽힌다.
    pad=new THREE.Mesh(new THREE.BoxGeometry(0.235,0.315,0.016),
      new THREE.MeshStandardMaterial({color:0x0c1422,emissive:0x2f7ab8,emissiveIntensity:0.75,roughness:0.3}));
    pad.position.set(0.02,1.10,0.36); pad.rotation.set(-0.62,0.34,0.05); g.add(pad);
    const pf=new THREE.Mesh(new THREE.BoxGeometry(0.255,0.335,0.010),
      new THREE.MeshStandardMaterial({color:0x2c3a52,roughness:0.5,metalness:0.3}));
    pf.position.z=-0.010; pad.add(pf);
  }
  const w={g,arms,legs,pose,pad}; WORKERS.push(w); return w;
}
worker(1.38, ALARM_Z+0.70, Math.PI/2+0.30, 'point');   // 앞사람 — HMI 를 가리킨다
worker(0.86, ALARM_Z-1.05, Math.PI/2-0.34, 'pad');     // 뒷사람 — 한 걸음 뒤에서 단말 확인
for(let i=0;i<12;i++){

{

function seek(t){
  t=clamp(t,0,DUR);
  // ── 카메라: 통로를 따라 «아주 천천히» 전진 + 미세 상승. 손맛 없는 기계적 이동이라야 진중하다.
  const k=eio(t/DUR);
  // 통로를 따라 «경보가 난 설비 쪽»으로 아주 천천히 다가간다. 손맛 없는 기계적 이동이라야 진중하다.
  C.position.set(lerp(-1.95,-1.35,k), lerp(1.78,1.66,k), lerp(4.30,2.95,k));
  C.lookAt(lerp(1.90,2.00,k), lerp(1.24,1.20,k), lerp(-4.0,-4.7,k));

  HMI.draw(t);
  // 신호탑 — 줄을 따라 위상이 조금씩 밀린다. «각자 살아 있다»로 읽히되 깜빡이지는 않는다.
  LAMPS.forEach(l=>{ l.m.emissiveIntensity = 0.34+0.20*Math.sin(t*1.4 - l.idx*0.55); });
  // ── 경광등: «회전»이라 한 바퀴마다 정면을 스친다. 삼각파에 가까운 비대칭 파형이 그렇게 읽힌다.
  //    ⚠ 1초에 두 번 넘게 돌리면 «비상등»이 아니라 «파티 조명»이 된다(1.15Hz 로 고정).
  const ph=(t*1.15)%1, sweep=Math.pow(Math.max(0,Math.sin(ph*Math.PI)),2.6);
  REDS.forEach(m=>{ m.emissive.setHex(0xff3b2e); m.emissiveIntensity=0.25+2.6*sweep; });
  beacon.intensity    = 1.1+7.5*sweep;
  beaconFar.intensity = 0.5+2.6*sweep;
  // ── 작업자: 큰 동작은 넣지 않는다. 숨쉬기 + 점검 자세만 — 6.4초에 «상황»이 읽히면 충분하다.
  WORKERS.forEach((w,i)=>{
    w.g.position.y = Math.sin(t*1.25+i*2.1)*0.005;
    w.g.rotation.z = Math.sin(t*0.9+i*1.4)*0.005;
    const br=Math.sin(t*1.25+i*2.1);                    // 숨 — 어깨가 아주 조금 오르내린다
    if(w.pose==='point'){
      // 설비 쪽 팔을 들어 HMI 를 가리킨다(0.6~1.5초). 팔꿈치가 «펴지며» 올라가야 사람의 동작이다.
      // ⚠ 팔은 -y 로 뻗으므로 rotation.x «양수»가 앞(+z=설비 쪽)이다. 음수면 손이 등 뒤로 간다(실측).
      const up=eo(p(t,0.6,1.5));
      w.arms[1].sho.rotation.set(0.32+1.02*up, 0, -0.10-0.16*up);
      w.arms[1].elb.rotation.x = 0.85 - 0.66*up;        // 접혀 있다가 펴진다
      w.arms[0].sho.rotation.set(0.06+0.02*br, 0, 0.10);
      w.arms[0].elb.rotation.x = 0.28;
    }else{
      // 단말을 두 손으로 받쳐 든다 — 팔꿈치 90도 부근
      w.arms[0].sho.rotation.set(0.34+0.015*br, 0, 0.17);
      w.arms[0].elb.rotation.x = 1.24;
      w.arms[1].sho.rotation.set(0.30+0.015*br, 0, -0.19);
      w.arms[1].elb.rotation.x = 1.28;
      if(w.pad) w.pad.material.emissiveIntensity = 0.42+0.10*Math.sin(t*3.1);
    }
  });
  for(let i=0;i<DN;i++){ const d=DBASE[i];
    dpos[i*3  ]=d.x+Math.sin(t*d.s*0.7+d.ph)*0.08;
    dpos[i*3+1]=d.y+Math.sin(t*d.s    +d.ph)*0.12;
    dpos[i*3+2]=d.z+Math.cos(t*d.s*0.6+d.ph)*0.06; }
  dgeo.attributes.position.needsUpdate=true;
  SHAFTS.forEach((m,i)=>{ m.material.opacity=0.011+0.004*Math.sin(t*0.8+i*1.7); });
  R.render(S,C);
}
