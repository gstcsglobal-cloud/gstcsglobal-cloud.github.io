<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>GST 스크러버 · 칠러 컷어웨이</title>
<style>
@font-face{font-family:'NotoKR';font-weight:700;src:url('../fonts/NotoSansKR-700.ttf') format('truetype')}
@font-face{font-family:'NotoKR';font-weight:900;src:url('../fonts/NotoSansKR-900.ttf') format('truetype')}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#05091a}
canvas{display:block}
</style></head><body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const W=1920,H=1080, DUR=4.6;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const p=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,x)=>a+(b-a)*x;

const S=new THREE.Scene();
S.background=new THREE.Color('#070d1f');
S.fog=new THREE.FogExp2(0x070d1f,0.030);
const C=new THREE.PerspectiveCamera(36,W/H,0.1,120);
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
R.setSize(W,H); R.setPixelRatio(1);
R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.35;
document.body.appendChild(R.domElement);

// ── 조명: 영상 팔레트에 맞춘다(짙은 남색 + CI 파랑 림). 흰 클린룸으로 하면 이 컷만 튄다
S.add(new THREE.HemisphereLight(0x5f82cc,0x0a1330,0.95));
const key=new THREE.DirectionalLight(0xdce9ff,2.3); key.position.set(6.5,9,8.5); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); const sc=key.shadow.camera; sc.left=-9;sc.right=9;sc.top=10;sc.bottom=-4;sc.near=1;sc.far=40; S.add(key);
const rimL=new THREE.DirectionalLight(0x5c8cff,2.1); rimL.position.set(-7,3.5,-5); S.add(rimL);
const rimR=new THREE.DirectionalLight(0x3f6ee0,1.6); rimR.position.set(8,2.5,-6); S.add(rimR);
// 정면 필 — 이게 없으면 «어두운 상자» 두 개로만 보인다
const fill=new THREE.DirectionalLight(0xa8c4ff,0.85); fill.position.set(1.5,3.0,12); S.add(fill);

// 바닥 — 어둡고 살짝 반사. 그림자가 앉을 자리가 없으면 장비가 «떠» 보인다
const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),
  new THREE.MeshStandardMaterial({color:0x0a1330,roughness:0.30,metalness:0.55}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; S.add(floor);
const grid=new THREE.GridHelper(120,60,0x1b2a55,0x121d3d); grid.position.y=0.004;
grid.material.transparent=true; grid.material.opacity=0.45; S.add(grid);

const steel=new THREE.MeshStandardMaterial({color:0x8fa2c4,roughness:0.28,metalness:0.92});
const steelD=new THREE.MeshStandardMaterial({color:0x6b7ba6,roughness:0.38,metalness:0.70});
const panel=new THREE.MeshStandardMaterial({color:0x35497f,roughness:0.44,metalness:0.42});
const glass=new THREE.MeshPhysicalMaterial({color:0x9fc2ff,roughness:0.12,metalness:0.0,
  transparent:true,opacity:0.16,side:THREE.DoubleSide,transmission:0.0,clearcoat:1.0});
const pipeM=new THREE.MeshStandardMaterial({color:0x6d80a8,roughness:0.30,metalness:0.88});

// ════════ 스크러버 ════════  (케이스가 «비쳐» 속이 보이는 컷어웨이)
const SCR=new THREE.Group(); SCR.position.set(0.4,0,0); S.add(SCR);
const BW=2.6,BH=4.6,BD=2.0;
const shell=new THREE.Mesh(new THREE.BoxGeometry(BW,BH,BD),glass); shell.position.y=BH/2; SCR.add(shell);
const edge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(BW,BH,BD)),
  new THREE.LineBasicMaterial({color:0x7fb0ff,transparent:true,opacity:0.75})); edge.position.y=BH/2; SCR.add(edge);
// 앞판 — 이게 사라지면서 «열린다»
const face=new THREE.Mesh(new THREE.BoxGeometry(BW,BH,0.07),
  new THREE.MeshStandardMaterial({color:0x44598f,roughness:0.40,metalness:0.45,transparent:true,opacity:1}));
face.position.set(0,BH/2,BD/2+0.035); face.castShadow=true; SCR.add(face);
const faceMat=face.material;
// 앞판 위의 표식 — 실제 장비의 «얼굴»
const badge=new THREE.Mesh(new THREE.PlaneGeometry(1.5,0.30),new THREE.MeshBasicMaterial({color:0x8fc0ff,transparent:true}));
badge.position.set(0,BH-0.7,BD/2+0.08); SCR.add(badge);
const hmi=new THREE.Mesh(new THREE.PlaneGeometry(0.62,0.44),new THREE.MeshBasicMaterial({color:0x1e6fd9,transparent:true}));
hmi.position.set(0.75,2.55,BD/2+0.08); SCR.add(hmi);

// 속 — 연소 챔버 2 · 반응(수세)탑 · 데미스터 · 배관
const INNER=new THREE.Group(); SCR.add(INNER);
const flames=[],glows=[];
for(const x of [-0.68,0.68]){
  const ch=new THREE.Mesh(new THREE.CylinderGeometry(0.46,0.46,1.7,44),steel);
  ch.position.set(x,1.45,0); ch.castShadow=true; INNER.add(ch);
  const rib=new THREE.Mesh(new THREE.TorusGeometry(0.47,0.035,10,44),steelD);
  rib.position.set(x,2.15,0); rib.rotation.x=Math.PI/2; INNER.add(rib);
  const fl=new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.10,0.95,32),
    new THREE.MeshBasicMaterial({color:0xff9a4a,transparent:true,opacity:0.9}));
  fl.position.set(x,1.55,0); INNER.add(fl); flames.push(fl);
  const pl=new THREE.PointLight(0xff8a3d,7,4.5); pl.position.set(x,1.7,0); INNER.add(pl); glows.push(pl);
  const inj=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.5,16),pipeM);
  inj.position.set(x,2.55,0); INNER.add(inj);
}
const tower=new THREE.Mesh(new THREE.CylinderGeometry(0.58,0.58,1.5,44),steel);
tower.position.set(0,3.35,0); tower.castShadow=true; INNER.add(tower);
// 수세 — 탑 안의 물 커튼
const water=new THREE.Mesh(new THREE.CylinderGeometry(0.50,0.50,1.2,32,1,true),
  new THREE.MeshBasicMaterial({color:0x7fd0ff,transparent:true,opacity:0.22,side:THREE.DoubleSide}));
water.position.set(0,3.30,0); INNER.add(water);
for(let i=0;i<3;i++){ const d=new THREE.Mesh(new THREE.TorusGeometry(0.59,0.03,8,44),steelD);
  d.position.set(0,2.85+i*0.5,0); d.rotation.x=Math.PI/2; INNER.add(d); }
// 배기 스택
const stack=new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.30,1.7,32),steelD);
stack.position.set(0,5.0,0); stack.castShadow=true; SCR.add(stack);
// 유입 배관 — 왼쪽에서 들어온다
const inlet=new THREE.Mesh(new THREE.CylinderGeometry(0.19,0.19,2.3,24),pipeM);
inlet.rotation.z=Math.PI/2; inlet.position.set(-2.45,3.05,0.0); inlet.castShadow=true; SCR.add(inlet);
const elbow=new THREE.Mesh(new THREE.TorusGeometry(0.36,0.19,16,28,Math.PI/2),pipeM);
elbow.position.set(-1.3,3.05,0); elbow.rotation.set(0,0,Math.PI); SCR.add(elbow);

// ════════ 칠러 ════════
const CH=new THREE.Group(); CH.position.set(4.3,0,-0.9); S.add(CH);
const cbody=new THREE.Mesh(new THREE.BoxGeometry(2.1,2.5,1.7),panel);
cbody.position.y=1.25; cbody.castShadow=true; CH.add(cbody);
CH.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2.1,2.5,1.7)),
  new THREE.LineBasicMaterial({color:0x5c8cff,transparent:true,opacity:0.5})).translateY(1.25));
const fans=[];
for(const x of [-0.5,0.5]){
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.38,0.05,10,36),steelD);
  ring.position.set(x,1.55,0.86); CH.add(ring);
  const f=new THREE.Group(); f.position.set(x,1.55,0.84); CH.add(f); fans.push(f);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.06,16),steelD);
  hub.rotation.x=Math.PI/2; f.add(hub);
  // 날개는 얇고 촘촘해야 «팬»으로 읽힌다 — 두꺼우면 톱니바퀴가 된다
  for(let i=0;i<9;i++){ const bl=new THREE.Mesh(new THREE.BoxGeometry(0.27,0.062,0.010),steel);
    const a=i/9*6.283; bl.position.set(Math.cos(a)*0.155,Math.sin(a)*0.155,0);
    bl.rotation.set(0.30,0,a+Math.PI/2); f.add(bl); }
}
// 냉수 배관 — 차가운 파랑
const coldM=new THREE.MeshStandardMaterial({color:0x4aa3ff,roughness:0.3,metalness:0.6,emissive:0x1e5bb0,emissiveIntensity:0.5});
const cpipe=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,2.4,20),coldM);
cpipe.rotation.z=Math.PI/2; cpipe.position.set(-1.6,0.55,0.3); CH.add(cpipe);
const cl=new THREE.PointLight(0x5aa9ff,4.5,5); cl.position.set(0,1.3,1.2); CH.add(cl);
const cglow=new THREE.Mesh(new THREE.PlaneGeometry(1.7,0.2),
  new THREE.MeshBasicMaterial({color:0x7fd0ff,transparent:true,opacity:0.55}));
cglow.position.set(0,0.45,0.87); CH.add(cglow);

// 사람 — 설비가 얼마나 큰지는 사람 옆에 세워야 전해진다
const skin=new THREE.MeshStandardMaterial({color:0x5c74a8,roughness:0.75,metalness:0.05});
for(const [hx,hz] of [[-2.35,1.9],[-1.85,2.25]]){
  const g=new THREE.Group(); g.position.set(hx,0,hz); S.add(g);
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.20,0.72,6,14),skin);
  body.position.y=1.02; body.castShadow=true; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.155,20,16),skin);
  head.position.y=1.63; head.castShadow=true; g.add(head);
  for(const lx of [-0.11,0.11]){ const leg=new THREE.Mesh(new THREE.CapsuleGeometry(0.085,0.48,5,10),skin);
    leg.position.set(lx,0.36,0); leg.castShadow=true; g.add(leg); } }

// ── 라벨 — 3D 로 «따라붙는» 것이 ASML 설명 구간의 얼굴이다.
//    캔버스에 그려 스프라이트로 단다(한글 폰트가 이 페이지에도 실려 있어야 한다)
function labelSprite(text, accent){
  const c=document.createElement('canvas'), s=3; c.width=560*s/2; c.height=92*s/2;
  const g=c.getContext('2d'); g.scale(s/2,s/2);
  g.font='700 34px NotoKR, sans-serif'; const tw=g.measureText(text).width;
  const w=tw+56, h=60, x=(560-w)/2, y=16;
  g.clearRect(0,0,560,92);
  g.fillStyle='rgba(8,14,34,.82)'; g.strokeStyle=accent; g.lineWidth=2;
  g.beginPath(); g.roundRect(x,y,w,h,30); g.fill(); g.stroke();
  g.fillStyle='#eaf2ff'; g.textBaseline='middle'; g.textAlign='center';
  g.fillText(text, 280, y+h/2+1);
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false}));
  sp.scale.set(2.35,0.386,1); sp.renderOrder=10; return sp;
}
const LABELS=[
  // ⚠ 화면 «왼쪽»은 본편 카피가 쓰는 자리다 — 라벨을 그쪽에 두면 글자 위에 글자가 겹친다.
  //    「유해가스 유입」은 카피가 이미 말하므로 뺐다. 4초에 읽을 수 있는 라벨은 넷이 한계다.
  { t:'연소 챔버 1,200℃', a:'#ffb46b', pos:[ 1.6,1.35,1.25], at:0.60 },
  { t:'반응·수세탑',       a:'#7fd0ff', pos:[-0.9,3.55,1.35], at:1.30 },
  { t:'정화된 공기',       a:'#9fb8e8', pos:[ 0.4,6.15,0.0],  at:2.00 },
  { t:'칠러 ±0.1℃',      a:'#7fd0ff', pos:[ 4.3,3.05,-0.9], at:2.70 },
];
const SPR=LABELS.map(L=>{ const s=labelSprite(L.t,L.a); s.position.set(L.pos[0],L.pos[1],L.pos[2]);
  s.material.opacity=0; S.add(s); return s; });

// ── 카메라: 천천히 들어가며 살짝 돈다. 크게 돌면 라벨이 서로 겹친다
function seek(t){
  t=clamp(t,0,DUR);
  const x=t/DUR, e=eio(x);
  // 글자가 왼쪽에 서는 화면이다 — 카메라는 피사체를 잡되 «시선만» 왼쪽으로 틀어
  // 장비를 화면 오른쪽에 세운다(시프트 렌즈와 같은 원리다). 목표점을 옮기면 각도가 같이 변한다
  const ang=lerp(-0.32,0.05,e), rad=lerp(15.2,13.2,eo(x)), hy=lerp(4.4,3.3,e);
  const cx=2.0, cy=lerp(3.3,2.8,e);
  C.position.set(cx+Math.sin(ang)*rad, hy, Math.cos(ang)*rad);
  C.lookAt(cx-2.4, cy, 0);
  // 앞판이 녹아 «속»이 보인다 — 이 장면의 본론
  faceMat.opacity = 1 - p(t,0.35,1.05)*0.94;
  badge.material.opacity = hmi.material.opacity = faceMat.opacity;
  // 불꽃은 흔들린다(고정이면 그림처럼 보인다)
  flames.forEach((f,i)=>{ const s=1+0.13*Math.sin(t*17+i*2.1);
    f.scale.set(s,1+0.10*Math.sin(t*13+i),s); f.material.opacity=0.72+0.22*Math.sin(t*21+i*1.7); });
  glows.forEach((g,i)=>{ g.intensity=6+2.4*Math.sin(t*15+i*2); });
  water.material.opacity = 0.16+0.10*Math.sin(t*6);
  fans.forEach((f,i)=>{ f.rotation.z = t*(i?-9:9); });
  SPR.forEach((s,i)=>{ const L=LABELS[i];
    const a=Math.min(p(t,L.at,L.at+0.28), 1-p(t,DUR-0.30,DUR));
    s.material.opacity=a; s.scale.set(2.35*lerp(0.86,1,eo(p(t,L.at,L.at+0.28))),0.386*lerp(0.86,1,eo(p(t,L.at,L.at+0.28))),1); });
  R.render(S,C);
}
window.seek=seek; window.DUR3D=DUR;
await document.fonts.ready;
// 폰트가 늦게 오면 라벨이 «네모»로 구워진다 — 폰트 준비 뒤에 다시 그린다
SPR.forEach((s,i)=>{ const n=labelSprite(LABELS[i].t,LABELS[i].a); s.material.map.dispose(); s.material.map=n.material.map; s.material.needsUpdate=true; });
seek(0); window.__ready=true;
</script></body></html>
