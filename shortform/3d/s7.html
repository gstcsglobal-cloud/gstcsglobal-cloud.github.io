  결과물은 ../footage/s7_row.webm 하나다. 길이 6.4초(= s6 슬롯과 같아 그대로 갈아끼울 수 있다).

  왜 만들었나: 사내 피드백 「기계 만담이 유치해서 뒤의 3D 씬(실란·SF6·칠러) 격을 죽인다」.
    대화·의인화를 완전히 걷어내고, 같은 자리에서 «규모»를 보여 준다 —
    한 대의 이야기가 아니라 «수천 대가 지금도 서 있다»는 사실이 이 영상의 내용이다.

  ⚠ 재질·부품(cabinet/louvered/signalTower/screen)은 scene3d.html · s6.html 과 «같은 규약»이다.
     여기서만 다르게 만들면 한 영상 안에서 같은 스크러버가 두 모습으로 보인다.
  ⚠ 구도 규약 — 왼쪽 40%는 «비운다». 실란·칠러 씬과 같은 «왼쪽 글자 · 오른쪽 피사체»여야
     한 영상 안에서 조판이 따로 놀지 않는다. 자막은 3D 에 굽지 않는다(scene.html 이 그린다).
  ⚠ seek(t) 는 t 만의 함수여야 한다 — rAF·Math.random() 금지(같은 프레임이 늘 같아야 캡처가 된다).
-->

    g.save(); g.shadowColor='#3ee07c'; g.shadowBlur=8; g.fillStyle='#3ee07c';

//   정본 색(README 0x9aa35e)의 연두 «계열»은 지키되 채도만 내린다 — 원색 그대로 두면
//   배기관 26줄이 화면에서 가장 강한 색이 되어 정작 경보가 묻힌다(실측).
const EXC=0x969a78;
function buildPump(){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.30,0.36),metalMat(0x323a4c,0.45,0.55));
  base.position.y=0.15; base.castShadow=base.receiveShadow=true; g.add(base);
  const mo=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.50,PIPE?36:16),metalMat(0x4b5568,0.35,0.6));
  mo.rotation.z=Math.PI/2; mo.position.y=0.42; mo.castShadow=true; g.add(mo);
  for(let i=0;i<8;i++){                               // 냉각 핀 — 펌프를 «모터»로 읽게 하는 단서
    const f=new THREE.Mesh(new THREE.TorusGeometry(0.155,0.008,PIPE?10:5,PIPE?30:14),metalMat(0x323a4c,0.5,0.5));
    f.rotation.y=Math.PI/2; f.position.set(-0.2+i*0.055,0.42,0); g.add(f);
  }
  const cp=new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.10,0.16,12),metalMat(0x262c38,0.4,0.5));
  cp.rotation.z=Math.PI/2; cp.position.set(-0.32,0.42,0); g.add(cp);
  for(const x of [-0.33,0.33]){                       // 흡입·토출 노즐
    const n=new THREE.Mesh(new THREE.CylinderGeometry(0.038,0.038,0.16,10),metalMat(0x7b8595,0.3,0.7));
    n.position.set(x,0.54,0); g.add(n);
  }
  return g;
}
// 두 점을 잇는 관 — 꺾임을 곡선으로. 직각으로 꺾으면 배관이 아니라 «선»이다.
function pipeTo(p1,p2,rad,color){
  const cv=new THREE.CatmullRomCurve3([p1,new THREE.Vector3(p1.x,(p1.y+p2.y)/2,p1.z),
    new THREE.Vector3(p2.x,(p1.y+p2.y)/2,p2.z),p2]);
  const m=new THREE.Mesh(new THREE.TubeGeometry(cv,20,rad,8,false),metalMat(color,0.35,0.5));
  m.castShadow=true; return m;
}
// ── 스크러버 (GAIA) — 사용자가 준 실물 사진을 따른다.
//    ⚠ 옛 판이 실물과 달랐던 곳: 문이 두 짝이었고, 위에 «관 5개»가 서 있었고, 바닥이 플린스였다.
//      실물은 «단문 + 상단 타공판 블록 + 상단 제어함 + 캐스터»다. 이 넷이 GAIA 의 얼굴이다.
function buildScrubber(i, alarm){
  const g=new THREE.Group();
  const W=1.00,H=1.95,D=0.90, body=0xefeee9;
  // 캐스터 — 실물은 «바퀴 위에» 선다. 플린스로 두면 붙박이 설비로 보인다.
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    const br=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.06,0.09),metalMat(0x2a3038,0.5,0.5));
    br.position.set(sx*(W/2-0.10),0.135,sz*(D/2-0.10)); g.add(br);
    const wh=new THREE.Mesh(new THREE.CylinderGeometry(0.052,0.052,0.035,14),darkMat);
    wh.rotation.z=Math.PI/2; wh.position.set(sx*(W/2-0.10),0.052,sz*(D/2-0.10)); wh.castShadow=true; g.add(wh);
  }
  // 섀시 + 몸통 — 바닥에서 0.17 띄운다(바퀴 위)
  const Y0=0.17;
  const P=0.045;
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    const c=new THREE.Mesh(new THREE.BoxGeometry(P,H,P),frameMat);
    c.position.set(sx*(W/2-P/2), Y0+H/2, sz*(D/2-P/2)); c.castShadow=true; g.add(c);
  }
  const b=new THREE.Mesh(new THREE.BoxGeometry(W-0.03,H-0.03,D-0.03),bodyMat(body,{roughness:0.45}));
  b.position.y=Y0+H/2; b.castShadow=b.receiveShadow=true; g.add(b);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(W+0.012,0.03,D+0.012),bodyMat(0xf4f3ee,{roughness:0.4}));
  cap.position.y=Y0+H+0.015; cap.castShadow=true; g.add(cap);

  // ── 단문 도어 — 실물은 한 짝이다. 경첩 오른쪽 · 손잡이 왼쪽.
  const DZ=D/2+0.006, dw=W-0.15, dh=H-0.30, dy=Y0+H*0.50;
  const rec=new THREE.Mesh(new THREE.BoxGeometry(dw+0.03,dh+0.03,0.02),darkMat);
  rec.position.set(0,dy,D/2-0.004); g.add(rec);
  const door=new THREE.Mesh(new THREE.BoxGeometry(dw,dh,0.024),bodyMat(body,{roughness:0.48}));
  door.position.set(0,dy,DZ+0.006); door.castShadow=true; g.add(door);
  const hd=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.30,8),plateMat);
  hd.position.set(-dw/2+0.055,dy-0.05,DZ+0.034); g.add(hd);
  for(const hy of [-0.42,0,0.42]){
    const hg=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.055,8),plateMat);
    hg.position.set(dw/2-0.012,dy+hy*dh*0.5,DZ+0.004); g.add(hg);
  }
  // 도어 루버 슬롯 — 사진의 «가로 슬롯 무리». 아래 세 무리 + 위 두 무리.
  function slots(cx,cy,n,w2){
    for(let k=0;k<n;k++){
      const sl=new THREE.Mesh(new THREE.BoxGeometry(w2,0.012,0.012),darkMat);
      sl.position.set(cx,cy-k*0.028,DZ+0.020); g.add(sl);
    }
  }
  for(const cx of [-0.26,0,0.26]) slots(cx, dy-0.30, 7, 0.20);
  for(const cx of [-0.30,0.30])   slots(cx, dy+0.52, 4, 0.16);
  // HMI — 어두운 정사각 화면 + 베젤(사진: 도어 중앙 상부)
  const f=screen(0.28,0.23); f.position.set(0.0,dy+0.30,DZ+0.028); g.add(f);
  // 작은 조작 모듈(사진: 화면 아래 사각 장치)
  const md=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.075,0.022),darkMat);
  md.position.set(0,dy+0.06,DZ+0.020); g.add(md);
  // 비상정지 — 좌상단 적색. 이 씬에서 «유일한 상시 적색»이라 작게 둔다.
  const es=new THREE.Mesh(new THREE.CylinderGeometry(0.030,0.030,0.022,12),
    new THREE.MeshStandardMaterial({color:0xc02a20,roughness:0.45,metalness:0.1}));
  es.rotation.x=Math.PI/2; es.position.set(-W/2+0.055,Y0+H-0.22,DZ+0.012); g.add(es);

  // ── 상단: 좌측 «타공판» 블록 + 우측 «제어함»(더 높다) + 좌상단 원통(블로워)
  const tb=new THREE.Mesh(new THREE.BoxGeometry(0.54,0.24,0.62),bodyMat(0xe6e4de,{roughness:0.5}));
  tb.position.set(-W/2+0.30,Y0+H+0.135,0.02); tb.castShadow=true; g.add(tb);
  const perf=new THREE.Mesh(new THREE.BoxGeometry(0.50,0.018,0.58),plateMat);
  perf.position.set(-W/2+0.30,Y0+H+0.262,0.02); g.add(perf);
  for(let r=0;r<3;r++) for(let c=0;c<4;c++){          // 타공 — 실물의 상판 구멍 배열
    const ho=new THREE.Mesh(new THREE.CylinderGeometry(0.032,0.032,0.026,10),darkMat);
    ho.position.set(-W/2+0.30-0.165+c*0.11, Y0+H+0.262, 0.02-0.17+r*0.17); g.add(ho);
  }
  const blow=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,0.13,14),metalMat(0xc8c6c0,0.32,0.6));
  blow.rotation.z=Math.PI/2; blow.position.set(-W/2+0.03,Y0+H+0.20,-D/2+0.20); blow.castShadow=true; g.add(blow);
  const ctl=new THREE.Mesh(new THREE.BoxGeometry(0.30,0.50,0.44),bodyMat(0xefeee9,{roughness:0.45}));
  ctl.position.set(W/2-0.20,Y0+H+0.265,-0.02); ctl.castShadow=true; g.add(ctl);
  const ctlp=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.10,0.012),darkMat);
  ctlp.position.set(W/2-0.20,Y0+H+0.34,0.205); g.add(ctlp);
  // 신호탑 — 사진은 제어함 «위 오른쪽»이다
  const tw=signalTower(i, alarm); tw.position.set(W/2-0.13,Y0+H+0.515,0.06); tw.scale.setScalar(0.9); g.add(tw);

  // 측면 루버 + 유틸리티
  const lv=louvered(0.56,0.44,0xe6e4de); lv.rotation.y=Math.PI/2; lv.position.set(-W/2-0.012,Y0+0.42,-0.12); g.add(lv);
  const ub=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.30,0.24),plateMat);
  ub.position.set(W/2+0.02,Y0+0.95,-0.16); ub.castShadow=true; g.add(ub);
  // 배출 덕트 — 타공 상판에서 천장 하우스 배기로. «위는 배출구»(README 규약)
  const duct=new THREE.Mesh(new THREE.CylinderGeometry(0.068,0.068,1.55,12),metalMat(0xc8c6c0,0.32,0.6));
  duct.position.set(-W/2+0.30,Y0+H+1.05,0.02); duct.castShadow=true; g.add(duct);
  for(const fy of [Y0+H+0.30, Y0+H+1.80]){
    const fl=new THREE.Mesh(new THREE.CylinderGeometry(0.095,0.095,0.026,12),plateMat);
    fl.position.set(-W/2+0.30,fy,0.02); g.add(fl);
  }
  g.userData.H=Y0+H;
  return g;
}
function buildChiller(i){
  const g=new THREE.Group();
  g.add(cabinet(0.70,1.52,0.58,0xeae9e4,{roughness:0.4}));
  const top=new THREE.Mesh(new THREE.BoxGeometry(0.70,0.20,0.58),bodyMat(0xf0efea,{roughness:0.38}));
  top.position.y=1.64; top.castShadow=true; g.add(top);
  const tc=new THREE.Mesh(new THREE.BoxGeometry(0.73,0.02,0.61),plateMat); tc.position.y=1.75; g.add(tc);
  const lv=louvered(0.80,0.60,0xdedcd6); lv.rotation.y=Math.PI/2; lv.position.set(0.362,0.46,0); g.add(lv);
  // 냉각수 배관 — 왕복 두 줄이 천장으로. 칠러는 «물이 드나드는 기계»다.
  for(const [ax,r] of [[-0.19,0.030],[-0.07,0.030]]){
    const up=new THREE.Mesh(new THREE.CylinderGeometry(r,r,2.15,10),metalMat(0xc8c6c0,0.30,0.62));
    up.position.set(ax,2.88,-0.12); up.castShadow=true; g.add(up);
    for(const fy of [1.82,3.93]){
      const fl=new THREE.Mesh(new THREE.CylinderGeometry(r*1.5,r*1.5,0.026,12),plateMat);
      fl.position.set(ax,fy,-0.12); g.add(fl);
    }
  }
  const f=screen(0.42,0.27); f.position.set(0.02,1.18,0.332); g.add(f);
  const tw=signalTower(i, false); tw.position.set(-0.24,1.76,0.18); tw.scale.setScalar(0.8); g.add(tw);
  return g;
}

// ── 도열. 앞줄(주인공)과 뒷줄(밀도) 두 벌 — 뒷줄은 안개에 묻혀 «끝이 없다»를 만든다.
//    ⚠ 간격을 일정하게 두면 «렌더»로 보인다. 결정적 난수로 아주 조금씩 흔든다.
const rnd=mulberry(20260914);
// ⚠ 경보는 «한 대만». 여러 대가 울면 재난 영상이 된다 — 이 영상의 주제는 «한 건이 번지지 않았다»다.
const JOINT=new THREE.Vector3();   // 배관 이음부 — 클로즈업 카메라와 1막 파열이 «같은 자리»를 본다
const ALARM_I=2, ALARM_Z=-5.30, ALARM_X=2.35;   // v24c: 한 자리 당겼다 — 멀면 «무슨 일이 났는지»가 안 읽힌다
for(let i=0;i<14;i++){
  const isUnit = (i===ALARM_I);          // «그 설비»인가 — 자리를 정한다
  const alarm  = EMG || (isUnit && !PIPE);   // «경광을 켜나» — 그림만 정한다
  // ⚠ 배관 컷(1막 첫 컷·5막 마지막 컷)에는 아직/이미 아무 일도 없다. 경광을 켜 두면
  //   배경에 붉은 얼룩만 남아 «무슨 일이 나긴 났나»로 읽힌다.
  // ⚠ 둘을 한 변수로 쓰면 안 된다: 비상 모드에서 열 전체가 경보 설비의 좌표로 몰린다(실측 14대 겹침)
  // ⚠ 서브팹에는 스크러버와 진공펌프만 선다 — 칠러는 클린룸에서 공정 장비를 식힌다(README 규약).
  //    섞어 두면 그림이 틀리고, 사진 빌보드 옆에 프리미티브 칠러가 서면 화풍도 갈린다.
  const mk = BB ? buildScrubberBB : buildScrubber;
  const m = mk(i, alarm);
  const mz = isUnit?ALARM_Z:(-0.6-i*2.35+(rnd()-0.5)*0.14);
  m.position.set(ALARM_X+(isUnit?0:(rnd()-0.5)*0.10), 0, mz);
  m.rotation.y = -Math.PI/2 + (isUnit?0:(rnd()-0.5)*0.035);   // 통로를 향해 선다
  S.add(m);
  // 스크러버마다 진공펌프. 배기는 «위에서 내려와 → 펌프 → 스크러버 옆구리»로 들어간다(README 규약).
  {
    const px=ALARM_X-1.02, pz=mz+0.66;
    const pump=buildPump(); pump.position.set(px,0,pz); pump.rotation.y=-Math.PI/2+0.28; S.add(pump);
    const th=pump.rotation.y;
    const inP =new THREE.Vector3(px-0.33*Math.cos(th),0.56,pz+0.33*Math.sin(th));
    const outP=new THREE.Vector3(px+0.33*Math.cos(th),0.56,pz-0.33*Math.sin(th));
    // 데크 틈에서 내려온다 — 천장까지 이어야 «위층 공정 장비에서 온 배기»로 읽힌다(허공에서 시작하면 안 된다)
    const rl=CEILY-0.95;
    const riser=new THREE.Mesh(new THREE.CylinderGeometry(0.036,0.036,rl,10),metalMat(EXC,0.45,0.40));
    riser.position.set(inP.x+0.62,0.95+rl/2,inP.z-0.42); riser.castShadow=true; S.add(riser);
    S.add(pipeTo(new THREE.Vector3(inP.x+0.62,0.98,inP.z-0.42),inP,0.034,EXC));
    S.add(pipeTo(outP,new THREE.Vector3(ALARM_X-0.52,0.58,mz-0.16),0.034,EXC));  // 스크러버 «옆구리»
    const fl=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.03,PIPE?40:12),plateMat);
    fl.rotation.z=Math.PI/2; fl.position.set(ALARM_X-0.51,0.60,mz-0.18); S.add(fl);
    if(isUnit){
      JOINT.set(ALARM_X-0.51,0.60,mz-0.18);
      // 클로즈업에서만 볼트를 단다 — 열 전체에 달면 26대분 지오메트리가 공짜가 아니고,
      // 도열 컷 거리에서는 한 화소도 안 보인다. «보이는 곳에만 만든다».
      if(PIPE){
        for(let b=0;b<8;b++){
          const a2=b/8*6.283;
          const bo=new THREE.Mesh(new THREE.CylinderGeometry(0.009,0.009,0.042,6),plateMat);
          bo.rotation.z=Math.PI/2;
          bo.position.set(JOINT.x, JOINT.y+Math.cos(a2)*0.065, JOINT.z+Math.sin(a2)*0.065);
          S.add(bo);
        }
        // 이음부 «틈» — 1막에서 가스가 새는 자리다. 검은 띠 한 줄이 그 자리를 만든다.
        const gap=new THREE.Mesh(new THREE.CylinderGeometry(0.0855,0.0855,0.008,40),darkMat);
        gap.rotation.z=Math.PI/2; gap.position.copy(JOINT); S.add(gap);
      }
    }
  }
}
// 경광 조명 — «빛이 주변에 번져야» 경보로 읽힌다. 램프만 빨개지면 스티커처럼 보인다.
const beacon=new THREE.PointLight(0xff3b2e, 0, 5.2, 2.0);
beacon.position.set(ALARM_X-0.04, GAIA_H*0.899, ALARM_Z+GAIA_W*0.26); S.add(beacon);   // 사진 속 렌즈 자리
const beaconFar=new THREE.PointLight(0xff5a3a, 0, 13, 2.0);

for(let i=0;i<12;i++){
  const m = (BB ? buildScrubberBB : buildScrubber)(i+40, EMG);
  m.position.set(6.6+(rnd()-0.5)*0.12, 0, -1.4-i*2.6+(rnd()-0.5)*0.2);

}
// 통로 «반대편»(왼쪽)은 비워 둔다 — 자막 자리다. 멀리 원경 실루엣만 옅게.
// ⚠ 밝은 팹에서 검은 덩어리(0x0e1524)를 두면 «구멍»으로 보인다 — 안개에 녹는 밝은 회청색으로.
for(let i=0;i<9;i++){
  const h=1.1+rnd()*1.5;
  const b=new THREE.Mesh(new THREE.BoxGeometry(0.7+rnd()*0.6,h,0.7),
    new THREE.MeshStandardMaterial({color:0x79849a,roughness:0.75,metalness:0.15}));

// ── 천장 배관 — 통로를 따라 달린다. «지하 서브팹»의 서명이다.
{
  const G=new THREE.Group(); S.add(G);
  // ⚠ 밤 세팅의 거의-검정(0x232b3c)을 밝은 방에 그대로 두면 천장만 밤이다. 회청 금속으로 올린다.
  for(const [x,y,r] of [[2.2,3.52,0.10],[2.7,3.52,0.075],[3.15,3.52,0.055],[6.4,3.74,0.09]]){
    const pipe=new THREE.Mesh(new THREE.CylinderGeometry(r,r,70,10),metalMat(0x707c90,0.5,0.55));
    pipe.rotation.x=Math.PI/2; pipe.position.set(x,y,-32); G.add(pipe);
  }
  // 케이블 트레이
  const tray=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.09,70),metalMat(0x6a7589,0.55,0.5));
  tray.position.set(1.55,3.80,-32); G.add(tray);
  for(let i=0;i<3;i++){
    const c=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,70,6),metalMat(0x39414f,0.8,0.15));
    c.rotation.x=Math.PI/2; c.position.set(1.4+i*0.13,3.88,-32); G.add(c);
  }
  // 행거 — 배관이 «떠 있지» 않게
  for(let i=0;i<16;i++){
    const hg=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.05,0.05),metalMat(0x5d6779,0.6,0.4));
    hg.position.set(2.4,3.69,-1-i*2.4); G.add(hg);
  }
}
// 천장 형광등 — v24c. 밝은 방에는 «광선»이 안 보인다(공기 중 산란을 볼 만큼 어둡지 않다).
//   대신 천장 라인 조명이 리듬을 만들고, 바닥·상판 반사에 길게 늘어져 «실내»를 만든다.
//   ⚠ 실제 광원으로 세우지 않는다 — 26대 × 점광원이면 렌더가 몇 배로 느려진다.
//     밝기는 이미 반구광이 만들고, 여기 등기구는 «보이는 것»만 담당한다.
const SHAFTS=[];
for(let i=0;i<7;i++){
  const m=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.05,0.34),
    new THREE.MeshBasicMaterial({color:EMG?0x3a2f33:0xf4f8ff,transparent:true,opacity:EMG?0.5:0.95,toneMapped:false}));
  m.position.set(1.9,4.02,-1.8-i*4.3); S.add(m); SHAFTS.push(m);
}
// 먼지 — 밝은 배경에서는 밝은 점이 안 보인다. 어둡게 바꾸고 아주 옅게만 남긴다(공기감).
const DN=220, DBASE=[], dgeo=new THREE.BufferGeometry(), dpos=new Float32Array(DN*3);
for(let i=0;i<DN;i++) DBASE.push({x:(rnd()-.3)*14,y:rnd()*4.2+0.2,z:-rnd()*30,s:0.25+rnd()*0.5,ph:rnd()*6.283});
dgeo.setAttribute('position',new THREE.BufferAttribute(dpos,3));
S.add(new THREE.Points(dgeo,new THREE.PointsMaterial({color:0x5d6a80,size:0.030,transparent:true,
  opacity:0.16,depthWrite:false,sizeAttenuation:true})));

function seek(t){
  t=clamp(t,0,DUR);
  // ── 카메라: 통로를 따라 «아주 천천히» 전진 + 미세 상승. 손맛 없는 기계적 이동이라야 진중하다.
  const k=eio(t/DUR);
  if(MACRO){
    // 펌프 냉각핀을 «축에 거의 나란히» 스친다 — 핀이 겹쳐 보이며 깊이가 생기는 각이다.
    const P=new THREE.Vector3(ALARM_X-1.02, 0.42, ALARM_Z+0.66);
    // ⚠ 매크로라고 «붙이면» 안 된다. 0.6m 까지 붙였더니 화면이 통째로 냉각핀 하나로 차서
    //   읽을 것이 없어졌고, 화면 전체가 같은 거리라 심도가 할 일도 없었다(실측).
    //   얕은 심도는 «앞뒤가 있을 때»만 보인다 — 피사체 뒤로 열이 물러나는 거리를 준다.
    const a=lerp(-0.34,0.16,k), r=lerp(1.45,1.22,k);
    C.position.set(P.x-Math.cos(a)*r, 0.62+0.05*k, P.z+Math.sin(a)*r*0.9);
    C.lookAt(P.x+0.10, P.y+0.02, P.z-0.10);
    C.fov=34; C.updateProjectionMatrix();
    if(BOKEH) BOKEH.uniforms.focus.value = C.position.distanceTo(P);
  } else if(PIPE){
    // 배관 이음부 로우앵글. ⚠ 멈춰 세우지 않는다 — 완전 정지는 «스틸»로 보이고, 그러면
    //   마지막 컷의 «조용함»이 «영상이 멈췄나»로 읽힌다. 아주 느린 전진만 둔다.
    // ⚠ 넓은 화각으로 가까이 가면 통로의 펌프들이 전부 들어와 어수선하다(실측). 망원으로 «멀리서 조여»
    //   이음부만 남긴다 — 배경이 압축되면서 열도 같이 눌려 깊이가 산다.
    const d=lerp(1.60,1.44,k);
    C.position.set(JOINT.x-d, 0.45+0.03*k, JOINT.z-d);
    // 이음부를 화면 «오른쪽»에 세운다(왼쪽 40%는 자막 자리 — 이 영상의 조판 규약).
    // ⚠ 이 카메라의 화면-오른쪽은 «-x·+z» 쪽이다. 그래서 조준점은 이음부보다 «+x·-z» 여야 한다
    //   — 직관과 반대라 한 번 틀렸다(왼쪽으로 아무리 조준해도 피사체가 더 왼쪽으로 갔다).
    C.lookAt(JOINT.x+0.20, JOINT.y+0.01, JOINT.z-0.20);
    C.fov=24; C.updateProjectionMatrix();
  } else {
  // ⚠ 통로 «안»에서 열을 따라 보면 앞 설비는 옆면만 보인다 — 조작반이 왼쪽(-x)을 향하기 때문이다(실측:
  //   가까운 설비의 HMI 가 통째로 안 보였다). 통로 «바깥»에서 비스듬히 봐야 정면이 선다.
  C.position.set(lerp(-2.15,-1.60,k), lerp(1.80,1.70,k), lerp(5.10,3.75,k));
  C.lookAt(lerp(1.95,2.05,k), lerp(1.26,1.22,k), lerp(-4.6,-5.4,k));
  }

  HMI.draw(t);
  // 신호탑 — 줄을 따라 위상이 조금씩 밀린다. «각자 살아 있다»로 읽히되 깜빡이지는 않는다.
  LAMPS.forEach(l=>{ l.m.emissiveIntensity = 0.34+0.20*Math.sin(t*1.4 - l.idx*0.55); });
  // 경광등: «회전»이라 한 바퀴마다 정면을 스친다. 1.15Hz 고정 — 2Hz 를 넘기면 파티 조명이 된다.
  const ph=(t*1.15)%1, sweep=Math.pow(Math.max(0,Math.sin(ph*Math.PI)),2.6);
  // ⚠ 밝은 방에서는 «빛 번짐»이 잘 안 보인다 — 대신 이 씬에서 채도가 있는 것은 이 빨강뿐이라
  //   눈이 저절로 간다. 램프 자체를 더 태우고(emissive), 주변 번짐은 밝기에 맞춰 올린다.
  REDS.forEach(m=>{ m.emissive.setHex(0xff3b2e); m.emissiveIntensity=0.35+4.2*sweep; });
  GLOWS.forEach(m=>{ m.emissiveIntensity = 0.6+7.5*sweep; });   // 블룸 문턱을 넘겨 번지게 한다
  const beaconOn = !(PIPE && !EMG);
  beacon.intensity    = beaconOn ? 1.0+8.5*sweep : 0;
  beaconFar.intensity = beaconOn ? 0.5+3.6*sweep : 0;
  for(let i=0;i<DN;i++){ const d=DBASE[i];
    dpos[i*3  ]=d.x+Math.sin(t*d.s*0.7+d.ph)*0.08;
    dpos[i*3+1]=d.y+Math.sin(t*d.s    +d.ph)*0.12;
    dpos[i*3+2]=d.z+Math.cos(t*d.s*0.6+d.ph)*0.06; }
  dgeo.attributes.position.needsUpdate=true;
  // 등기구는 «켜져 있다»가 전부다 — 흔들면 형광등이 나가기 직전으로 보인다. 아주 미세하게만.
  SHAFTS.forEach((m,i)=>{ m.material.opacity=0.94+0.02*Math.sin(t*0.8+i*1.7); });
  if(COMP) COMP.render(); else R.render(S,C);
}
// ⚠ 후처리를 끼우면 톤매핑이 «두 번» 걸리거나 «안» 걸릴 수 있다. OutputPass 한 곳에서만
//   걸리도록 렌더러의 톤매핑은 끄고 넘긴다 — 배경색(acesHex)은 같은 곡선을 손으로 계산한
//   값이라 그대로 맞는다.
let COMP=null, BOKEH=null;
if(HQ){
  R.toneMapping=THREE.NoToneMapping;
  COMP=new EffectComposer(R);
  COMP.addPass(new RenderPass(S,C));
  const ao=new GTAOPass(S,C,W,H);
  ao.output=GTAOPass.OUTPUT.Default;
  // 반경은 «설비 크기»가 아니라 «틈 크기»를 따른다 — 루버 슬롯·문 홈이 이 정도다.
  ao.updateGtaoMaterial({radius:0.28, distanceExponent:1.4, thickness:0.6, scale:1.0,
                         samples:16, distanceFallOff:1.0, screenSpaceRadius:false});
  COMP.addPass(ao);
  if(MACRO){
    // 얕은 심도 — 이 등록의 핵심이다. 초점 밖이 녹으면서 «디테일이 없다»가 안 보이게 된다.
    const bk=new BokehPass(S,C,{focus:0.6, aperture:0.0062, maxblur:0.016});
    BOKEH=bk; COMP.addPass(bk);
  }
  // 블룸 — 경광·등기구·금속 하이라이트가 «번져야» 카메라로 찍은 것처럼 보인다.
  COMP.addPass(new UnrealBloomPass(new THREE.Vector2(W,H), MACRO?0.38:0.34, 0.62, MACRO?1.00:1.05));
  const op=new OutputPass(); op.toneMapping=THREE.ACESFilmicToneMapping; COMP.addPass(op);
}
window.seek=seek; window.DUR3D=DUR;
seek(0); window.__ready=true;
</script></body></html>
